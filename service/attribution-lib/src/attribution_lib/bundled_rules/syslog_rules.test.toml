[meta]
runner = "syslog_single_line_mfu"

[[cases]]
description = "unknown xid is interesting"
line = "NVRM: Xid 31"
expect = "interesting"
expected_symptom = "XID-unknown"
expected_rule = "unknown-xid-event"

[[cases]]
description = "known xid matrix"
expansion = "syslog_xid_matrix"
job_phases = ["during", "outside"]
multi_gpu_values = [true, false]

