# --- production parity for migrated applog_leaf_rules.toml stanzas ---------------
# These six declarative leaves (ported out of applog_rules.py) previously had no
# end-to-end case, so process_check never exercised their symptom + credit. Each
# line below is verified to match the stanza's match_re in applog_leaf_rules.toml.

# DistributedTimeoutMinutes: emits Application.megatron-lm.runtime_args with the
# raw captured minutes as a string payload.
[[cases]]
description = "distributed timeout minutes emits application event no node finding"
line = "0: torchrun --distributed-timeout-minutes 30 --other 1"

[[cases.expected_events]]
event_type = "Application.megatron-lm.runtime_args"
rule = "distributed timeout minutes"
payload = { pytorch_timeout_minutes = "30" }

# DistributedInitTimeout: seconds=90 -> int(round(90/60))=2; payload must carry "2".
[[cases]]
description = "distributed init timeout normalizes seconds and emits application event"
line = "0: Initialized distributed training with timeout 90"

[[cases.expected_events]]
event_type = "Application.megatron-lm.runtime_args"
rule = "distributed timeout (init line, normalized)"
payload = { pytorch_timeout_minutes = "2" }

# BusErrorKeyword: generic lowercase "bus error" -> bad "bus error" / "alias else".
[[cases]]
description = "bus error keyword is bad during job"
line = "0: child process exited with bus error"
tflops_start = true
expect = "bad"
expected_symptom = "bus error"
expected_rule = "alias else"

# AddressAlreadyInUse: line passes the when-guard (no ras/client_support.cc NCCL
# bind noise) -> bad "Address already in use" / "address-in-use".
[[cases]]
description = "address already in use keyword is bad during job"
line = "0: OSError: [Errno 98] Address already in use"
tflops_start = true
expect = "bad"
expected_symptom = "Address already in use"
expected_rule = "address-in-use"

# NcclWarnMessageTruncated: dedicated slug, no demotion -> bad even without MFU.
[[cases]]
description = "nccl warn message truncated is bad during job"
line = "0: misc/socket.cc:47 NCCL WARN Message truncated : received 1024 bytes instead of 256"
tflops_start = true
expect = "bad"
expected_symptom = "NCCL invalid NIC selection"
expected_rule = "nccl-invalid-nic-selection"

# No such file or directory: line WITHOUT "error: pyxis:" passes the guard ->
# bad "No such file or directory" / "alias else".
[[cases]]
description = "no such file or directory is bad during job"
line = "0: FileNotFoundError: [Errno 2] No such file or directory: '/data/x'"
tflops_start = true
expect = "bad"
expected_symptom = "No such file or directory"
expected_rule = "alias else"

# MFU: verify the regex matches and emits Application.mfu, including when an
# Nsight progress prefix precedes the timestamp.
[[cases]]
description = "MFU line emits Application.mfu event"
line = " 6143:  [2024-02-23 09:59:14] iteration   516520/  900692 | consumed samples:   1067990784 | elapsed time per iteration (ms): 8096.8 | throughput per GPU (TFLOP/s/GPU): 399.3 | learning rate: 4.838E-05 | decoupled learning rate: 2.190E-04 | global batch size:  2304 | lm loss: 1.437022E+00 | loss scale: 1.0 | grad norm: 0.217 | num zeros: 1640372992.0 | number of skipped iterations:   0 | number of nan iterations:   0 | "
tflops_start = false

[[cases.expected_events]]
event_type = "Application.mfu"
rule = "MFU"

[[cases]]
description = "MFU line with Nsight progress prefix emits Application.mfu event"
line = "[1/1] [=======39%                [2026-05-27 17:14:21] iteration      156/    1000 | consumed samples:         2496 | elapsed time per iteration (ms): 8526.6 | throughput per GPU (TFLOP/s/GPU): 49.5 | learning rate: 6.000000E-04 | global batch size:    16 | lm loss: 5.626674E-03 | loss scale: 1.0 | grad norm: 0.020 | num zeros: 864181824.0 | params norm: 1167.536 | number of skipped iterations:   0 | number of nan iterations:   0 |"
tflops_start = false

[[cases.expected_events]]
