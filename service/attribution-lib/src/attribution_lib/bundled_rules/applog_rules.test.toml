[meta]
runner = "applog_single_line"

[[cases]]
description = "socket start connect bad peers"
runner = "applog_bad_peers"
job_variant = "peer_localhost"
line = "0: socketStartConnect: Connect to 127.0.0.1<48547> failed : No route to host"
expect = "bad"
expected_nodes = ["host-9ad02e1b", "localhost"]
expected_symptom = "No route to host"
expected_rule = "socketStartConnect"

[[cases]]
description = "socket poll connect bad peers"
runner = "applog_bad_peers"
job_variant = "peer_localhost"
line = "0: socketPollConnect: Connect to 127.0.0.1<55877> returned 113(No route to host) errno 115(Operation now in progress)"
expect = "bad"
expected_nodes = ["host-9ad02e1b", "localhost"]
expected_symptom = "No route to host"
expected_rule = "socketPollConnect"

[[cases]]
description = "socket poll connect nccl warn bad peers"
runner = "applog_bad_peers"
job_variant = "peer_localhost"
line = "0: NCCL WARN socketPollConnect: Connect to 127.0.0.1<57685> returned 113(No route to host) errno 115(Operation now in progress)"
expect = "bad"
expected_nodes = ["host-9ad02e1b", "localhost"]
expected_symptom = "No route to host"
expected_rule = "socketPollConnect"

[[cases]]
description = "socket poll connect misc socket bad peers"
runner = "applog_bad_peers"
job_variant = "peer_localhost"
line = "0: host-15f79ed7:688556:691865 [2] misc/socket.cc:533 NCCL WARN socketPollConnect: Connect to 127.0.0.1<24957> returned 113(No route to host) errno 115(Operation now in progress)"
expect = "bad"
expected_nodes = ["host-9ad02e1b", "localhost"]
expected_symptom = "No route to host"
expected_rule = "socketPollConnect"

[[cases]]
description = "socket progress opt bad"
job_variant = "peer_localhost"
line = "0: NCCL WARN socketProgressOpt: Call to recv from 127.0.0.1<28601> failed : Connection reset by peer"
expect = "bad"
expected_node = "localhost"
expected_symptom = "Connection reset by peer"
expected_rule = "socketProgressOpt"

[[cases]]
description = "ipv4 cannot be retrieved bad"
job_variant = "named_hosts"
line = "0: [W socket.cpp:558] [c10d] The IPv4 network addresses of (testnode0-001, 58773) cannot be retrieved (gai error: -2 - Name or service not known)"
expect = "bad"
expected_node = "testnode0-001"
expected_symptom = "network address cannot be retrieved"
expected_rule = "IPv4CannotBeRetrieved"

[[cases]]
description = "client socket timeout bad"
job_variant = "named_hosts"
line = "0: [W212 08:22:52.836046935 TCPStore.cpp:345] [c10d] TCP client failed to connect/validate to host testnode0-002:51955 - retrying (try=0, timeout=120000ms, delay=61638ms): The client socket has timed out after 120000ms while trying to connect to (testnode0-002, 51955)."
expect = "bad"
expected_node = "testnode0-002"
expected_symptom = "client socket has timed out"
expected_rule = "ClientSocketTimeout"

[[cases]]
description = "python attribute error bad"
line = "0: AttributeError: 'Transformer' object has no attribute 'layers'. Did you mean: 'n_layers'?"
expect = "bad"
expected_symptom = "Python bug"
expected_rule = "AttributeTypeError"

[[cases]]
description = "python type error bad"
line = "0: TypeError: object of type 'WebLoader' has no len()"
expect = "bad"
