[[cases]]
description = "cuda error matrix"
job_phases = ["during", "outside"]
line_templates = [
  { description = "nccl warn", template = "0: NCCL WARN Cuda failure {sub_error}" },
  { description = "watchdog terminated", template = "0: NCCL watchdog thread terminated {sub_error}" },
  { description = "ncclCommWatchdog", template = "0: Exception raised from ncclCommWatchdog {sub_error}" },
  { description = "watchdog stuck", template = "0: ProcessGroupNCCL's watchdog got stuck {sub_error}" },
  { description = "watchdog worker", template = "0: detected by watchdog at worker {sub_error}" },
  { description = "watchdog collective", template = "0: Watchdog caught collective operation {sub_error}" },
  { description = "cuda failure quoted", template = "0: Cuda failure '{sub_error}'" },
  { description = "cuda error", template = "0: CUDA error: {sub_error}" },
  { description = "cuda runtime", template = "0: Cuda Runtime ({sub_error})" },
  { description = "cuda short", template = "0: CUDA {sub_error}" },
]

