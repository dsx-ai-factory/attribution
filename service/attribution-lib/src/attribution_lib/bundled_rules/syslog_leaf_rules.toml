[[extractor]]
name         = "SyslogControllerStop"
match_re     = 'Node was stopped by CMDaemon'
emit         = { type = "bad_node", symptom = "Node stopped by controller", derived_rule = "node-stopped-by-controller" }
[[extractor.cases]]
expect  = "bad"
line    = "update_node: node node01 reason set to: Node was stopped by CMDaemon"
