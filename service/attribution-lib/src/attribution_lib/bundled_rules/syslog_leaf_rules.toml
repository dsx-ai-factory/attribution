#
# First real declarative port: the PURE single-leaf syslog rules formerly
# defined as @extractor_def functions in bundled_rules/syslog_rules.py.
#
# Each stanza keeps the Python rule's NAME (e.g. SyslogGspFailure) so the
# declarative engine and the Python side never disagree on identity, and sets
# `derived_rule` to the credit slug the rule emitted via
# source.derived(rule=...) (e.g. "gsp-failure"), so the credited source.rule
# matches main byte-for-byte. `match_re` and `symptom` are copied verbatim from
# main. Parity is enforced by syslog_rules.test.toml through process_check.
#
# Rules NOT ported here (not pure single leaves): SyslogXid (processor),
# SyslogSXid (catalog_lookup), SyslogXidUnknown / SyslogSXidUnknown
# (negative-lookahead over datum), SyslogOomKill (pick_one),
# KubeletContainerOomKilled (branch on container), SyslogLustreError /
# SyslogFmLostConnectionToGpu (try_all), ImexLostConnection (emits on a captured
# node).

author  = "NVIDIA Attribution team"
sources = ["SYSLOG"]


# --- literal-symptom bad_node leaves --------------------------------------------

[[extractor]]
name         = "SyslogGspFailure"
match_re     = ' NVRM: rpcRmApiAlloc_GSP: GspRmAlloc failed'
emit         = { type = "bad_node", symptom = "GspRmAlloc failed", derived_rule = "gsp-failure" }
[[extractor.cases]]
expect  = "bad"
line    = " NVRM: rpcRmApiAlloc_GSP: GspRmAlloc failed"
symptom = "GspRmAlloc failed"

[[extractor]]
name     = "SyslogGspFatalError"
