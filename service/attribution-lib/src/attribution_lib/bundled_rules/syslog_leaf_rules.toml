[[extractor]]
name         = "SyslogImexServiceStop"
match_re     = 'Stopping nvidia-imex\.service'
emit         = { type = "bad_node", symptom = "Stopping nvidia-imex.service", derived_rule = "imex-service-stoppage" }
[[extractor.cases]]
expect  = "bad"
line    = "Stopping nvidia-imex.service"
symptom = "Stopping nvidia-imex.service"

[[extractor]]
name         = "SyslogKernelInvalidMemoryAccess"
match_re     = 'Unable to handle kernel'
emit         = { type = "bad_node", symptom = "kernel invalid memory access", derived_rule = "kernel-invalid-memory-access" }
[[extractor.cases]]
expect  = "bad"
line    = "Unable to handle kernel paging request at virtual address 0000000000000042"
symptom = "kernel invalid memory access"
[[extractor.cases]]
expect  = "bad"
line    = "Unable to handle kernel NULL pointer dereference at virtual address 0000000000000010"
symptom = "kernel invalid memory access"

# Generic kernel die() banner. Matches the classic "Oops:" form and ARM64 tagged
# forms like "Oops - FPAC:" / "Oops - SError:" whether or not the printk-uptime
# prefix survives log forwarding. Excludes slurmd "Internal error: Oops handler"
# debug strings (no colon after Oops / Oops - TAG).
[[extractor]]
name         = "SyslogKernelOops"
match_re     = 'Internal error: Oops(?: - [^:]+)?:'
emit         = { type = "bad_node", symptom = "kernel oops", derived_rule = "kernel-oops" }
[[extractor.cases]]
expect  = "bad"
line    = "[3731104.923279] Internal error: Oops: 0000000096000004 [#1] SMP"
symptom = "kernel oops"
[[extractor.cases]]
expect  = "bad"
line    = "[ 1234.567890] Internal error: Oops: 00000000bf000002 [#1] SMP"
symptom = "kernel oops"
[[extractor.cases]]
expect  = "bad"
line    = "Apr 24 12:04:09 test-node-001 kernel: [3588119.546745] Internal error: Oops: 0000000096000007 [#1] SMP"
symptom = "kernel oops"
[[extractor.cases]]
expect  = "bad"
line    = "[1234.567890] Internal error: Oops - FPAC: 0000000096000045 [#1] SMP"
symptom = "kernel oops"
[[extractor.cases]]
expect  = "bad"
line    = "[1234.567890] Internal error: Oops - SError: 0000000096000045 [#1] SMP"
symptom = "kernel oops"


# --- templated-symptom leaves (captures interpolated) ---------------------------

[[extractor]]
name         = "SyslogKernelStackFrame"
match_re     = 'kernel stack frame pointer at .* in (?P<process>\S+):'
emit         = { type = "bad_node", symptom = "bad kernel stack frame pointer in {process}", derived_rule = "kernel-stack-frame-pointer" }
[[extractor.cases]]
expect  = "bad"
line    = "WARNING: kernel stack frame pointer at 00000000f4bfd280 in pt_main_thread:2697472 has bad value"
symptom = "bad kernel stack frame pointer in pt_main_thread"

# NV_ERR_<CODE> [@ <file:line>]. file_line is an OPTIONAL capture, so the template
# guards it; main does NOT strip, so the trailing space is preserved when absent.
[[extractor]]
name         = "SyslogNvErr"
match_re     = '\[(?P<error_code>NV_ERR_[A-Z_]+)\](?:.*?@ (?P<file_line>[\w\.]+))?'
emit         = { type = "bad_node", symptom = "{error_code} {file_line if file_line else ''}", derived_rule = "NV_ERR_" }
[[extractor.cases]]
expect  = "bad"
line    = "NVRM: nvCheckOkFailedNoLog: Check failed: Ran out of a critical resource, other than memory [NV_ERR_INSUFFICIENT_RESOURCES] (0x0000001A) returned from status @ mem_multicast_fabric.c:2917"
symptom = "NV_ERR_INSUFFICIENT_RESOURCES mem_multicast_fabric.c"
# Absent-file_line branch: main does NOT strip, so the trailing space survives
# (SyslogNvErr fidelity: symptom = f"{error_code} {file_line or ''}").
[[extractor.cases]]
expect  = "bad"
line    = "NVRM: nvCheckOkFailedNoLog: Check failed [NV_ERR_INVALID_STATE] (0x0000001A) returned from status"
symptom = "NV_ERR_INVALID_STATE "

[[extractor]]
name         = "SyslogNvWarn"
match_re     = '\[(?P<warning_code>NV_WARN_[A-Z_]+)\](?:.*?@ (?P<file_line>[\w\.]+))?'
emit         = { type = "interesting_node", symptom = "{warning_code} {file_line if file_line else ''}", derived_rule = "NV_WARN_" }
[[extractor.cases]]
expect  = "interesting"
line    = "[2321]: hadda stop; [NV_WARN_WIDGETS_GIZMOING_TOO_HARD]: returned from status @ mem_multicast_fabric.c:2917"
symptom = "NV_WARN_WIDGETS_GIZMOING_TOO_HARD mem_multicast_fabric.c"
# Absent-file_line branch: trailing space preserved, same as NV_ERR.
[[extractor.cases]]
expect  = "interesting"
line    = "[2321]: hadda stop; [NV_WARN_WIDGETS_GIZMOING_TOO_HARD]: returned from status"
symptom = "NV_WARN_WIDGETS_GIZMOING_TOO_HARD "


# --- shared-slug leaves via derived_rule -----------------------------------------
# SyslogIscsiTimeout and SyslogIscsiConnError are two DISTINCT rules that both
# credit the single finding "iscsi-detected-conn-error"; each keeps its own stanza
# name (matching its Python rule) and sets the shared slug as derived_rule.
[[extractor]]
name         = "SyslogIscsiTimeout"
match_re     = 'connection2:0:\ ping\ timeout'
emit         = { type = "bad_node", symptom = "iSCSI detected conn error", derived_rule = "iscsi-detected-conn-error" }
[[extractor.cases]]
expect  = "bad"
line    = "connection2:0: ping timeout, taking conn down (last ping 2s ago)"
symptom = "iSCSI detected conn error"

[[extractor]]
name         = "SyslogIscsiConnError"
match_re     = 'detected\ conn\ error'
emit         = { type = "bad_node", symptom = "iSCSI detected conn error", derived_rule = "iscsi-detected-conn-error" }
[[extractor.cases]]
expect  = "bad"
line    = "connection2:0: detected conn error (1020)"
symptom = "iSCSI detected conn error"

[[extractor]]
name         = "SyslogNfsNotResponding"
match_re     = 'not\ responding,\ still\ trying'
emit         = { type = "bad_node", symptom = "nfs not responding", derived_rule = "nfs-not-responding" }
[[extractor.cases]]
expect  = "bad"
line    = "nfs: server nfs01 not responding, still trying"
symptom = "nfs not responding"


# --- helper-templated leaves (extract_fn_prefix over `datum`) --------------------
# The symptom prepends the originating kernel function name when the log line
# carried one; the @expr_helper `extract_fn_prefix` (registered in syslog_rules.py)
# does the regex work. See Plan 5a.

[[extractor]]
name     = "SyslogImexShutdown"
match_re = 'Abrupt nvidia-imex daemon shutdown detected, robust channel recovery invoked!'
emit     = { type = "bad_node", symptom = "{extract_fn_prefix(datum, 'Abrupt nvidia-imex daemon shutdown detected, robust channel recovery invoked!')}", derived_rule = "imex-daemon-shutdown" }
[[extractor.cases]]
expect  = "bad"
line    = "imexd: Abrupt nvidia-imex daemon shutdown detected, robust channel recovery invoked!"
symptom = "imexd: Abrupt nvidia-imex daemon shutdown detected, robust channel recovery invoked!"
[[extractor.cases]]
expect  = "bad"
line    = "Abrupt nvidia-imex daemon shutdown detected, robust channel recovery invoked!"
symptom = "Abrupt nvidia-imex daemon shutdown detected, robust channel recovery invoked!"

[[extractor]]
name     = "SyslogRxDetectLinkMask"
match_re = 'Failed to update Rx Detect Link mask!'
emit     = { type = "bad_node", symptom = "{extract_fn_prefix(datum, 'Failed to update Rx Detect Link mask!')}", derived_rule = "update-rx-detect-link-mask-failure" }
[[extractor.cases]]
expect  = "bad"
line    = "imex_worker: Failed to update Rx Detect Link mask!"
symptom = "imex_worker: Failed to update Rx Detect Link mask!"
[[extractor.cases]]
expect  = "bad"
line    = "Failed to update Rx Detect Link mask!"
symptom = "Failed to update Rx Detect Link mask!"
