#
# First real declarative port: the PURE single-leaf syslog rules formerly
# defined as @extractor_def functions in bundled_rules/syslog_rules.py.
#
# Each stanza keeps the Python rule's NAME (e.g. SyslogGspFailure) so the
# declarative engine and the Python side never disagree on identity, and sets
# `derived_rule` to the credit slug the rule emitted via
# source.derived(rule=...) (e.g. "gsp-failure"), so the credited source.rule
# matches main byte-for-byte. `match_re` and `symptom` are copied verbatim from
# main. Parity is enforced by syslog_rules.test.toml through process_check.
#
# Rules NOT ported here (not pure single leaves): SyslogXid (processor),
# SyslogSXid (catalog_lookup), SyslogXidUnknown / SyslogSXidUnknown
# (negative-lookahead over datum), SyslogOomKill (pick_one),
# KubeletContainerOomKilled (branch on container), SyslogLustreError /
# SyslogFmLostConnectionToGpu (try_all), ImexLostConnection (emits on a captured
# node).

author  = "NVIDIA Attribution team"
sources = ["SYSLOG"]


# --- literal-symptom bad_node leaves --------------------------------------------

[[extractor]]
name         = "SyslogGspFailure"
match_re     = ' NVRM: rpcRmApiAlloc_GSP: GspRmAlloc failed'
emit         = { type = "bad_node", symptom = "GspRmAlloc failed", derived_rule = "gsp-failure" }
[[extractor.cases]]
expect  = "bad"
line    = " NVRM: rpcRmApiAlloc_GSP: GspRmAlloc failed"
symptom = "GspRmAlloc failed"

[[extractor]]
name         = "SyslogNumaMemoryExhaustion"
match_re     = 'NVRM: nvAssertFailedNoLog: Assertion failed: \(status == NV_OK\) \|\| \(\(status == NV_ERR_NO_MEMORY\)'
emit         = { type = "bad_node", symptom = "NUMA node memory exhaustion", derived_rule = "numa-node-memory-exhaustion" }
[[extractor.cases]]
expect  = "bad"
line    = "NVRM: nvAssertFailedNoLog: Assertion failed: (status == NV_OK) || ((status == NV_ERR_NO_MEMORY)"
symptom = "NUMA node memory exhaustion"

[[extractor]]
name         = "SyslogEapFailure"
match_re     = ' CTRL-EVENT-EAP-FAILURE EAP authentication failed'
emit         = { type = "bad_node", symptom = "EAP authentication failed", derived_rule = "eap-failure" }
[[extractor.cases]]
expect  = "bad"
line    = " CTRL-EVENT-EAP-FAILURE EAP authentication failed"
symptom = "EAP authentication failed"

[[extractor]]
name         = "SyslogEapSuccess"
match_re     = 'CTRL-EVENT-EAP-SUCCESS EAP authentication completed successfully'
emit         = { type = "bad_node", symptom = "EAP authentication recovery", derived_rule = "eap-success" }
[[extractor.cases]]
expect  = "bad"
line    = "CTRL-EVENT-EAP-SUCCESS EAP authentication completed successfully"
symptom = "EAP authentication recovery"

[[extractor]]
name         = "SyslogSystemPowerDown"
match_re     = 'System is powering down'
emit         = { type = "bad_node", symptom = "System is powering down", derived_rule = "system-powering-down" }
[[extractor.cases]]
expect  = "bad"
line    = "System is powering down"
symptom = "System is powering down"

# Leaf pod-cgroup OOM kill: systemd reports the kill at the kubepods-pod<UUID>.slice level.
[[extractor]]
name         = "SyslogPodSliceOomKill"
match_re     = 'kubepods[\w\-]*-pod[0-9a-f_]+\.slice: A process of this unit has been killed by the OOM killer'
emit         = { type = "bad_node", symptom = "OOM kill of user task", derived_rule = "pod-slice-oom-kill" }
[[extractor.cases]]
expect  = "bad"
line    = "kubepods-besteffort-pod239fec60_2cf7_4396_827c_dc8167f7a1b1.slice: A process of this unit has been killed by the OOM killer."
symptom = "OOM kill of user task"
[[extractor.cases]]
expect  = "bad"
line    = "kubepods-pod239fec60_2cf7_4396_827c_dc8167f7a1b1.slice: A process of this unit has been killed by the OOM killer."
symptom = "OOM kill of user task"
[[extractor.cases]]
expect  = "bad"
line    = "2026-05-06T01:32:32.722348+00:00 test-node-0814 systemd[1]: kubepods-besteffort-pod239fec60_2cf7_4396_827c_dc8167f7a1b1.slice: A process of this unit has been killed by the OOM killer."
symptom = "OOM kill of user task"

[[extractor]]
name         = "SyslogFabricManagerNotPresent"
match_re     = 'NV_ERR_FABRIC_MANAGER_NOT_PRESENT'
emit         = { type = "bad_node", symptom = "NV_ERR_FABRIC_MANAGER_NOT_PRESENT", derived_rule = "fabric-manager-not-present" }
[[extractor.cases]]
expect  = "bad"
line    = "NV_ERR_FABRIC_MANAGER_NOT_PRESENT"
symptom = "NV_ERR_FABRIC_MANAGER_NOT_PRESENT"

[[extractor]]
name         = "SyslogNmiWatchdog"
