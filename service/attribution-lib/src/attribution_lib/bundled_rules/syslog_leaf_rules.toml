symptom = "NV_PGSP_FALCON_IRQSTAT_FATAL_ERROR"
[[extractor.cases]]
expect  = "bad"
line    = "Sep 7 07:20:04 test-node-001 kernel: NVRM: kgspServiceFatalHwError_GB100: NV_PGSP_FALCON_IRQSTAT_FATAL_ERROR FB Poison pending (mask: 0x1)"
symptom = "NV_PGSP_FALCON_IRQSTAT_FATAL_ERROR"
[[extractor.cases]]
expect = "none"
