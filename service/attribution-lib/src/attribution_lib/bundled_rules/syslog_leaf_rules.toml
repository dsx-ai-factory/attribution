[[extractor.cases]]
expect  = "bad"
line    = "NMI watchdog: Watchdog detected hard LOCKUP"
symptom = "NMI watchdog hard LOCKUP"

[[extractor]]
name         = "SyslogGeneralProtectionFault"
match_re     = 'general protection fault'
