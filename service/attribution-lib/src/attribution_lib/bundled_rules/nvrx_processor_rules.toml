#
# Declarative processor stanzas: bespoke NVRX rules whose event production isn't
# a fixed emit shape keep their Python bodies (registered with @rule_processor in
# nvrx_rules.py) while TOML owns identity + matching. Parity via process_check.

author  = "NVIDIA Attribution team"
sources = ["APPLOG"]

[[extractor]]
name      = "NVRXGpuMemReclaimTimeout"
match_re  = '''(?:\[[A-Z]+\]\s+\[(?P<reported_node>[A-Za-z0-9_.-]+)\]\s+)?(?:\[[^\]]+\]\s+)*launcher\.py:\d+\s+Timeout waiting for GPU memory to be reclaimed after (?:\d+(?:\.\d+)?)s\.'''
processor = "nvrx:NVRXGpuMemReclaimTimeout"

[[extractor]]
name      = "NVRXFailureDetected"
match_re  = '''Event:\s+failure_detected\s+Node:\s+(?P<reported_node>[A-Za-z0-9_-]+)(?:\.[^\s]+)?\s+Rank:\s+\d+'''
processor = "nvrx:NVRXFailureDetected"

[[extractor]]
name      = "NVRXUnhealthyNode"
match_re  = '''UnhealthyNodeException:\s+Node\s+(?P<reported_node>[A-Za-z0-9_-]+)(?:\.[^\s]+)?\s+'''
processor = "nvrx:NVRXUnhealthyNode"
