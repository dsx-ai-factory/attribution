#
# Applog pre-filter: exclude and include term lists.
# Ported from bundled_rules/common/applog_prefilter.py.

author  = "NVIDIA Attribution team"
sources = ["APPLOG"]

[prefilter]
exclude = [
    "Setting `pad_token_id`",
    "NCCL INFO",
    "INFO:megatron",
    "WARNING:megatron",
    "NeMo I",
    "using param module",
    "name decoder",
    "json.exception",
    "Launch NCCL",
    "handlers.py:34: UserWarning",
    "OFI Request completed with error",
    "truncated because CLIP",
    "Token indices sequence length is longer",
    "Operation: list objects - Attempt",
    "\\n",
    "\\'",
    "<|eot_id|>",
    "<|start_header_id|>",
    "Preparing custom initialization in the MoE-MLP layer",
    "Checkpoint file not found",
    "[DEBUG] Error processing",
    "libmpg123",
    ".wav:",
    "not a git repository",
    "Whiten Error",
    "tensorflow/stream_executor/platform/default/dso_loader.cc",
    "Installing collected packages",
    "Error parsing requirements for",
    "retry: 0 /",
    "NCCL WARN NCCL Inspector",
    "CUDA kernel errors might be asynchronously reported",
    "[DEBUG",
    "wandb: WARNING",
    "WARNING: shuffle index length",
    "Error comparing answers",
    "from botocore.exceptions",
    "Could not install packages",
    "No such file or directory: '/tmp",
    "you are running uWSGI as root",
    "This is a development server",
    "dist-packages/transformers",
    "dist-packages/torch",
    "megatron/core/dist_checkpointing",
    "failed due to rate limit",
    "Stage 0 - VideoDownloader",
    "Stage 1 - FrameExtractionStage",
    "Stage 2 - TransNetV2ClipExtractionStage",
    "Stage 3 - SplitWriterStage",
    "WARNING:dataverse",
    "does not support per-request generators. Falling back to PyTorch-native implementation",
    "readResponse: Failed to read sqs proxy response body",
    "py_run_labeler_image.binary.runfiles",
    "dlav.plannet.data_labeling.data_labeler",
    "APIServer",
    "results:          [",
    "One of the special magic",
    "Failed to import DrafterBench",
    "DrafterBench evaluation will not be available",
    "nemo_skills.inference.generate",
]
include = [
    "CANCELLED AT",
    "error",
    "Error",
    "ERROR",
    "Errno",
    "errno",
    "WARNING",
    "failed",
    "exception",
    "Exception",
    "peer",
    "Segmentation fault",
    "NODE FAILURE",
    "pushrecv",
    "NCCL version",
    "NCCL WARN Cuda failure",
    "NCCL WARN Message truncated",
    "device is incompatible",
    "insufficient shared memory",
    "Address already in use",
    "exiting program at",
    "end the job",
    "exiting program after",
    "after training is done",
    "validation loss at iteration",
    "Inference job is done",
    "Disk quota exceeded",
    "Argument list too long",
    "Start calculating task metric",
    "clean up dameons",
    "DUE TO TIME LIMIT",
    "Barrier timed out",
    "No CUDA runtime is found",
    'File "',
    "fatal",
    "Done waiting for other agents",
    "Writing temporary files back into original files",
    "watchdog",
    "Main process ended cleanly",
    "wandb",
    "Validating solutions: 100%",
    "test results at the end of training",
    "Stopping cuda profiler",
    "Gracefully skipping multicast initialization",
    "sigkill_handler] Killing subprocess",
    "Avg bus bandwidth",
    "raise ",
    "http.client",
    "compiling and loading fused kernels",
]
