#
# Declarative port of the generic-keyword family formerly stamped by a Python
# loop over _GENERIC_KEYWORD_RULES in bundled_rules/applog_rules.py.
#
# Each row is one (keyword, symptom, credit) tuple, with the bucket logic
# resolved into explicit columns at migration time: symptom defaults to the
# keyword; rows whose original bucket was a "retire now" bucket ("cudaError" /
# "io-error") credit and demote their own symptom, all other rows credit and
# demote their bucket name (e.g. "alias else"). The pattern is the literal
# keyword; the engine re.escape()s it, so regex metacharacters in a keyword
# (parens, dots, backslashes) match literally. Generated rule names are
# "generic-keyword:<keyword>"; parity asserts the CREDIT (source.rule), which
# derived_rule = "{rule}" reproduces. Parity is enforced by
# applog_rules.test.toml through process_check (tests/test_rule_data.py).

author  = "NVIDIA Attribution team"
sources = ["APPLOG"]


[[family]]
name    = "generic-keyword"
pattern = "{key}"
emit    = { type = "bad_node", symptom = "{symptom}", demotion = "{demotion}", derived_rule = "{rule}" }
