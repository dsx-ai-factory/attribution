[project]
name = "nvidia-attribution-client"
dynamic = ["version"]
description = "NVIDIA Attribution Service"
authors = [
    {name = "NVIDIA Corporation"}
]
readme = "README.md"
license = "LicenseRef-NvidiaProprietary"
license-files = ["LICENSE"]
keywords = ["NVIDIA Attribution Service", "OpenAPI", "OpenAPI-Generator"]
requires-python = ">=3.10"

dependencies = [
    "urllib3>=2.7.0,<3.0.0",
    "python-dateutil>=2.8.2",
    "pydantic>=2",
    "typing-extensions>=4.7.1",
]

[project.urls]
Repository = "https://github.com/NVIDIA/attribution"

[tool.hatch.build.targets.sdist]
packages = ["nvidia_attribution_client"]

[tool.hatch.build.targets.wheel]
packages = ["nvidia_attribution_client"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "nvidia_attribution_client/__init__.py"
