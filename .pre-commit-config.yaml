repos:
  - repo: local
    hooks:
      - id: client-drift
        name: regenerate OpenAPI client
        entry: service/service-app/openapi/generate-client.sh --fail-on-change
        language: system
        pass_filenames: false
        # Every input the client is generated from:
        # - routes and schemas
        # - openapi/ holding the templates and extras copied into the package
        # - pyproject.toml pinning the generator
        # - app/__init__.py supplying packageVersion
        # - attribution-lib types embedded in the API models
        files: ^service/(attribution-lib/|service-app/(app/|openapi/|openapi\.json$|nvidia_attribution_client/|pyproject\.toml$|uv\.lock$))
