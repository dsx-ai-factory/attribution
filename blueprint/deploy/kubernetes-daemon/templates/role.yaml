apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-kubernetes-daemon
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [jobset.x-k8s.io]
    resources: [jobsets]
    verbs: [get, list, watch]
{{- if .Values.integrations.kueue.enabled }}
  - apiGroups: [kueue.x-k8s.io]
    resources: [workloads]
    verbs: [get, list, watch]
{{- end }}
{{- if .Values.integrations.kai.enabled }}
  - apiGroups: [scheduling.run.ai]
    resources: [podgroups]
    verbs: [get, list, watch]
{{- end }}
