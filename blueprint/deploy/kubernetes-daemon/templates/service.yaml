apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kubernetes-daemon
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: kubernetes-daemon
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: health
