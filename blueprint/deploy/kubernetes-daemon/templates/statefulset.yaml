apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-kubernetes-daemon
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  serviceName: {{ .Release.Name }}-kubernetes-daemon
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-daemon
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-daemon
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-kubernetes-daemon
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
{{- end }}
      containers:
        - name: kubernetes-daemon
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - --namespace={{ .Release.Namespace }}
            - --cluster-id={{ .Values.clusterId }}
            - --queue-size={{ .Values.queueSize }}
            - --workers={{ .Values.workers }}
            - --watch-timeout-seconds={{ .Values.watchTimeoutSeconds }}
{{- if .Values.watches.pods }}
            - --watch-pods
{{- else }}
            - --no-watch-pods
{{- end }}
{{- if .Values.watches.jobs }}
            - --watch-jobs
{{- else }}
            - --no-watch-jobs
{{- end }}
{{- if .Values.watches.jobsets }}
            - --watch-jobsets
{{- else }}
            - --no-watch-jobsets
{{- end }}
            - --jobset-version={{ .Values.jobsetVersion }}
            - --sqlite-path={{ .Values.storage.sqlite.path }}
            - --retention-days={{ .Values.retentionDays }}
{{- if .Values.integrations.kueue.enabled }}
            - --enable-kueue
            - --kueue-workload-version={{ .Values.integrations.kueue.workloadVersion }}
{{- end }}
{{- if .Values.integrations.kai.enabled }}
            - --enable-kai
            - --kai-pod-group-version={{ .Values.integrations.kai.podGroupVersion }}
{{- end }}
          ports:
            - name: health
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ dir .Values.storage.sqlite.path }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
{{ toYaml .Values.storage.sqlite.accessModes | indent 10 }}
{{- if .Values.storage.sqlite.storageClassName }}
        storageClassName: {{ .Values.storage.sqlite.storageClassName | quote }}
{{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.sqlite.size }}
