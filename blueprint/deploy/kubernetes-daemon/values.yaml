image:
  repository: kubernetes-daemon
  tag: local
  pullPolicy: IfNotPresent

queueSize: 1000
workers: 2
watchTimeoutSeconds: 60
jobsetVersion: v1alpha2
retentionDays: 30

storage:
  sqlite:
    path: /data/placements.db
    size: 1Gi
    accessModes:
      - ReadWriteOnce
    storageClassName: ""

nodeSelector: {}
tolerations: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
