image:
  repository: kubernetes-daemon
  tag: local
  pullPolicy: IfNotPresent

clusterId: default
queueSize: 1000
workers: 2
watchTimeoutSeconds: 60
jobsetVersion: v1alpha2
retentionDays: 30

watches:
  pods: true
  jobs: true
  jobsets: true

integrations:
  kueue:
    enabled: false
    workloadVersion: v1beta1
  kai:
    enabled: false
    podGroupVersion: v2alpha2

storage:
  sqlite:
    path: /data/placements.db
    size: 1Gi
    accessModes:
      - ReadWriteOnce
    storageClassName: ""

nodeSelector: {}
tolerations: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
