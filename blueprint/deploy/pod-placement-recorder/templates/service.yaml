apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-pod-placement-recorder
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: pod-placement-recorder
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: health
      port: 8080
      targetPort: health
