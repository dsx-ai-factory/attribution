apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-pod-placement-recorder
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [kueue.x-k8s.io]
    resources: [workloads]
    verbs: [get, list, watch]
  - apiGroups: [jobset.x-k8s.io]
    resources: [jobsets]
    verbs: [get, list, watch]
