# The dashboard only, on a results database that another installation writes.
# The existing claim must hold the database at dashboard.databasePath, and a
# ReadWriteOnce claim can be mounted by pods on one node only.
image:
  repository: registry.example/attribution
  tag: "1.0.0"

service:
  enabled: false
runner:
  enabled: false

persistence:
  existingClaim: attribution-results
