[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nvidia-attribution-blueprint"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "nvidia-attribution-client",
    "requests>=2.31",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.12",
    "httpx>=0.27",  # required by fastapi.testclient
    "pyyaml>=6.0",  # webui logic (bootstrap/diagnose) reads failures.yml; exercised by base CI without the web server
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
nvidia-attribution-blueprint = "attribution_blueprint.cli:main"
nvidia-attribution-blueprint-web = "attribution_blueprint.webui.cli:main"

[tool.uv.sources]
nvidia-attribution-client = { path = "../service/service-app/nvidia_attribution_client", editable = false }

[tool.hatch.build.targets.wheel]
packages = ["src/attribution_blueprint"]

[tool.hatch.build]
artifacts = [
    "src/attribution_blueprint/webui/static/**",
]
include = [
    "src/attribution_blueprint/**/*.py",
    "src/attribution_blueprint/webui/static/**",
    "src/attribution_blueprint/data/*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires live Attribution Service"]
addopts = "--strict-markers"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
