[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nvidia-attribution-blueprint"
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "nvidia-attribution-client",
    "requests>=2.31",
    "loguru>=0.7",
    "kubernetes>36.0.0",  # 36.0.0 drops the Authorization header for token-based auth
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.12",
    "httpx>=0.27",  # required by fastapi.testclient
    "pyyaml>=6.0",  # webui logic (bootstrap/diagnose) reads failures.yml; exercised by base CI without the web server
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.27",
    "pyyaml>=6.0",
]
pod-placement-recorder = []

[project.scripts]
nvidia-attribution-blueprint = "attribution_blueprint.cli:main"
nvidia-attribution-blueprint-web = "attribution_blueprint.webui.cli:main"
pod-placement-recorder = "attribution_blueprint.connectors.execution_contexts.kueue.pod_placement.recorder.cli:main"

[tool.uv.sources]
nvidia-attribution-client = { path = "../service/service-app/nvidia_attribution_client", editable = false }

[tool.hatch.version]
source = "code"
path = "src/_build_version.py"
expression = "build_version()"

[tool.hatch.build.targets.sdist]
include = [
    "src/attribution_blueprint/**/*.py",
    "src/attribution_blueprint/webui/static/**",
    "src/attribution_blueprint/data/*.yml",
    "src/_build_version.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/attribution_blueprint"]

[tool.hatch.build]
artifacts = [
    "src/attribution_blueprint/webui/static/**",
]
include = [
    "src/attribution_blueprint/**/*.py",
    "src/attribution_blueprint/webui/static/**",
    "src/attribution_blueprint/data/*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires live Attribution Service"]
addopts = "--strict-markers"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
