- id: ibv-wc-loc-len-err
  title: IBV_WC_LOC_LEN_ERR
  aliases:
    - Local Length Error
    - WC LOC LEN ERR
    - IB Error 1
  category: distributed_comm
  likely_owner: ambiguous
  related_readme_anchor: ibv-wc-loc-len-err
  personas:
    tenant_sre:
      title: RDMA local length error on a send or receive
      summary: A verbs Work Request failed because the buffer length did not match the message. In NCCL or MPI runs this surfaces as a transport error on a single rank, often paired with an immediate collective abort.
      impact: The rank that polled this completion fails; the collective stalls or aborts, which usually crashes the whole job.
      action: 'Capture NCCL_DEBUG=INFO and MPI verbose logs, identify the rank and peer that received the WC. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: NCCL/MPI log excerpts, rank-to-node mapping, peer rank, the IBV_WC_LOC_LEN_ERR string, job start time, and the failing collective.
    cloud_operator:
      title: IBV_WC_LOC_LEN_ERR - WR length exceeds scatter buffer or MTU rules
      summary: 'The local HCA reported a length mismatch: a send WR exceeded the receiver''s posted scatter list, or a receive buffer was smaller than the inbound message.'
      impact: Local fault on this QP. Blast radius is per-QP unless the same rule is misposting on many ranks, which then becomes per-job.
      action: Pull mlx5_core dmesg around the timestamp, dump the QP state with mlx5dv tools, confirm sge totals against the inbound message size, and check MTU consistency across the path with ibstat and ibv_devinfo. Escalate to the application owner if the WR posting is wrong.
      support_details: HCA model, firmware, port, peer GUID, full WC dump (wr_id, opcode, byte_len, qp_num, vendor_err), and mlx5_core kernel log around the failure.
  technical_details: |
    IBV_WC_LOC_LEN_ERR (status 1) is generated by the local HCA when the length of a Work Request is invalid for the operation: the inbound message exceeds the posted receive scatter list, the local SGE total length is wrong, or atomic operands are not 8 bytes. It is a local-side fault even when triggered by an inbound send.
  summary: The local HCA rejected a Work Request because buffer length did not match the message; fix the posting rank or the receive buffer sizing.
  signals:
    - kind: log
      pattern: 'IBV_WC_LOC_LEN_ERR'
