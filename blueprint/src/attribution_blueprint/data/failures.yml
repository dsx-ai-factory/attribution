      support_details: Source log path, parser/rule id, full WC dump if available (wr_id, opcode, byte_len, qp_num).
  technical_details: |
    IBV_WC_SUCCESS (numeric value 0) indicates the Work Request completed normally on the Completion Queue. This is the only non-error status defined by the libibverbs ibv_wc_status enum and is not a failure condition.
  summary: WC status 0 means the Work Request completed successfully; if surfaced as a failure, treat it as a detection-rule bug, not a workload issue.
