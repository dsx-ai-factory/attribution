      impact: All work on that CUDA context is lost; subsequent CUDA calls return cudaErrorIllegalAddress until the process restarts.
      action: Re-run with compute-sanitizer memcheck to locate the offending kernel and indexing bug; verify allocation sizes and bounds; rebuild with `-G -lineinfo` and capture the failing input.
