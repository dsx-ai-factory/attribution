- id: connection-timed-out
  title: Connection timed out
  aliases:
  - Connection timed out
  - ETIMEDOUT
  - errno 110
  category: distributed_comm
  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: A connection did not complete before its timeout
      summary: A socket operation reported a timeout. The message alone does not establish whether the peer, network path,
        or application configuration caused it.
      impact: Distributed startup or communication can fail when a rank cannot reach its peer.
      action: Capture the first timeout and the peer IP and port, then compare logs from both ranks for an earlier exit
        or stall. Check the job's network settings against the supported configuration before retrying. If the cause remains
        unclear or the failure recurs, contact your cluster administrator or cloud provider with the evidence below.
      support_details: Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs), plus job ID,
        timestamps, rank-to-node mapping, the complete socket warning, and relevant job-script settings.
  technical_details: '`Connection timed out` is an operating-system error description associated with a connection timeout
    (`ETIMEDOUT`). NVIDIA Attribution''s socket processors emit the captured error reason, including the reason in a `socketPollConnect`
    warning. The registered symptom has outcome `Fail MultiCategory` and priority `LOW_GENERIC`; a more specific symptom
    may determine the final attribution instead.


    This is distinct from `ncclTimeout` and the `Call to ibv_modify_qp failed: eno 110 timeout` variants. Those have separate
    detection paths and documentation. A socket timeout alone does not prove a failed NIC, an NCCL parameter override,
    or a particular peer-side failure.

    '
  summary: A socket operation timed out; correlate the peer and network evidence before assigning a cause.
  signals:
  - kind: log
    pattern: socketPollConnect:.*returned [0-9]+\(Connection timed out\) errno
    note: The socket processor captures Connection timed out as the emitted reason.
  - kind: log
    pattern: 'socketProgressOpt:.*failed : Connection timed out'
    note: Generic socket-progress error reason.
