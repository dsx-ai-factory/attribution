- id: ibv-event-cq-err
  title: IBV_EVENT_CQ_ERR
  aliases:
  - CQ Error
  - Completion Queue Error
  - Completion Queue moved to error state
  category: distributed_comm
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: RDMA completion queue moved to error state
      summary: NCCL or another RDMA library reports a CQ error; completions can no longer be drained, so every QP attached
        to that CQ goes fatal and the collective fails.
      impact: All ranks sharing the affected HCA usually drop out of the collective and the job dies.
      action: Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom
        chain, and source logs).
      support_details: NCCL WARN lines, the IBV_EVENT_CQ_ERR string, rank/node mapping, job ID, timestamp, and NCCL_DEBUG=INFO
        output if available.
  recommended_action:
    operational_state: drain
    remediation_actions:
    - service_required
  technical_details: 'IBV_EVENT_CQ_ERR is delivered when a Completion Queue overruns or hits a protection error. Completions
    cannot be reliably drained from the CQ, and every QP bound to the CQ is moved to the error state and receives IBV_EVENT_QP_FATAL.
    Recovery requires destroying and recreating the affected resources.

    '
  summary: Verbs reported a Completion Queue error; the CQ and all QPs bound to it must be destroyed and recreated before
    RDMA traffic can resume.
  signals:
  - kind: log
    pattern: IBV_EVENT_CQ_ERR
    note: NCCL WARN or libibverbs async-event log
  - kind: log
    pattern: mlx5_core.*CQ.*err
    note: kernel mlx5 log
  - kind: log
    pattern: async event.*CQ error
    note: libibverbs async-event handler
  related:
  - ibv-event-qp-fatal
  - ibv-event-srq-err
  - ib-error-12
  - rdma-fabric-flap
  - pytorch-nccl-watchdog
  references:
  - title: rdmamojo - ibv_get_async_event
    url: https://www.rdmamojo.com/2012/08/02/ibv_get_async_event/
  - title: man7 - ibv_get_async_event(3)
    url: https://man7.org/linux/man-pages/man3/ibv_get_async_event.3.html
  severity: high
  verification: verified
