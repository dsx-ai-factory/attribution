    tenant_sre:
      title: PyTorch cannot find a working numpy
      summary: Verify the container shipped a numpy compatible with the installed torch wheel.
      impact: Any tensor-to-numpy conversion raises `RuntimeError` and the run aborts at import time.
      action: Reinstall a pinned numpy version against the same Python ABI as torch, or rebuild the container with `pip check` clean; do not patch numpy at runtime in shared filesystems.
      support_details: '`pip freeze` for python/torch/numpy, container image digest, Python version, traceback, and `pip check` output.'
    cloud_operator:
      title: Numpy unavailability symptom
      summary: Confirm whether the failure scopes to one image build or every job pulling that tag.
      impact: All jobs running the broken image fail at import; resubmission alone does not help.
      action: Identify the image digest, check the registry build history for a recent numpy or python downgrade, and roll back the published tag if the broken digest is the active default.
      support_details: Container image name and digest, registry build log, list of impacted jobs, and image deployment timeline.
  technical_details: |
    PyTorch raises `RuntimeError: Numpy is not available` from any Tensor-to-NumPy bridge call when `import numpy` fails or the loaded numpy is ABI-incompatible with torch. The most common causes are a corrupted site-packages, a numpy/python ABI skew (Python 3.12 with a wheel built for 3.10), or a broken `LD_LIBRARY_PATH` shadowing the container's BLAS.
  summary: PyTorch could not load numpy; root cause is almost always a container or Python environment problem rather than infrastructure.
  signals:
