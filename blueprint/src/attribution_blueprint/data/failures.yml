    pattern: 'pyxis: enroot mount failure'
    note: slurmd.log
  - kind: log
    pattern: 'bpf\(\) .* (Operation not supported|EOPNOTSUPP)'
    note: enroot start path
  - kind: log
    pattern: 'nvidia-container-cli: mount error'
    note: libnvidia-container
  - kind: log
    pattern: '/run/enroot/.*: Permission denied'
