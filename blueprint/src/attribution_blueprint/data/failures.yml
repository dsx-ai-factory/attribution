- id: high-bit-error-rate-ber
  title: High Bit Error Rate (BER)
  aliases:
  - Raw BER threshold exceeded
  - Effective BER alarm
  - Symbol BER alarm
  - UFM BER warning
  category: distributed_comm
  likely_owner: infrastructure
  related_readme_anchor: high-bit-error-rate-ber
  personas:
    tenant_sre:
      title: Fabric port flagged for elevated bit error rate
      summary: UFM raised a BER alarm on an InfiniBand port carrying this job's traffic; the rate of physical-layer bit errors is above the post-FEC or symbol BER threshold for the link's media class.
      impact: NCCL throughput drops as the HCA spends more cycles on FEC and link-level retries; long jobs may surface sporadic IBV_WC_RETRY_EXC_ERR or NCCL timeouts even though no application error code
        maps directly to BER.
      action: 'Do not retry on the same node-port pair. Capture the job ID, hostname, NCCL rank-to-host mapping, and the alarm timestamp. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: 'Job ID, NCCL_DEBUG=INFO log slice covering the alarm window, the host and HCA name from `NCCL_IB_HCA`, and the UFM event ID if your cluster administrator or cloud provider has already opened one.'
    cloud_operator:
      title: BER above media-class threshold on an InfiniBand link
      summary: The port's raw, symbol, or effective BER (post-FEC) crossed the threshold defined for its FEC scheme (Low_Latency_RS_FEC_PLR for DAC/ACC/AOC <100m, KP4 RS-FEC for AOC >100m), pointing at
        a physical-layer fault on the cable, transceiver, connector, or HCA SerDes.
      impact: Sustained high BER drives elevated `SymbolErrors` and `LocalLinkIntegrityErrors`, degrades effective bandwidth for every QP that traverses the port, and eventually trips upper-layer retries
        and link resets across the leaf.
      action: 'Identify the impaired port via UFM, run `mlxlink -d <pci> -m -c -e` to read FEC histograms and eye-margin data, clear and re-read counters with `perfquery -R -x <lid> <port>` to confirm the rate is sustained, then remediate in order: clean the optics, reseat the cable on both ends, swap the transceiver, and if the counter follows the HCA port, open a support case with your hardware vendor. Cordon the host while the swap is pending.'
      support_details: '`mlxlink` PHY/FEC dump, before/after `perfquery -x` extended counters, UFM telemetry CSV for the port, switch-side counter snapshot, cable serial numbers from `mlxcables`, and the
        cordon/drain decision record.'
  technical_details: 'InfiniBand BER is reported at three layers, each governed by a different threshold. Raw BER should not exceed 1e-5 for sustained operation. Effective BER must beat 1e-15 for steady-state HCA-to-switch links. UFM evaluates each port against the threshold table for its FEC scheme. When the measured rate crosses Warning or Error, UFM raises a BER event and the port is suspect for a physical-layer fault.'
  summary: A UFM BER alarm fired because the port's raw, symbol, or post-FEC bit error rate exceeded the threshold for its FEC scheme.
  signals:
  - kind: metric
    pattern: PortRcvErrors increasing on UFM-flagged port
    note: IB extended counter; canonical name from kernel infiniband sysfs counters.
  - kind: metric
    pattern: SymbolErrors > 0 sustained
    note: Per-port symbol error counter; non-zero indicates physical-layer faults.
  - kind: metric
    pattern: effective_ber > 1e-15 OR raw_ber > 1e-5
    note: UFM telemetry threshold breach; KP4 RS-FEC links may use 1e-10 warning band.
  - kind: metric
    pattern: mlxlink FEC histogram skew or low margin
    note: PHY-level confirmation that the link is running with degraded eye margin.
  related:
