- id: rdma-cm-event-disconnected
  title: RDMA_CM_EVENT_DISCONNECTED
  aliases:
    - CM Event Disconnected
  category: distributed_comm
  likely_owner: ambiguous
  related_readme_anchor: rdma-cm-event-disconnected
  personas:
    tenant_sre:
      title: RDMA CM connection disconnected
      summary: The connection between the local and remote endpoints was torn down. The associated QP transitioned to the error state and outstanding work requests were flushed. Mid-job, this means the peer disconnected, the peer crashed, or the fabric dropped the connection.
      impact: The affected rank fails on flushed WRs; the collective aborts. If the disconnect was orderly (job teardown), it is not a failure.
      action: 'Capture NCCL/MPI logs and check whether the disconnect coincided with job end (orderly) or mid-run (failure). For mid-run disconnects, contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: NCCL/MPI logs, rank/node mapping, peer rank/node, timestamp, and whether job end overlaps the disconnect.
    cloud_operator:
      title: RDMA_CM_EVENT_DISCONNECTED - QP teardown, in or out of band
      summary: rdma_cm reports the peer disconnected. Mid-job this is a peer or fabric event; at job end it is orderly. The QP enters error state and pending WRs flush.
      impact: Per-connection. Mid-job disconnects against the same peer point to that peer; many disconnects at once point to the fabric.
      action: Correlate timestamp with the application's job teardown logs. Mid-job, pull mlx5_core dmesg, ibstat counters (link_downed, port_xmit_discards), peer-node health (XID, kernel events), and UFM port events. Recover the QP per spec by transitioning it to Reset.
      support_details: Both endpoints' HCA model, firmware, peer GUID, mlx5_core kernel log, ibstat counters, peer-node syslog/dmesg, UFM port-event timeline.
  technical_details: |
    RDMA_CM_EVENT_DISCONNECTED is generated on both sides in response to rdma_disconnect. The associated QP transitions to the error state, all posted Work Requests are flushed, and the user must transition the QP to Reset before reuse.
  summary: An rdma_cm connection was disconnected; correlate with job teardown for orderly cases or investigate peer/fabric for mid-run disconnects.
  signals:
    - kind: log
      pattern: 'RDMA_CM_EVENT_DISCONNECTED'
      note: rdma_cm event line
  related:
