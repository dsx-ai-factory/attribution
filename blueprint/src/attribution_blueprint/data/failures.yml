- id: call-to-ibv-modify-qp-failed-eno-110-timeout
  title: 'Call to ibv_modify_qp failed: errno 110 (ETIMEDOUT)'
  aliases:
  - ibv_modify_qp ETIMEDOUT
  - ibv_modify_qp Connection timed out
  - eno 110 timeout
  category: distributed_comm
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: ibv_modify_qp timed out reaching the peer HCA
      summary: The kernel verbs command `ibv_modify_qp` returned ETIMEDOUT (110) during the INIT -> RTR or RTR -> RTS transition
        because the destination QP did not respond.
      impact: The local rank cannot bring the QP to RTS, so NCCL aborts the communicator; all peers waiting on this rank stall
        until job timeout.
      action: Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom
        chain, and source logs).
      support_details: NCCL log with the ETIMEDOUT line, the peer rank/host, and the value of NCCL_IB_MQP_RETRY_ALL at the
        time of the failure.
  recommended_action:
    operational_state: drain
    remediation_actions:
    - service_required
  technical_details: 'ETIMEDOUT (errno 110) from `ibv_modify_qp` indicates the kernel/HCA

    firmware command timed out before the verb completed. In RC RoCE

    flows this is overwhelmingly a fabric-reachability problem during

    the IBV_QPS_RTR or IBV_QPS_RTS transition: the local NIC cannot

    complete the path resolution to the destination GID. Common root

    causes are IB/RoCE link flaps, congested or mis-configured PFC,

    and 802.1X EAP re-authentication failures. The NCCL setting `NCCL_IB_MQP_RETRY_ALL=1` retries the

    modify on transient drops but does not address persistent fabric

    faults, which require node drain and remediation.

    '
  summary: ibv_modify_qp returned ETIMEDOUT because the kernel verbs command could not resolve the path to the destination
    QP.
  signals:
  - kind: log
