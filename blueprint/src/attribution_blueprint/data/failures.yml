- id: ibv-wc-retry-exc-err
  title: IBV_WC_RETRY_EXC_ERR
  aliases:
    - Transport Retry Counter Exceeded
    - WC RETRY EXC ERR
    - IB Error 12
  category: distributed_comm
  likely_owner: infrastructure
  related_readme_anchor: ibv-wc-retry-exc-err
  personas:
    tenant_sre:
      title: RDMA transport retries exhausted - peer or fabric not responding
      summary: The HCA retried the request the configured number of times without an ACK from the peer. In NCCL/MPI this is the classic symptom of a fabric flap, a peer node freeze, or a port going down mid-job. The sender is rarely at fault.
      impact: The sending rank fails; the collective aborts and typically takes the job with it.
      action: 'Capture NCCL_DEBUG=INFO logs, identify both the failing rank and the peer rank. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: NCCL/MPI logs, rank/node mapping, peer rank/node, the IBV_WC_RETRY_EXC_ERR line, the timestamp, and any concurrent slowdowns reported by other ranks.
    cloud_operator:
      title: IBV_WC_RETRY_EXC_ERR - transport retry counter exhausted
      summary: HCA gave up after the configured retry_cnt without receiving ACKs from the responder. Almost always points to fabric loss (link flap, switch fault) or a frozen/dead peer rather than the sender.
      impact: Per-QP at the sender, but the underlying fabric or peer fault frequently affects many flows simultaneously.
      action: Check ibstat and port counters (link_downed, symbol_error, port_xmit_discards) on both endpoints, pull mlx5_core dmesg, query UFM for port and switch events at the timestamp, ping the peer GUID, and inspect the peer node for hangs (kernel softlockup, GPU XID, PSU). If the fabric is clean, escalate to the peer node owner.
      support_details: HCA model, firmware, port, peer GUID, full WC dump, ibstat counters from both ends, mlx5_core kernel log, UFM port/switch event timeline, peer node health snapshot.
  technical_details: |
    IBV_WC_RETRY_EXC_ERR (status 12) is reported when the requester's transport retry counter is exhausted before the responder ACKs the request. Causes include link flaps, switch or cable faults, an unreachable or hung peer, and packet loss in the fabric. It is the canonical signal that the failure is fabric-side or peer-side, not in the sender's application.
  summary: The HCA gave up after exhausting transport retries; investigate the fabric path and peer node liveness, not the sender.
  signals:
    - kind: log
      pattern: 'IBV_WC_RETRY_EXC_ERR'
      note: NCCL WARN / verbs library
    - kind: log
      pattern: 'wc\.status\s*=?\s*12\b'
      note: numeric WC status 12
    - kind: log
      pattern: 'transport retry counter exceeded'
      note: humanized verbs error string
    - kind: log
      pattern: '\bIB Error[- ]?12\b'
      note: legacy FACT label
  related:
    - ib-error-12
    - rdma-fabric-flap
    - ibv-wc-rnr-retry-exc-err
    - ibv-wc-resp-timeout-err
    - ibv-wc-wr-flush-err
