    The catalog classifies this as primarily an application bug (illegal pointer, OOB, use-after-free) but rare hardware or
    driver faults are also possible. Compute Sanitizer memcheck and cuda-gdb are the recommended app-side debug tools.

    '
  summary: GPU MMU rejected an illegal memory access (XID 31); typically an application pointer bug, occasionally hardware.
