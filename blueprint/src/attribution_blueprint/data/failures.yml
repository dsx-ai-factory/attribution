- id: bad-kernel-stack-frame-pointer
  title: bad kernel stack frame pointer
  aliases:
  - bad stack frame pointer
  - kernel stack frame pointer
  - kernel BUG bad frame pointer
  category: storage
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: Linux kernel oops on the node hosting your job
      summary: The Linux kernel logged a "bad stack frame pointer" oops while servicing a syscall - frequently from a filesystem
        path. Your process did not corrupt the kernel; the node did.
      impact: The rank running on that node typically dies with EIO, a stuck syscall, or SIGBUS, and the distributed job aborts.
        The node is unsafe to reuse until rebooted.
      action: Your remediation system should first restart the affected node's operating system (a VM reboot on a virtualized
        GPU, a host-level reboot on bare metal). If the job still fails on this node, contact your cluster administrator or
        cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).
      support_details: Job ID, hostlist with rank-to-node mapping, the exact timestamp the rank died, and the last 200 lines
        of stdout/stderr from that rank.
  recommended_action:
    operational_state: drain
    remediation_actions:
    - restart_os
    - service_required
  technical_details: 'A "bad stack frame pointer" oops is a Linux kernel BUG triggered when the unwinder finds a frame-pointer
    value that does not match the expected stack layout. It indicates kernel-side memory corruption or a driver bug, not user-space
    wrongdoing. Observed in storage-adjacent kernel paths under heavy-IO workloads on some kernel/firmware combinations. Recovery
    requires a reboot - the kernel cannot be trusted after the oops, even if userspace continues to run.

    '
  summary: The Linux kernel logged a frame-pointer oops on the node; drain and reboot the node and treat any in-flight job
    on it as collateral damage.
  signals:
  - kind: log
    pattern: bad (?:kernel )?stack frame pointer
    note: kernel oops header in dmesg
  - kind: log
    pattern: kernel BUG at .*\.c:\d+
    note: paired BUG line
  - kind: log
    pattern: 'Call Trace:'
    note: oops body in dmesg
  related:
  - lustreerror
  - stale-file-handle
  - lustre-client-evicted
  references:
  - title: Linux kernel oops decoding (kernel.org)
    url: https://www.kernel.org/doc/html/latest/admin-guide/bug-hunting.html
  - title: man7 - dmesg(1)
    url: https://man7.org/linux/man-pages/man1/dmesg.1.html
  severity: high
  verification: verified
  last_reviewed: 2026-04-26
