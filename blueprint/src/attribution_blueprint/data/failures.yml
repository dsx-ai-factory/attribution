      summary: 'The job hit a Pyxis error that was not mapped to a specific message; the actual cause is on the line above `error: pyxis` in the slurm log.'
      impact: Your step terminates immediately with no rank output; retry without changing parameters usually fails the same way.
      action: 'Pull the `pyxis:` log line that precedes `error: pyxis`, retry once on a different node, and if the same message reappears open a support case with your cloud or GPU provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
