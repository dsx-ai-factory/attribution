  technical_details: The workflow for XID 13 distinguishes hardware suspicion from application bugs by clustering events on
    (GPU UUID, GPC, TPC, SM). Compute Sanitizer memcheck instruments the running app and reports the offending line of code
    for the illegal access. If the issue persists, refer to official NVIDIA documentation.
  summary: Cluster XID 13 faults by SM/TPC/GPC. Faults that repeat on the same hardware unit across users point to hardware;
    non-repeating faults route to the user as an application issue.
