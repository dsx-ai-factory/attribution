        points to a peer-side bug, a corrupted packet on the wire, or mismatched verbs library versions.
      impact: The failing rank crashes; the collective aborts. If reproducible against a specific peer, the peer is the suspect.
      action: Capture NCCL/MPI logs, identify both ranks. Contact your cluster administrator or cloud provider. Include the
        NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).
      support_details: NCCL/MPI logs, rank/node mapping, peer rank/node, the IBV_WC_BAD_RESP_ERR line, and the failing collective.
  technical_details: 'IBV_WC_BAD_RESP_ERR (status 7) is generated when the local HCA receives a response from the responder
    whose transport opcode is unexpected for the outstanding request. Common causes include peer QP firmware bugs, on-wire
    corruption, or mismatched verbs implementations between endpoints.

    '
  summary: An unexpected transport opcode came back from the peer; investigate the peer's verbs stack, firmware parity, and
    port-error counters.
