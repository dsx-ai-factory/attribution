- id: ib-error-12-vendor-129
  title: IB Error-12 Vendor-129
  aliases:
  - IB Error-12
  - Vendor-129
  - IBV_WC_RETRY_EXC_ERR
  - retry exceeded
  category: distributed_comm
  likely_owner: infrastructure
  related_readme_anchor: ib-error-12-vendor-129
  personas:
    tenant_sre:
      title: InfiniBand retry count exceeded - the fabric path failed
      summary: An RDMA send exhausted its transport retries without an ACK from the peer. The fabric or the peer node dropped the traffic.
      impact: The collective aborts. The job must restart, ideally on a different allocation if a specific node is suspect.
      action: 'Capture the NCCL WARN, the local HCA/port, and the peer IP if shown. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: NCCL trace excerpt with the verbs error, HCA and port, peer IP if present, hostlist, job ID, and time.
    cloud_operator:
      title: IBV_WC_RETRY_EXC_ERR (Error-12, Vendor-129) - RC retry exhausted
      summary: An RC QP exhausted its retransmit budget on a verbs operation. Indicates packet loss on the path or an unresponsive peer.
      impact: All QPs over the affected path fail; usually job-wide because the collective deadlocks.
      action: Walk both ends - local and peer ibstat, port counters (PortRcvErrors, SymbolErrors, LinkDowned), switch event log, UFM congestion data. Look for paired port-error / link-down events. Tune NCCL_IB_TIMEOUT/NCCL_IB_RETRY_CNT only after the underlying physical issue is ruled out.
      support_details: ibstat and ibv_devinfo on both ends, switch and UFM port counter deltas, NCCL trace, env dump for NCCL_IB_*, recent maintenance/firmware changes.
  technical_details: |
    Verbs work-completion status 12 is IBV_WC_RETRY_EXC_ERR. Vendor syndrome 0x81 (decimal 129) is the Mellanox-specific code reported alongside it. It means the RC sender retransmitted a packet up to the configured retry count without receiving an ACK, so the QP transitions to error state. Common physical causes are cable/transceiver faults, switch port flaps, congestion-induced loss, or a peer HCA in an unhealthy state.
  summary: An InfiniBand RC connection exceeded its transport retry budget; the path or the peer is failing - escalate to the fabric team.
  signals:
  - kind: log
    pattern: 'IBV_WC_RETRY_EXC_ERR'
    note: verbs work-completion status
  - kind: log
    pattern: 'Error[- ]?12.*Vendor[- ]?129|transport retry counter exceeded'
    note: NCCL or verbs surfacing the error
  - kind: log
    pattern: 'NCCL WARN NET/IB.*ibv_poll_cq.*status=12'
    note: typical NCCL WARN line
