      title: CUDA could not allocate the requested memory
      summary: A CUDA allocation API (cudaMalloc, cudaMallocManaged, cudaMallocAsync, etc.) failed because the runtime could not satisfy the memory or resource request.
      impact: The allocation returns null and the API returns this error; subsequent kernels using that buffer will not run.
      action: Capture the requested size, current free memory from cudaMemGetInfo, and the offending call. Reduce batch size or working-set, or release earlier allocations before retrying.
      support_details: Frequently caused by application-side fragmentation, leaks, or oversized batch shapes. Persistent failures across jobs on the same GPU may indicate a hardware or driver-side issue.
