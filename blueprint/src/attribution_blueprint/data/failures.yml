  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: Container could not be mounted on the node
      summary: Enroot could not mount a path before the container started. NVIDIA Attribution distinguishes failures under
        user directories from failures under system directories.
      impact: Startup fails before the entrypoint runs; that timing alone does not establish infrastructure ownership.
      action: |-
        1. Read the full mount error. For a named source path, check access on the assigned compute node as the workload user, where permitted. The container may not have started. A login-node check is insufficient.

        2. Compare user-supplied paths with `--container-mounts`. Correct a typo or mapping you control, using guidance for the installed Pyxis and Enroot versions. Retry startup once after the correction and verify container startup and the application's required read or write access; do not overwrite application data just to test a mount.

        3. If the job configuration is not yours to change, contact the person or team responsible for your application. For runtime errors, unavailable paths, permissions outside your control, unavailable node access, or a failed retry, stop and contact your cluster administrator or cloud provider. Do not change host permissions, runtime services or shared storage settings.
      support_details: Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs) when available,
        workload identifier, full mount error, mount arguments, affected nodes, installed Pyxis/Enroot versions if visible,
        and access checks and retry results. Identify unavailable node access. Share only evidence you can access; redact
        credentials and private application data. When asking for help, send the evidence available to you and say what
        is missing; do not delay the request because a diagnostic report or restricted logs are unavailable.
  technical_details: 'Pyxis invokes enroot during container startup. A mount failure prevents the entrypoint from running,
    but it can originate in either a job-supplied path or the platform''s runtime configuration.


    NVIDIA Attribution examines `enroot-mount: failed to mount: <source> at <target>`:


    - Sources beginning with `/home/` or `/lustre/` emit `pyxis: enroot mount failure from user directory`, classified
    as `Fail User`.

    - Other source paths emit `pyxis: enroot mount failure from system directory`, classified as `Fail InfraSW`, unless
    the line contains `No such file or directory`. That case emits the separate `pyxis: enroot mount path not found` symptom.


    This is a path-based heuristic, not proof of the underlying cause. An outage of shared storage can affect a user path.
    Preserve the exact symptom, source path, and error text, then use runtime and storage evidence to choose the remediation.
    The two aliases declare documentation coverage only; they do not merge the outcomes.

    '
  severity: high
  summary: Enroot could not mount a container path; NVIDIA Attribution distinguishes user-directory (Fail User) and system-directory
    (Fail InfraSW) failures.
  signals:
  - kind: log
    pattern: 'enroot-mount: failed to mount:\s*/(?:home|lustre)/\S+\s+at\s+'
    note: User-directory branch.
  - kind: log
    pattern: '^(?!.*No such file or directory).*enroot-mount: failed to mount:\s*(?!/home/)(?!/lustre/)\S+\s+at\s+'
    note: System-directory failure on a single log line; excludes user paths and the separate missing-path branch.
  - kind: log
    pattern: 'pyxis: enroot mount failure'
    note: slurmd.log
  - kind: log
    pattern: bpf\(\) .* (Operation not supported|EOPNOTSUPP)
    note: enroot start path
  - kind: log
    pattern: 'nvidia-container-cli: mount error'
    note: libnvidia-container
  - kind: log
    pattern: '/run/enroot/.*: Permission denied'
    note: runtime path issue
