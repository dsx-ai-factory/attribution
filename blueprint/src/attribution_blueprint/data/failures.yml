  category: distributed_comm
  likely_owner: developer
  related_readme_anchor: ibv-wc-loc-access-err
  personas:
    tenant_sre:
      title: Local access error on inbound RDMA Write or atomic
      summary: 'The HCA received an RDMA Write-with-Immediate or atomic that targeted a local buffer whose MR access permissions do not allow the operation. This is an MR-registration bug: the MR was not registered with the right IBV_ACCESS_REMOTE_WRITE or IBV_ACCESS_REMOTE_ATOMIC flag.'
      impact: The targeted rank fails; the collective aborts. Reproduces deterministically against the same code path.
      action: 'Capture NCCL/MPI logs and the failing rank. Audit the local MR registration for the buffer the peer targeted - the access flags must match the operation. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: NCCL/MPI logs, rank/node mapping, peer rank, MR access flags used, the buffer virtual address, and the IBV_WC_LOC_ACCESS_ERR line.
    cloud_operator:
      title: IBV_WC_LOC_ACCESS_ERR - inbound RDMA blocked by local MR access flags
      summary: Responder HCA blocked an inbound RDMA Write or atomic because the targeted MR was not registered with the matching remote-access permission. Local-side fault on the receiver, even though the peer initiated.
      impact: Per-MR/per-process. Fabric is not implicated.
      action: Inspect mlx5_core dmesg for MR access errors, read back the MR access flags via mlx5dv tooling, and confirm the application registered the buffer with IBV_ACCESS_REMOTE_WRITE or IBV_ACCESS_REMOTE_ATOMIC as needed. Hand to the application owner.
      support_details: HCA model, firmware, MR access flags, full WC dump (vendor_err identifies the access check), mlx5_core kernel log.
  technical_details: |
    IBV_WC_LOC_ACCESS_ERR (status 8) is reported on the responder when an inbound RDMA Write-with-Immediate or atomic operation targets a local Memory Region whose access flags do not permit the operation. The fault is local to the receiver because its MR is misconfigured, not the sender.
  summary: An inbound RDMA Write or atomic was blocked by local MR access flags; widen the MR's remote-access permissions or fix the buffer registration.
  signals:
