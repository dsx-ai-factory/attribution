- id: workflow-xid-13
  title: XID 13 triage - cluster faults by SM/TPC/GPC to distinguish application bugs from hardware faults
  aliases:
  - XID 13 triage workflow
  - GR SW Notify decision tree
  category: gpu
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: How your cluster administrator triages your XID 13
      summary: SREs decide whether your XID 13 is an app bug or a hardware fault by checking whether the same SM/TPC/GPC keeps
        faulting across runs.
      action: Restart the application using the GPU; the GPU itself is not considered faulted. If the job still fails on this
        node, contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom
        chain, and source logs).
