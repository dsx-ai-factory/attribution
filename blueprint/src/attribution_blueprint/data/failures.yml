- id: ibv-wc-loc-rdd-viol-err
  title: IBV_WC_LOC_RDD_VIOL_ERR
  aliases:
    - Local RDD Violation
    - WC LOC RDD VIOL ERR
    - IB Error 14
  category: distributed_comm
  likely_owner: developer
  related_readme_anchor: ibv-wc-loc-rdd-viol-err
  personas:
    tenant_sre:
      title: Local Reliable-Datagram-Domain mismatch (RD transport)
      summary: The QP's Reliable Datagram Domain does not match the EEC's RDD. This is RD-transport only, which is essentially never used by NCCL/MPI on modern HCAs.
      impact: The failing rank crashes if the workload truly uses RD; otherwise the status is suspect.
      action: 'Confirm whether the workload uses RD. If yes, audit the RDD setup at QP and EEC creation. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: NCCL/MPI logs, rank/node mapping, transport type, RDD identifiers, and the IBV_WC_LOC_RDD_VIOL_ERR line.
    cloud_operator:
      title: IBV_WC_LOC_RDD_VIOL_ERR - QP and EEC RDD mismatch on RD
      summary: Reliable Datagram domain on the QP does not match the EEC's RDD. Applies only to the RD transport, which is not implemented on most current HCAs.
      impact: Per-QP/EEC. On HCAs without RD support, the status is essentially unreachable and indicates a driver or vendor anomaly.
      action: Verify ibv_devinfo for RD capability, capture mlx5_core dmesg, file a vendor case if RD is not in the device caps. Otherwise validate RDD configuration in the application.
      support_details: HCA model, firmware, ibv_devinfo, full WC dump, mlx5_core kernel log.
  technical_details: |
    IBV_WC_LOC_RDD_VIOL_ERR (status 14) is generated when the Reliable Datagram Domain associated with the QP does not match the RDD associated with its End-to-End Context. RD is a legacy IB transport rarely supported by modern hardware.
  summary: A QP/EEC Reliable-Datagram-Domain mismatch was detected; verify RD support and RDD configuration, otherwise treat as a driver anomaly.
  signals:
    - kind: log
      pattern: 'IBV_WC_LOC_RDD_VIOL_ERR'
