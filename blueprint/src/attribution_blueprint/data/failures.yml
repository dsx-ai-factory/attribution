- id: high-symbol-effective-errors
  title: High Symbol/Effective Errors
  aliases:
  - SymbolErrors counter elevated
  - Effective errors EDR alarm
  - PortRcvErrors elevated
  - UFM symbol error event
  category: distributed_comm
  likely_owner: infrastructure
  related_readme_anchor: high-symbol-effective-errors
  personas:
    tenant_sre:
      title: Port reporting symbol or effective errors after FEC
      summary: UFM flagged a port where post-FEC errors are reaching the link layer, meaning FEC could no longer mask all of the underlying physical-layer noise.
      impact: Even a small post-FEC error rate visibly cuts NCCL goodput and can produce intermittent retry-exceeded warnings; this is a fabric-side symptom, not a job-side bug.
      action: 'Record job ID, host list, NCCL_IB_HCA, and the alarm timestamp; do not pin re-runs to the affected host. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: 'NCCL_DEBUG=INFO output around the alarm time, job-to-host mapping, and the UFM event ID once your cluster administrator or cloud provider has triaged.'
    cloud_operator:
      title: Symbol and effective error counters above threshold
      summary: '`SymbolErrors` (NDR/HDR) or effective errors (EDR) on the port are non-zero and rising, indicating uncorrected physical-layer events that bypass FEC and are observed by the IB link layer.'
      impact: Each effective error forces a link-level retransmit and can cascade into `PortRcvErrors`, `LocalLinkIntegrityErrors`, and eventually link resets that flap traffic for every QP traversing the
        port.
      action: Pull extended counters with `perfquery -x <lid> <port>` before and after `perfquery -R` to confirm the rate is sustained, run `mlxlink` to read FEC and eye-margin data, reseat or swap the
        cable and transceiver, and escalate to HCA replacement if the counter does not clear after a clean swap.
      support_details: '`perfquery -x` output, `mlxlink` PHY dump, UFM port telemetry, switch-side counter snapshot, cable/transceiver serials, and remediation steps already taken.'
  technical_details: 'In the canonical IB counter set (kernel infiniband sysfs and

    `perfquery(8)`), `SymbolErrors` counts 8b/10b or 64b/66b decoding

    violations on the receive side; on EDR and below this is the

    primary post-FEC visibility metric. On HDR and NDR, FEC catches

    most lane-level corruption, so symbol errors are reported through

    the extended/effective error counters that UFM exposes as

    "effective errors". An "effective" error has, by definition,

    escaped FEC and reached the IB link layer, where it triggers a

    retransmit and increments `PortRcvErrors`. Sustained non-zero

    counts indicate a physical-layer issue (cable, optic, connector,

    SerDes), not a software fault.

    '
  summary: Port-level symbol or effective error counters are above zero, meaning FEC failed to fully mask physical-layer corruption.
  signals:
  - kind: metric
    pattern: SymbolErrors > 0
    note: Kernel infiniband sysfs counter; any non-zero rate is suspect on EDR/HDR.
  - kind: metric
    pattern: PortRcvErrors increasing
    note: Receive-side error counter; rises with effective errors.
  - kind: metric
    pattern: LocalLinkIntegrityErrors > 0
    note: Companion IB counter that often co-flags with symbol errors.
  - kind: metric
    pattern: UFM effective_errors_threshold breach
    note: UFM raises this when post-FEC errors exceed the per-FEC-scheme threshold.
  related:
  - high-bit-error-rate-ber
  - high-plr-receive-code-err
  - high-plr-transmission-retry-events
  - rdma-fabric-flap
  references:
  - title: InfiniBand sysfs - kernel infiniband port counters
    url: https://www.kernel.org/doc/html/latest/infiniband/sysfs.html
  - title: man7 - perfquery(8)
    url: https://man7.org/linux/man-pages/man8/perfquery.8.html
  - title: NVIDIA UFM Enterprise Documentation
    url: https://docs.nvidia.com/networking/software/management-software/index.html
  severity: high
  verification: verified
  last_reviewed: 2026-04-26
- id: high-plr-receive-code-err
  title: High PLR Receive Code Err
  aliases:
  - PLR uPHY decode errors
  - Physical Link Reliability receive code error
  - UFM PLR receive code alarm
  category: distributed_comm
  likely_owner: infrastructure
  related_readme_anchor: high-plr-receive-code-err
  personas:
    tenant_sre:
      title: Receiver could not decode incoming PHY codewords
      summary: A UFM alarm reports that the Physical Link Reliability (PLR) layer on the receive side of an IB port is failing to decode incoming codewords above the configured threshold.
      impact: This is a physical-layer fault that produces increased link-level retransmits and visibly degrades NCCL bandwidth on flows that traverse the port; the application sees only secondary symptoms
        such as slow allreduces or sporadic retry-exceeded warnings.
      action: 'Capture the job ID, host-to-rank mapping, NCCL_DEBUG=INFO log around the alarm window, and pass them to your cluster administrator or cloud provider; do not re-run on the same host until the port is cleared.'
      support_details: Job ID, NCCL_IB_HCA value, alarm timestamp, and any IBV_WC_* error codes captured during the failing window.
    cloud_operator:
      title: PLR/uPHY receive decoder is logging codeword errors
      summary: The PLR receive code error counter on this port is incrementing, meaning the uPHY's decoder is rejecting incoming symbols faster than the threshold permits; this is upstream of FEC and correlates
        strongly with high raw BER.
      impact: Sustained decode errors drive `SymbolErrors`, `PortRcvErrors`, and effective errors upward; every QP that traverses the port loses bandwidth to retransmits and the link will eventually reset.
      action: Read PLR counters with `mlxlink -d <pci> -c -e` and confirm with `perfquery -x <lid> <port>`; clear via `perfquery -R` and recheck. Remediate in order - clean the optics, reseat the cable
        on both ends, swap the transceiver, and verify on the switch port too; if the counter follows the cable, escalate to the cable/transceiver vendor with the link-side evidence; if it follows the HCA port, submit a ticket to your networking/system vendor with the per-port counter trace.
      support_details: '`mlxlink` PHY/PLR dump, `perfquery -x` before/after, switch port counter history, cable and transceiver serials from `mlxcables`, and UFM event ID.'
  technical_details: 'PLR (Physical Link Reliability) is the NVIDIA HCA/uPHY subsystem

    that handles per-codeword integrity below FEC. The "receive code

    error" counter increments each time the uPHY decoder cannot

    reconstruct a valid codeword from the received symbols. This is

    strictly a physical-layer event - it precedes FEC correction and

    sits below the canonical IB counters (`SymbolErrors`,

    `PortRcvErrors`) that the kernel infiniband sysfs interface

    exposes. A high rate of receive code errors is a leading

    indicator of cable, connector, transceiver, or SerDes failure

    and tracks closely with raw BER.

    '
  summary: The PLR/uPHY receive decoder is rejecting incoming codewords at a rate above threshold, indicating a physical-layer fault on the port.
  signals:
  - kind: metric
    pattern: plr_rcv_code_err counter increasing
    note: NVIDIA HCA PLR counter exposed by UFM and `mlxlink`.
  - kind: metric
    pattern: SymbolErrors > 0 on same port
    note: Canonical IB counter that co-flags when PLR decode errors leak past FEC.
  - kind: metric
    pattern: mlxlink reports degraded FEC histogram or eye margin
    note: PHY-side confirmation of the cable/transceiver fault.
  related:
  - high-bit-error-rate-ber
  - high-symbol-effective-errors
  - high-plr-transmission-retry-events
  - rdma-fabric-flap
  references:
  - title: InfiniBand sysfs - kernel infiniband port counters
    url: https://www.kernel.org/doc/html/latest/infiniband/sysfs.html
  - title: man7 - perfquery(8)
    url: https://man7.org/linux/man-pages/man8/perfquery.8.html
  - title: NVIDIA UFM Enterprise Documentation
    url: https://docs.nvidia.com/networking/software/management-software/index.html
  severity: high
  verification: verified
  last_reviewed: 2026-04-26
- id: high-plr-transmission-retry-events
  title: High PLR Transmission Retry Events
  aliases:
  - PLR transmit retry counter
  - PLR retransmission events
  - UFM PLR retry alarm
  category: distributed_comm
  likely_owner: infrastructure
  related_readme_anchor: high-plr-transmission-retry-events
  personas:
    tenant_sre:
      title: Port is retransmitting at the physical layer
      summary: UFM raised a PLR transmission retry alarm on an IB port carrying this job's traffic; the HCA's physical layer is having to retry frames it failed to deliver on the first attempt.
      impact: Retries cost wall-clock time on the link and reduce achievable NCCL bandwidth; long collectives may surface IBV_WC_RETRY_EXC_ERR if the retry budget is exhausted.
      action: 'Note the job ID, host, NCCL_IB_HCA, and the alarm window. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs). Resubmit on healthy hosts. Do not adjust NCCL retry tuning to mask the alarm.'
      support_details: NCCL_DEBUG=INFO log fragment, job-to-host mapping, and any IBV_WC_RETRY_EXC_ERR or transport timeouts seen during the window.
    cloud_operator:
      title: PLR transmit retry counter elevated on an IB port
      summary: The PLR transmit retry events counter is incrementing on this port, meaning the physical layer (uPHY) had to retry transmissions because earlier attempts were not acknowledged or were corrupted
        in flight.
      impact: Retries co-flag with elevated BER, symbol errors, and PLR receive code errors; if left in service the port will keep eroding job throughput and eventually drive link-level resets.
      action: Read counters with `mlxlink -d <pci> -c -e` and `perfquery -x <lid> <port>`, clear with `perfquery -R` and re-read to confirm the rate. Swap the cable, then the transceiver, then the HCA in
        that order; verify the switch-side port counters in parallel and cordon the host until the swap holds.
      support_details: '`mlxlink` PHY/PLR dump, `perfquery -x` before/after, switch-side counters, cable/transceiver serials, and the cordon/drain trail.'
  technical_details: 'PLR transmission retry events count the number of times the

    NVIDIA uPHY had to retry sending a frame at the physical layer

    because the first attempt did not complete reliably (NACK, timed

    out, or corrupted). This is below the IB transport retry layer

    that surfaces as `IBV_WC_RETRY_EXC_ERR`; it is a sub-link-layer

    mechanism reported via NVIDIA HCA counters and UFM telemetry.

    A high rate correlates strongly with raw BER, symbol errors, and

    PLR receive code errors on either end of the link, and points at

    a physical-layer fault rather than a software or fabric-routing

    problem.

    '
  summary: PLR transmit retry events are above threshold, indicating the uPHY is retransmitting frames at the physical layer due to unreliable delivery.
  signals:
  - kind: metric
    pattern: plr_xmit_retry counter increasing
    note: NVIDIA HCA PLR counter exposed by UFM telemetry and `mlxlink`.
  - kind: metric
    pattern: PortXmitDiscards or PortRcvErrors co-incrementing
    note: Canonical IB counters that often co-flag during sustained PLR retries.
  - kind: metric
    pattern: effective_ber breach within same window
    note: UFM threshold; physical-layer faults raise BER and retries together.
  related:
  - high-bit-error-rate-ber
  - high-symbol-effective-errors
  - high-plr-receive-code-err
  - rdma-fabric-flap
  references:
  - title: InfiniBand sysfs - kernel infiniband port counters
    url: https://www.kernel.org/doc/html/latest/infiniband/sysfs.html
  - title: man7 - perfquery(8)
    url: https://man7.org/linux/man-pages/man8/perfquery.8.html
  - title: NVIDIA UFM Enterprise Documentation
    url: https://docs.nvidia.com/networking/software/management-software/index.html
  severity: high
  verification: verified
  last_reviewed: 2026-04-26
- id: high-portxmitwait
  title: High PortXmitWait
  aliases:
  - PortXmitWait elevated
  - IB credit stall alarm
  - UFM congestion XmitWait
  category: distributed_comm
  likely_owner: infrastructure
  related_readme_anchor: high-portxmitwait
  personas:
    tenant_sre:
      title: Port is stalling on credits while trying to transmit
      summary: A UFM alarm reports that the port carrying this job's traffic is spending sustained time waiting for credit-based flow-control credits before it can send.
      impact: This is a congestion symptom, not a physical fault; NCCL collectives slow down because the HCA cannot push data downstream, and large allreduce or alltoall steps may extend their tail latency
        well past the SLA.
      action: 'Capture the job ID, host list, collective shape (size and pattern), and the alarm timestamp. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs). Do not change NCCL_IB_TC, SL, or QoS settings ad hoc; those are fabric-policy decisions.'
      support_details: NCCL_DEBUG=INFO transcript covering the slow window, job-to-host mapping, NCCL collective and message size, and any timestamps where step time spiked.
    cloud_operator:
      title: Sustained `PortXmitWait` indicates downstream congestion
      summary: The IB `PortXmitWait` counter increments every cycle a port has data to send but no transmit credit; sustained elevation means the downstream switch or peer HCA is back-pressuring this port
        via credit-based flow control.
      impact: Congestion at this port propagates upstream, increases tail latency for every QP using the SL/VL, and can mask root-cause hot spots elsewhere in the fabric; throughput-sensitive jobs lose
        bandwidth long before any link resets.
      action: Read with `perfquery -x <lid> <port>` and check `PortXmitWait` against `PortXmitData` to compute the wait fraction; correlate with UFM congestion dashboards and the switch's congestion-control
        state, identify the downstream port that is asserting back-pressure (often a slow consumer or an oversubscribed uplink), and engage the fabric architect on QoS/SL/PFC tuning. This is rarely a single-port
        replacement decision.
      support_details: '`perfquery -x` snapshots, UFM congestion telemetry CSV, the topology slice between the flagged port and the suspected sink, and the routing/QoS configuration in effect.'
  technical_details: '`PortXmitWait` is an extended IB performance counter (defined in

    the IBTA spec and exposed by the kernel infiniband sysfs

    interface and `perfquery(8)`) that increments each tick during

    which a port has at least one packet ready to transmit but no

    flow-control credit available on the target VL. Unlike BER or

    symbol errors, it is not a physical-layer signal - it is a

    congestion signal. High `PortXmitWait` means the path beyond

    this port is the bottleneck: a slow consumer, a contended

    switch uplink, or an SL/VL with under-allocated buffers. The

    remediation is fabric architecture (QoS, adaptive routing, SL

    mapping, congestion control profile), not cable or transceiver

    replacement.

    '
  summary: PortXmitWait counter is sustained above threshold because the port has data to send but is being held off by credit-based flow control downstream.
  signals:
  - kind: metric
    pattern: PortXmitWait increasing
    note: Extended IB counter; canonical name from the kernel infiniband sysfs interface.
  - kind: metric
    pattern: PortXmitWait / PortXmitData ratio rising
    note: Wait-per-byte ratio; the actionable metric for credit stalls.
  - kind: metric
    pattern: UFM congestion event on the same port or its downstream peer
    note: UFM congestion dashboard correlates this counter with downstream sinks.
  related:
  - high-bit-error-rate-ber
  - high-symbol-effective-errors
  - high-plr-transmission-retry-events
  - rdma-fabric-flap
  references:
  - title: InfiniBand sysfs - kernel infiniband port counters
    url: https://www.kernel.org/doc/html/latest/infiniband/sysfs.html
  - title: man7 - perfquery(8)
    url: https://man7.org/linux/man-pages/man8/perfquery.8.html
  - title: NVIDIA UFM Enterprise Documentation
    url: https://docs.nvidia.com/networking/software/management-software/index.html
  severity: medium
  verification: verified
  last_reviewed: 2026-04-26
