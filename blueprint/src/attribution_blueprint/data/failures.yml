      title: East-west IB/RoCE link down on node
      summary: One or more compute-fabric links to the node lost link state, breaking RDMA traffic to its peers.
      impact: All collective traffic via the affected link is broken; depending on rail topology, one or many jobs lose throughput or fail outright.
      action: Check `ibstatus`, `ibstat`, and switch counters for the port, run `mlxlink` for FEC and signal-integrity data, sweep dmesg for `mlx5_core` errors, capture `ibdiagnet` and switch logs; if the link does not retrain after a reseat or transceiver swap, escalate to the network vendor.
