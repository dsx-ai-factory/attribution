  severity: high
  verification: verified
  last_reviewed: 2026-04-25

- id: ibv-wc-rnr-retry-exc-err
  title: IBV_WC_RNR_RETRY_EXC_ERR
  aliases:
    - RNR Retry Counter Exceeded
    - Receiver Not Ready Retries Exhausted
    - WC RNR RETRY EXC ERR
    - IB Error 13
  category: distributed_comm
  likely_owner: ambiguous
  related_readme_anchor: ibv-wc-rnr-retry-exc-err
  personas:
    tenant_sre:
      title: Receiver-not-ready retries exhausted - peer never posted enough receives
      summary: The peer kept replying RNR-NAK because it had no posted receive Work Requests when sends arrived, and the sender exhausted its rnr_retry budget. In NCCL/MPI this often means the peer rank is slow, hung, or the application's receive-posting cadence cannot keep up.
      impact: The sending rank fails; the collective aborts. The lag is on the peer.
      action: 'Capture NCCL/MPI logs and identify the peer rank. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs). If the workload is custom verbs, increase posted-receive depth and review the receive-posting loop.'
      support_details: NCCL/MPI logs, rank/node mapping, peer rank/node, the IBV_WC_RNR_RETRY_EXC_ERR line, posted-receive depth, and any GPU/CPU slowness on the peer.
    cloud_operator:
      title: IBV_WC_RNR_RETRY_EXC_ERR - peer kept NAKing RNR until rnr_retry exhausted
      summary: Responder consistently advertised receiver-not-ready (no receive WQEs available) and the requester ran out of rnr_retry attempts. Indicates peer-side starvation of the receive queue, typically because the peer process is slow, blocked, or has too shallow a receive ring.
      impact: Per-QP at the sender; the peer is the bottleneck or hang.
      action: On the peer node, check process state (D-state, GPU XID, OOM, kernel softlockup), inspect the receive-queue depth, and review the application's receive-posting cadence. Confirm rnr_retry on QP attributes is non-zero and reasonable. Pull mlx5_core dmesg from both ends.
      support_details: HCA model, firmware, peer GUID, full WC dump, peer node process and resource snapshot, QP rnr_retry and min_rnr_timer values, mlx5_core kernel logs.
  technical_details: |
    IBV_WC_RNR_RETRY_EXC_ERR (status 13) is reported when the requester exhausts its RNR retry counter while the responder repeatedly advertises receiver-not-ready (no receive Work Requests posted). Common causes are an undersized or starved receive queue on the responder and a slow or hung peer process.
  summary: The peer never posted receives in time and RNR retries were exhausted; investigate peer process health and receive-queue posting.
  signals:
    - kind: log
      pattern: 'IBV_WC_RNR_RETRY_EXC_ERR'
      note: NCCL WARN / verbs library
    - kind: log
      pattern: 'wc\.status\s*=?\s*13\b'
      note: numeric WC status 13
    - kind: log
      pattern: 'RNR retry counter exceeded'
      note: humanized verbs error string
  related:
