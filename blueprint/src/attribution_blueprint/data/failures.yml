  technical_details: |
    IBV_WC_BAD_RESP_ERR (status 7) is generated when the local HCA receives a response from the responder whose transport opcode is unexpected for the outstanding request. Common causes include peer QP firmware bugs, on-wire corruption, or mismatched verbs implementations between endpoints.
  summary: An unexpected transport opcode came back from the peer; investigate the peer's verbs stack, firmware parity, and port-error counters.
