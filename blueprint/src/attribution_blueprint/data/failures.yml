- id: ibv-wc-retry-exc-err
  title: IBV_WC_RETRY_EXC_ERR
  aliases:
  - Transport Retry Counter Exceeded
  - WC RETRY EXC ERR
  - IB Error 12
  category: distributed_comm
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: RDMA transport retries exhausted - peer or fabric not responding
      summary: The HCA retried the request the configured number of times without an ACK from the peer. In NCCL/MPI this is
        the classic symptom of a fabric flap, a peer node freeze, or a port going down mid-job. The sender is rarely at fault.
      impact: The sending rank fails; the collective aborts and typically takes the job with it.
      action: Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom
        chain, and source logs).
      support_details: NCCL/MPI logs, rank/node mapping, peer rank/node, the IBV_WC_RETRY_EXC_ERR line, the timestamp, and
        any concurrent slowdowns reported by other ranks.
  recommended_action:
    operational_state: drain
    remediation_actions:
    - service_required
  technical_details: 'IBV_WC_RETRY_EXC_ERR (status 12) is reported when the requester''s transport retry counter is exhausted
    before the responder ACKs the request. Causes include link flaps, switch or cable faults, an unreachable or hung peer,
    and packet loss in the fabric. It is the canonical signal that the failure is fabric-side or peer-side, not in the sender''s
    application.

    '
  summary: The HCA gave up after exhausting transport retries; investigate the fabric path and peer node liveness, not the
    sender.
  signals:
  - kind: log
    pattern: IBV_WC_RETRY_EXC_ERR
    note: NCCL WARN / verbs library
  - kind: log
    pattern: wc\.status\s*=?\s*12\b
    note: numeric WC status 12
  - kind: log
    pattern: transport retry counter exceeded
    note: humanized verbs error string
  - kind: log
    pattern: \bIB Error[- ]?12\b
    note: legacy label
