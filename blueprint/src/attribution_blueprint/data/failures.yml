- id: call-to-ibv-modify-qp-failed-eno-11-resource-unavailable
  title: 'Call to ibv_modify_qp failed: errno 11 (EAGAIN)'
  aliases:
  - ibv_modify_qp EAGAIN
  - ibv_modify_qp Resource temporarily unavailable
  - 'Call to ibv_modify_qp failed: eno 11 resource unavailable'
  category: distributed_comm
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: ibv_modify_qp returned EAGAIN while NCCL was setting up a QP
      summary: The kernel verbs call `ibv_modify_qp` returned errno 11 (EAGAIN) during a QP state transition because the local
        RDMA stack could not allocate resources for the command.
      impact: The rank cannot bring its QP to RTS, so NCCL aborts communicator init; the job fails before collectives make
        progress.
      action: Your remediation system should first restart the affected node's operating system (a VM reboot on a virtualized
        GPU, a host-level reboot on bare metal). If the job still fails on this node, contact your cluster administrator or
        cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).
      support_details: NCCL warning line with errno 11, the failing node hostname, NCCL version, NCCL_IB_* environment overrides,
        and the job's rank and node count.
  recommended_action:
    operational_state: drain
    remediation_actions:
    - restart_os
    - service_required
  technical_details: 'EAGAIN (errno 11) from `ibv_modify_qp` indicates the kernel verbs path could not allocate the resources
    needed to complete the QP state transition. Unlike EINVAL (22, invalid attribute, most often a forced GID index) and ETIMEDOUT
    (110, unreachable peer), EAGAIN points at resource pressure on the local RDMA stack rather than at fabric reachability.
    NCCL creates several QPs per peer per channel, so at large scale the per-device QP contexts or firmware command resources
    can be exhausted, and a driver that has leaked QP contexts after earlier failures shows the same symptom at normal scale.
    The condition is node-local software state: draining the node and reloading the driver (or rebooting) releases the contexts.'
  summary: ibv_modify_qp returned EAGAIN (errno 11) because the local RDMA driver or HCA firmware could not allocate resources
    for the QP state transition.
  signals:
  - kind: log
    pattern: ibv_modify_qp failed with 11 Resource temporarily unavailable
    note: errno 11 (EAGAIN) string from the verbs path, with the failing HCA named on the same line.
  - kind: log
    pattern: NCCL WARN Call to ibv_modify_qp failed.*11
    note: NCCL warning carrying the bare errno value.
  related:
  - call-to-ibv-modify-qp-failed
  - call-to-ibv-modify-qp-failed-eno-110-timeout
  references:
  - title: man7 - ibv_modify_qp(3)
    url: https://man7.org/linux/man-pages/man3/ibv_modify_qp.3.html
  - title: rdma-core libibverbs/verbs.h
    url: https://github.com/linux-rdma/rdma-core/blob/master/libibverbs/verbs.h
  - title: rdmamojo - ibv_modify_qp()
    url: https://www.rdmamojo.com/2013/01/12/ibv_modify_qp/
  - title: NCCL Troubleshooting
    url: https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/troubleshooting.html
  severity: high
  verification: verified
  last_reviewed: 2026-07-22
