- id: ibv-wc-wr-flush-err
  title: IBV_WC_WR_FLUSH_ERR
  aliases:
    - Work Request Flushed
    - WC WR FLUSH ERR
    - IB Error 5 (flush)
  category: distributed_comm
  likely_owner: ambiguous
  related_readme_anchor: ibv-wc-wr-flush-err
  personas:
    tenant_sre:
      title: Verbs Work Request flushed - downstream symptom, not the root cause
      summary: A Work Request was flushed because its QP transitioned to the error state after an earlier failure. The first non-flush WC on that QP is the real failure; the flushes that follow are aftershocks.
      impact: All in-flight WRs on the affected QP complete with this status. The collective fails, but the cause is whatever produced the prior error.
      action: 'In the NCCL/MPI logs, find the first non-flush IBV_WC_* status on the same QP - that is the root cause to chase. Capture both the first error and the flush sequence so your cluster administrator or cloud provider can correlate.'
      support_details: NCCL/MPI log span starting before the first WC error, rank/node mapping, peer rank, QP number, and the original (non-flush) WC status.
    cloud_operator:
      title: IBV_WC_WR_FLUSH_ERR - QP error state, look for the prior fault
      summary: HCA flushed pending Work Requests because the QP entered the error state. The triggering WC precedes this on the same QP (or an async event drove the QP to error).
      impact: Per-QP. Treat the flush stream as noise; root-cause from the prior error event or an mlx5_core async QP event.
      action: Inspect mlx5_core dmesg for a QP async event before the flush burst, dump qp_state, correlate with peer GUID and ibstat for port flaps. Do not attribute the failure to FLUSH; map to the upstream cause.
      support_details: HCA model, firmware, port, peer GUID, full WC dump for the first non-flush completion, mlx5_core kernel log, ibstat counters.
  technical_details: |
    IBV_WC_WR_FLUSH_ERR (status 5) is reported on every outstanding Work Request when its QP has transitioned to the error state. It is always a follow-on to an earlier WC error or async QP event; the root cause is the first non-flush completion or async event on that QP.
  summary: The QP entered error state and flushed remaining Work Requests; the real failure is the WC immediately preceding the flush burst.
  signals:
    - kind: log
      pattern: 'IBV_WC_WR_FLUSH_ERR'
      note: NCCL WARN / verbs library
    - kind: log
      pattern: 'wc\.status\s*=?\s*5\b'
      note: numeric WC status 5
    - kind: log
      pattern: 'work request flushed'
      note: humanized verbs error string
  related:
