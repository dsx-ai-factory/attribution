    does not run for `2*watchdog_thresh` seconds (default `watchdog_thresh=10`, so 20s), the kernel logs `NMI watchdog: Watchdog
    detected hard LOCKUP on cpu N` along with a backtrace. The system stays locked up unless `hardlockup_panic` is set or
