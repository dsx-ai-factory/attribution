    tenant_sre:
      title: GPU memory row was marked for remapping
      summary: The GPU is queueing a memory row for remapping after an ECC error. By itself it is informational; you usually keep running. With XID 48 it means the GPU needs a reset.
      action: If solo, finish your job. If you see XID 48 alongside, retry on a different allocation - the GPU needs to be drained.
      impact: Slightly reduced framebuffer until the next GPU reset activates the remap. Job continues if XID 48 is not present.
      support_details: Job ID, node, GPU UUID, dmesg XID 63 line, whether XID 48 also fired, and nvidia-smi -q remapped-rows output.
    cloud_operator:
      title: XID 63 - INFOROM_DRAM_RETIREMENT_EVENT
      summary: GPU has queued a DRAM row for remapping. Activation requires a GPU reset; without XID 48 the system can keep running until a service window.
      impact: Per-GPU; minor framebuffer reduction. With XID 48 - drain plus reset is required to activate the remap.
      action: 'Solo: schedule a reset at the next service window via `nvidia-smi -r`. Paired with XID 48: drain the node, wait for jobs to complete, then reset with `nvidia-smi -r`. Track remap count via `nvidia-smi -q -d ROW_REMAPPER`. If the issue persists, refer to official NVIDIA documentation.'
      support_details: nvidia-smi -q -d ROW_REMAPPER output, ECC counters, dmesg XID 63 payload (and any XID 48), GPU UUID, infoROM serial, recurrence history.
  technical_details: |
    XID 63 (INFOROM_DRAM_RETIREMENT_EVENT) is logged when the GPU queues a memory row for remapping after an ECC error. On Ampere and later this is row remapping; on earlier GPUs it is dynamic page retirement. Solo XID 63 from a single-bit error is benign until the next reset; XID 63 alongside XID 48 indicates an uncorrectable error and requires drain plus reset to activate the remap. This event can be injected via nvidia-err-injector.
