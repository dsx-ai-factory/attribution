      title: A CPU on your node hung and the kernel watchdog killed the host
      summary: The Linux NMI watchdog detected a CPU that stopped servicing interrupts and reported a hard lockup; the host is unrecoverable without a reboot.
      impact: All processes on the affected node are lost; the job dies and must be resubmitted to a healthy node.
      action: 'Resubmit on a different host. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
