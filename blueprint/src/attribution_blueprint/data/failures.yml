    operational_state: drain
    remediation_actions:
    - restart_app
    - service_required
  technical_details: 'XID 32 (PBDMA Error) reports an invalid or corrupted push-buffer stream. The NVIDIA catalog lists
    `RESTART_APP` and `CHECK_APP/CUDA` as its immediate and investigative guidance, while also describing a common PCIe-quality
    association. Preserve both lines of investigation rather than assuming a hardware verdict.


    NVIDIA Attribution''s `XID-32-` declaration is `Fail MultiCategory`. The common PCIe association does not narrow that
    runtime classification or identify the faulty component on its own.

    '
  summary: XID 32 reports a GPU push-buffer DMA error; NVIDIA Attribution classifies it as Fail MultiCategory and the symptom
