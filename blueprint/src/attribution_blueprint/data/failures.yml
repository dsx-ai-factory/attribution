- id: stale-file-handle
  title: Stale file handle
  aliases:
  - ESTALE
  - errno 116
  - stale NFS file handle
  - stale Lustre file handle
  category: storage
  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: An open file's backing object disappeared on the server
      summary: Your syscall returned ESTALE (errno 116) - the kernel held an NFS or Lustre file handle whose underlying inode/object
        is no longer valid on the server. Typically the file was unlinked/replaced by another job, the storage failed over,
        or an OST went away.
      impact: The open fd is dead - read, write, stat, and close on it will keep returning ESTALE. The job step usually fails
        on the next checkpoint, dataset read, or shared-library load.
      action: Capture the failing path and the operation that returned ESTALE. Reopen by path - if that succeeds, retry the
        step once. If reopen also fails or the same path fails on multiple ranks, contact your cluster administrator or cloud
        provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).
      support_details: The file path and operation, the rank/node where ESTALE was raised, the mount type (`mount | grep <path>`),
        the job ID, and the timestamp.
  technical_details: 'ESTALE (errno 116, "Stale file handle") is returned when the kernel presents a file handle to a network
    filesystem and the server reports the handle no longer maps to a valid object. On NFS this is NFS3ERR_STALE / NFS4ERR_STALE
    - the server''s inode generation, fsid, or export fh has changed since the client cached the handle (causes - file unlinked
    and inode reused; export restored from backup; failover with different fsid; subtree_check rewrite). On Lustre it is returned
    when the OST object backing an open file has been destroyed or a FID lookup misses on the MDT (causes - OST loss, unexpected
    unlink across clients, target failover with state divergence). The error surfaces on `read(2)`, `write(2)`, `stat(2)`,
    `close(2)`, `mmap`-faulted page-ins, and reopen-by-handle paths. The fd cannot be salvaged - close and reopen by path,
    or treat the storage backend as unhealthy.

    '
  summary: A network-filesystem file handle no longer maps to a server-side object; close the fd, reopen by path, and investigate
    the export/OST if the condition persists.
  signals:
  - kind: log
    pattern: Stale file handle
    note: glibc / kernel-translated ESTALE message
  - kind: log
    pattern: \bESTALE\b
    note: errno mnemonic in framework or dataloader stack traces
  - kind: log
    pattern: errno (?:=|:)?\s*116
    note: numeric errno in C/Python wrappers
  - kind: log
    pattern: 'NFS: server.*not responding|NFS: stale (?:fh|filehandle)'
    note: NFS-side kernel log
  - kind: log
    pattern: 'cannot open shared object file: Stale file handle'
    note: dynamic linker hitting ESTALE on .so load
  related:
  - lustreerror
  - lustre-client-evicted
  - dataloader-exception
  - bad-kernel-stack-frame-pointer
  references:
  - title: man7 - errno(3) (ESTALE)
    url: https://man7.org/linux/man-pages/man3/errno.3.html
  - title: man7 - nfs(5)
    url: https://man7.org/linux/man-pages/man5/nfs.5.html
  - title: Linux kernel - NFS filesystem documentation
    url: https://www.kernel.org/doc/html/latest/filesystems/nfs/index.html
  - title: Lustre Manual
    url: https://doc.lustre.org/lustre_manual.xhtml
  severity: medium
  verification: verified
  last_reviewed: 2026-04-26
- id: s3-exception
  title: S3 Exception
  aliases:
  - botocore ClientError
  - S3 ClientError
  - boto3 S3 exception
  - AWS S3 API error
  category: storage
  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: An S3 API call from your job failed
      summary: The AWS SDK raised an exception on an S3 call. The HTTP status and the `Error.Code` in the response identify
        the actual failure - AccessDenied, ExpiredToken, NoSuchBucket, RequestTimeTooSkewed, SlowDown, etc. The exception
        message alone is not enough to triage.
      impact: The dataloader, checkpoint write, or artifact upload that issued the call fails. If the failure is auth-related
        (ExpiredToken, InvalidAccessKeyId), every subsequent S3 call from that process will fail the same way until credentials
        are refreshed.
      action: For 5xx or SlowDown - retry with exponential backoff. Otherwise contact your cluster administrator or cloud
        provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).
      support_details: Full traceback, S3 error code and HTTP status, bucket name and key (or prefix), operation name, region/endpoint,
        AWS SDK version, IAM principal identity, job ID, rank/node, and timestamp.
  technical_details: '"S3 Exception" is the umbrella term for any failure of an S3 API call surfaced through the AWS SDK.
    In Python it is most commonly `botocore.exceptions.ClientError` carrying `response[''Error''][''Code'']` (the S3 `<Code>`
    from the XML error body), `response[''Error''][''Message'']`, and `response[''ResponseMetadata''][''HTTPStatusCode'']`.
    Authoritative classification comes from the S3 ErrorResponses reference - 4xx codes split into auth (`AccessDenied`, `InvalidAccessKeyId`,
    `SignatureDoesNotMatch`, `ExpiredToken`, `TokenRefreshRequired`, `RequestTimeTooSkewed`) and request-shape (`InvalidArgument`,
    `BadDigest`, `EntityTooLarge`, `MalformedXML`); 404s split into `NoSuchBucket` vs `NoSuchKey`; 503s split into throttling
    (`SlowDown`) vs capacity (`ServiceUnavailable`); 500s are `InternalError` and retryable. Non-AWS S3-compatible services
    (MinIO, Ceph RGW, OCI, on-prem object stores) emit the same XML schema, so the triage path is identical with the endpoint
    as a known-different variable.

    '
  summary: An S3 API call failed; classify by HTTP status and the S3 error code, then route to auth, throttling, missing-resource,
    request-shape, or service buckets.
  signals:
  - kind: log
    pattern: botocore\.exceptions\.ClientError
    note: boto3/botocore exception class in tracebacks
  - kind: log
    pattern: An error occurred \(([A-Za-z]+)\) when calling the (\w+) operation
    note: standard botocore message - capture the code and operation
  - kind: log
    pattern: \b(?:AccessDenied|ExpiredToken|InvalidAccessKeyId|SignatureDoesNotMatch|RequestTimeTooSkewed|NoSuchBucket|NoSuchKey|SlowDown|InternalError|ServiceUnavailable|InvalidArgument)\b
    note: S3 error codes per AWS ErrorResponses reference
  - kind: log
    pattern: HTTP\s+(?:4\d{2}|5\d{2})
    note: HTTP status from request logs
  related:
  - dataloader-exception
  - stale-file-handle
  - lustreerror
  references:
  - title: AWS S3 - Error Responses
    url: https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponses.html
  - title: AWS S3 - Common Error Codes
    url: https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponsesList.html
  - title: AWS - Best practices design patterns - optimizing S3 performance
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/optimizing-performance.html
  - title: man7 - errno(3)
    url: https://man7.org/linux/man-pages/man3/errno.3.html
  severity: high
  verification: verified
  last_reviewed: 2026-04-26
- id: pyxis-enroot-mount-failure
  title: 'pyxis: enroot mount failure'
  aliases:
