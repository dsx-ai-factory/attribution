        3. If you lack the tool, source access, or permission, send the error and version information you have to the person or team responsible for your application; a sanitizer report is not required to ask for help. After a correction, test one fresh process and validate the affected results.

        4. If the fault remains or you cannot change the code, stop further retries and contact the application team; do not reset shared hardware.
      support_details: For help, provide the job ID, timestamps, NVIDIA Attribution diagnosis (verdict, symptom chain, and source
