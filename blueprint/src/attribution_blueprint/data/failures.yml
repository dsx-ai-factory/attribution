      impact: Instance-scoped. All EFA-using workloads on the instance are at risk.
      action: Pull dmesg for efa/ena modules, run fi_info -p efa to confirm the device is healthy, check EC2 instance status checks and AWS Health Dashboard for the region/AZ, and reboot or replace the instance if the EFA device does not recover.
