  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: Lustre client logged an error during your job
      summary: The Lustre client in the kernel printed a `LustreError:` line. The prefix is a marker - the suffix tells you
        whether you got evicted, an RPC timed out, or the OST/MDT is unreachable. None of these are application bugs.
      impact: Pending IO on the affected mount returns EIO, ETIMEDOUT, or ESTALE; the rank usually crashes at the next read/write/checkpoint.
        If the eviction clears, the mount recovers but the failed syscalls do not.
      action: Capture the failing rank, the node name, and the exact `LustreError:` line from dmesg. Do not retry on the same
        hostlist if eviction or bulk-IO timeouts are present. Contact your cluster administrator or cloud provider. Include
        the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).
      support_details: Job ID, rank-to-node mapping, the `LustreError:` lines from dmesg with timestamps, the affected mount
        path, and the time window NVIDIA Attribution correlated against PyTorch NCCL watchdog.
  technical_details: NVIDIA Attribution correlates these against the PyTorch NCCL watchdog window to attribute job failures.
  summary: The Lustre client kernel module logged an error; treat the prefix as a marker and triage by the suffix and target
    NID, not by the LustreError line itself.
