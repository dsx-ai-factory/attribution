- id: power-supply-unit-failure
  title: Power Supply Unit failure
  aliases:
    - PSU failure
    - PSU SEL event
  category: gpu
  likely_owner: infrastructure
  related_readme_anchor: power-supply-unit-failure
  personas:
    tenant_sre:
      title: PSU failure on the node
      summary: The node's IPMI SEL records a power supply failure; the node is at high risk of an unplanned shutdown.
      impact: The job will likely be killed when the failing PSU forces a reboot or thermal throttle; restart on a different node.
      action: 'Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: Note the host name, the SEL entry, and the job id, then file a high-priority hardware ticket.
    cloud_operator:
      title: PSU failure recorded in IPMI SEL on node
      summary: The BMC reported a power supply unit fault, an explicit hardware-class signal that requires field service.
      impact: The node is at risk of unplanned shutdown and must be drained; clustered PSU events imply rack-level power problems.
      action: 'Drain the node immediately. Pull the BMC SEL log via `ipmitool sel elist` and `ipmitool sensor`. Capture `nvidia-bug-report.sh` so any GPU correlation is preserved. Schedule a PSU replacement with the hardware vendor. If the failing PSU also damaged GPUs, refer to official NVIDIA documentation.'
      support_details: Pair with `system-is-powering-down` if the failure caused a shutdown; rack-level clusters call for a datacenter facilities review.
  technical_details: |
    Power Supply Unit failures are reported by the BMC into the IPMI System Event Log. They are unambiguous hardware faults and are independent of GPU XIDs; even if no XID fires, the node is unsafe to keep in production.
  summary: BMC SEL recorded a PSU failure on the node, requiring immediate drain and field service.
  signals:
    - kind: log
      pattern: 'IPMI .*Power Supply.*(Failure|Predictive Failure|Lost)'
