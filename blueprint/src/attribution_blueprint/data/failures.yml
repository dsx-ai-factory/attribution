      title: An object-storage request failed
      summary: An S3-compatible API request failed; its error code, operation, and service determine the next action.
      impact: A dataset fetch, checkpoint operation, or artifact transfer may be incomplete.
      action: |-
        1. Read the response error code and check the object path, endpoint, and credential expiry without exposing secrets. If you control the configuration, correct a confirmed mismatch using the installed SDK and the service's supported authentication procedure; for retryable failures, use its bounded retry policy only when repeating the operation is safe.

