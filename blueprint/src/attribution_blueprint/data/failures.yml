      summary: Verify `NCCL_IB_HCA` matches what `ibstat` lists on the node before retrying.
      impact: NCCL falls back to slower transport or aborts before the first collective.
      action: Re-run with `NCCL_DEBUG=INFO`, capture the device-selection log, and align `NCCL_IB_HCA`/`NCCL_SOCKET_IFNAME` with the node's actual device names.
