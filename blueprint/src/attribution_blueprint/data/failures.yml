- id: segmentation-fault
  title: Segmentation fault
  aliases:
  - Segmentation fault
  - SIGSEGV
  - segfault
  category: application
  likely_owner: ambiguous
  related_readme_anchor: segmentation-fault
  personas:
    tenant_sre:
      title: Process crashed with SIGSEGV
      summary: The process accessed invalid memory and was killed by the OS. Could be an application bug, a library mismatch, or memory corruption from a hardware fault on the GPU/host.
      impact: The rank dies immediately; the distributed job typically deadlocks and aborts.
      action: 'If you have a coredump, open it with gdb. Re-run with NCCL_DEBUG=INFO. If the crash is repeatable, capture a minimal reproducer; if it is sporadic and only on certain nodes, contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: Coredump if available, stack trace, framework/CUDA/NCCL versions, hostlist with the node where the crash happened, job ID, whether the failure is node-sticky.
    cloud_operator:
      title: SIGSEGV in user process - check for hardware corruption
      summary: A process took a segmentation fault. From the platform side, the differentiator is whether the same node repeats - that points at memory corruption, otherwise it is an application bug.
      impact: One rank lost; collective stalls. If hardware-induced (XID-adjacent), the node may need a drain.
      action: 'Pull `dmesg` for XIDs (especially XID 13, 31, and 79) and ECC events. Check `nvidia-smi -q` for retired pages and pending remaps. If the node has prior segfault history at the same offset, drain the node. If the issue persists, refer to official NVIDIA documentation.'
      support_details: dmesg, nvidia-smi -q, coredump if available, node failure history, GPU UUID, kernel version.
  technical_details: |
    A segmentation fault (SIGSEGV) is delivered when a process accesses memory it is not permitted to access. In ML jobs the common origins are application or library bugs (null deref, ABI mismatch between framework and CUDA/NCCL builds, stack overflow), and hardware-induced corruption (GPU ECC events leaking through pinned memory, host DRAM faults). The signal itself does not distinguish; correlation with XIDs and node history does.
  summary: The process took a segmentation fault; correlate with XIDs and node history to separate application bugs from hardware-induced corruption.
  signals:
  - kind: log
    pattern: 'Segmentation fault'
    note: shell or framework reporting SIGSEGV
  - kind: log
    pattern: 'signal 11|SIGSEGV'
    note: kernel/runtime signal indication
  - kind: log
    pattern: 'received SIGSEGV'
    note: PyTorch/torchrun signal handler
  related:
  - terminate-called
  - xid-48
  - xid-79
  - ncclunhandledcudaerror
