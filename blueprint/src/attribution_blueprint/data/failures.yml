        shape, pointer/bounds context, accessible sanitizer output, application changes, and fresh-process test result. Remove credentials
        and private payloads before sharing. When asking for help, send the evidence available to you and say what is missing; do
        not delay the request because a diagnostic report or restricted logs are unavailable.
