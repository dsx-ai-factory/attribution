- id: gloo-connectfullmesh-failed
  title: Gloo connectFullMesh failed
  aliases:
  - gloo full mesh connect error
  - gloo init failure
  category: distributed_comm
  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: Gloo could not build the full-mesh connection
      summary: Gloo could not connect all participating processes. This can involve workload configuration or network connectivity.
      impact: Job init aborts; no training step runs.
      action: |-
        1. Check `GLOO_SOCKET_IFNAME` in your job configuration against the network interfaces supported by your cluster and installed PyTorch version. If you can inspect network interfaces, check them inside the actual workload container or job environment, not just on the login host.

        2. When the variable is unset, Gloo normally selects an interface automatically; do not invent an interface name or assume every job needs an override. If the supported interface is known and if you can edit the job, correct a mismatch you control.

        3. When specifying multiple Gloo interfaces, use the same number on every process; `NCCL_SOCKET_IFNAME` controls NCCL, not Gloo. Retry once after correcting the configuration and confirm that all ranks initialize and the workload proceeds past its first communication step.

        4. If you cannot change the job configuration, contact the person or team responsible for your application; if the supported interface is unknown, you cannot inspect the workload environment, connections still fail, or host/network access is required, stop and contact your cluster administrator or cloud provider with the evidence available to you.
      support_details: Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs) when available, job ID,
        failure timestamp, failing ranks and hosts, PyTorch version, and the Gloo interface setting on each rank when available.
        Describe the configuration correction and retry result, and provide the connection errors from logs you can access. Remove
        credentials from launch arguments or environment excerpts; ask your cluster administrator or cloud provider to collect any
        required host or network evidence unavailable to you. When asking for help, send the evidence available to you and say what
        is missing; do not delay the request because a diagnostic report or restricted logs are unavailable.
  technical_details: >-
    Gloo establishes connections between participating processes during process-group initialization.
    `GLOO_SOCKET_IFNAME` overrides its automatically selected interfaces, while `NCCL_SOCKET_IFNAME` applies to NCCL.
    A connection failure alone does not distinguish a job-configuration problem from an infrastructure problem.
  summary: Gloo could not connect all participating processes. Check the workload's interface configuration before seeking network help.
  signals:
  - kind: log
    pattern: connectFullMesh failed
    note: Gloo-side error message.
  - kind: log
    pattern: Gloo .*Connection (refused|reset)
    note: Companion connection-level error.
