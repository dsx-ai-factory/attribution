    surface is the OOB/bootstrap socket layer or the IB verbs path: socketPollConnect returning errno 113 (No route to host),
    socketProgressOpt seeing "Connection reset by peer", or ibv_modify_qp failing. The result code itself is downstream of
    an OS or fabric event.

