    IBV_EVENT_QP_FATAL is generated when an error on a Queue Pair prevents completion generation while accessing its Send or Receive work queue. The QP is transitioned to IBV_QPS_ERR and must be moved to Reset for recovery. If the originating fault is in the CQ, the application also receives IBV_EVENT_CQ_ERR and the resources should be destroyed and recreated.
  summary: A queue pair moved to the error state and can no longer generate completions; the application must reset or recreate the QP.
