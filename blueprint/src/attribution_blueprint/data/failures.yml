- id: call-to-ibv-modify-qp-failed-eno-110-timeout
  title: 'Call to ibv_modify_qp failed: errno 110 (ETIMEDOUT)'
  aliases:
  - ibv_modify_qp ETIMEDOUT
  - ibv_modify_qp Connection timed out
  - eno 110 timeout
  category: distributed_comm
  likely_owner: infrastructure
  related_readme_anchor: call-to-ibv-modify-qp-failed-eno-110-timeout
  personas:
    tenant_sre:
      title: ibv_modify_qp timed out reaching the peer HCA
      summary: The kernel verbs command `ibv_modify_qp` returned ETIMEDOUT (110) during the INIT -> RTR or RTR -> RTS transition because the destination QP did not respond.
      impact: The local rank cannot bring the QP to RTS, so NCCL aborts the communicator; all peers waiting on this rank stall until job timeout.
      action: 'Set `NCCL_IB_MQP_RETRY_ALL=1` to retry the modify across transient drops, then resubmit on a different set of nodes; do not pin to the same node until your cluster administrator or cloud provider has cleared it.'
      support_details: NCCL log with the ETIMEDOUT line, the peer rank/host, and the value of NCCL_IB_MQP_RETRY_ALL at the time of the failure.
    cloud_operator:
      title: Kernel verbs command timed out on the RoCE/IB path
      summary: ETIMEDOUT from `ibv_modify_qp` is a fabric-side symptom - the HCA-to-HCA path was not usable when the kernel issued the modify command.
      impact: Every QP setup against the affected peer or via the affected leaf will time out; without remediation the cluster develops a hot zone of repeat failures.
      action: Correlate the timestamp with switch port up/down events, IB link flap counters, and EAP authentication logs; check `dmesg` for `mlx5_ib` command timeouts, drain both the local and remote node,
        and engage the CSP if access-port re-auth is implicated.
      support_details: '`dmesg | grep mlx5`, switch port history for both endpoints, UFM topology snapshot, EAP supplicant log on both nodes, and node drain decision record.'
  technical_details: 'ETIMEDOUT (errno 110) from `ibv_modify_qp` indicates the kernel/HCA

    firmware command timed out before the verb completed. In RC RoCE

    flows this is overwhelmingly a fabric-reachability problem during

    the IBV_QPS_RTR or IBV_QPS_RTS transition: the local NIC cannot

    complete the path resolution to the destination GID. Common root

    causes are IB/RoCE link flaps, congested or mis-configured PFC,

    and 802.1X EAP re-authentication on CSP access ports. The NCCL workaround `NCCL_IB_MQP_RETRY_ALL=1` retries the

    modify on transient drops but does not address persistent fabric

    faults, which require node drain and remediation.

    '
  summary: ibv_modify_qp returned ETIMEDOUT because the kernel verbs command could not resolve the path to the destination QP.
  signals:
  - kind: log
    pattern: ibv_modify_qp.*Connection timed out
    note: errno 110 string from the verbs path.
  - kind: log
    pattern: NCCL WARN Call to ibv_modify_qp failed.*110
    note: NCCL warning carrying the bare errno value.
  - kind: metric
    pattern: mlx5_ib.*command.*timeout
    note: Kernel-level HCA firmware command timeout in dmesg.
