  category: container
  likely_owner: infrastructure
  related_readme_anchor: call-to-ibv-set-ece-failed
  personas:
    tenant_sre:
      title: Containerized RDMA workload could not negotiate ECE
      summary: libibverbs inside the container failed to set Enhanced Connection Establishment options on a queue pair during connection setup.
      impact: Your distributed job aborts at first collective; the failure is below your code and not fixable by retrying with the same image on the same nodes.
      action: Retry on a different allocation. If failures track specific nodes, request that platform support compare HCA firmware and the host libibverbs that Pyxis bind-mounts into your container.
      support_details: Provide image used, NCCL/UCX version inside the container, peer node list, and whether the same image works on a different cluster.
    cloud_operator:
      title: ECE negotiation refused on a Pyxis-launched container
      summary: ibv_set_ece returned non-zero when the user-space verbs library attempted to advertise ECE features the peer or local HCA did not honor.
      impact: Repeats across jobs whenever HCA firmware or kernel/user-space verbs versions are inconsistent across the fabric or between host and container.
      action: Audit firmware levels (`mst status`, `flint -d ... q`), align MLNX_OFED versions on every host, and confirm Pyxis is not shadowing host `libibverbs` with a stale copy from the container image.
      support_details: Collect HCA model, firmware, kernel version, MLNX_OFED package, container image digest, and the failing peer pair.
  technical_details: 'ECE (Enhanced Connection Establishment) is negotiated via ibv_set_ece / ibv_query_ece on RDMA queue pairs to advertise vendor-specific transport features. Under Pyxis, RDMA workloads typically rely on host libibverbs and HCA firmware exposed through enroot bind mounts and the NVIDIA container hook. A version skew between the user-space stack baked into the container image and the host kernel/firmware is the dominant cause of `ibv_set_ece failed`. Mismatches between peers (one side supports an ECE option the other does not) reproduce this as well.'
  severity: high
  summary: ECE negotiation failed on a containerized RDMA queue pair, almost always due to firmware or libibverbs skew between hosts, peers, or container-vs-host stacks.
  signals:
  - kind: log
    pattern: 'Call to ibv_set_ece failed'
    note: libibverbs / NCCL
  - kind: log
    pattern: 'ibv_set_ece.*errno'
    note: verbs error path
  - kind: log
    pattern: 'NCCL WARN.*ECE'
    note: NCCL transport
