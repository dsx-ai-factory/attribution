  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: Lustre reported a storage error
      summary: An operation involving Lustre coincided with a storage error; the complete message is needed to diagnose it.
      impact: I/O may fail and leave application output incomplete; validate it before reuse.
      action: |-
        1. Preserve the application I/O error, affected path, and any Lustre message already visible to your job. Stop repeatedly retrying failed writes and contact your cluster administrator or cloud provider if recovery needs storage or kernel access you do not have.

        2. After they confirm access is restored, use the installed application's supported recovery procedure for work you control and test one read or write, validating the output or checkpoint before resuming.

        3. Ask the person or team responsible for your application if partial output cannot be validated; do not remount storage or assume an interrupted checkpoint is usable.
      support_details: When asking for help, include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs)
        when available, plus job/rank/node IDs, affected path and operation, complete visible error with timestamps, checkpoint/output
        state, and recovery-test result; state when kernel logs are inaccessible. Share only evidence you can access; redact credentials
        and private application data. When asking for help, send the evidence available to you and say what is missing; do not delay
        the request because a diagnostic report or restricted logs are unavailable.
  technical_details: 'The LustreError prefix covers multiple error conditions. The full message and timing relative to failed
    application I/O are needed; the prefix alone does not determine whether output is intact or identify a particular storage
    failure.

    '
  summary: An operation involving Lustre coincided with a storage error; the complete message is needed to diagnose it.
