  technical_details: |
    "Connection reset by peer" (ECONNRESET) is a generic socket-layer error indicating the remote endpoint sent a TCP RST or otherwise closed the connection abruptly. NCCL surfaces it through socketProgressOpt or socketPollConnect during OOB bootstrap or when the IP socket transport is in use. The cause lies on the peer side or in the path between peers, not in NCCL itself.
  summary: A peer closed the socket connection unexpectedly; investigate the remote node and the network path, not the rank reporting the error.
