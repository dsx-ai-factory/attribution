  category: distributed_comm
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: InfiniBand retry count exceeded - the fabric path failed
      summary: An RDMA send exhausted its transport retries without an ACK from the peer. The fabric or the peer node dropped
        the traffic.
      impact: The collective aborts. The job must restart, ideally on a different allocation if a specific node is suspect.
      action: Capture the NCCL warning and the local HCA/port and peer IP, if available. Contact your cluster administrator
        or cloud provider with this evidence before changing NCCL transport settings.
      support_details: Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs), plus the NCCL
        trace excerpt with the verbs error, HCA and port, peer IP if present, localGid, remoteGid, hostlist, job ID, and time.
  recommended_action:
    operational_state: ready
  technical_details: 'Verbs work-completion status 12 is IBV_WC_RETRY_EXC_ERR. Vendor syndrome 0x81 (decimal 129) is the
    Mellanox-specific code reported alongside it. It means the RC sender retransmitted a packet up to the configured retry
    count without receiving an ACK, so the QP transitions to error state. Common physical causes are cable/transceiver
    faults, switch port flaps, congestion-induced loss, or a peer HCA in an unhealthy state. NCCL can report this in older
    "Got completion with error" warnings or in newer irrecoverable NET/IB communicator warnings when the line includes
    vendor_err=129.

    '
