- id: bad-kernel-stack-frame-pointer
  title: bad kernel stack frame pointer
  aliases:
    - bad stack frame pointer
    - kernel stack frame pointer
    - kernel BUG bad frame pointer
  category: storage
  likely_owner: infrastructure
  related_readme_anchor: bad-kernel-stack-frame-pointer
  personas:
    tenant_sre:
      title: Linux kernel oops on the node hosting your job
      summary: The Linux kernel logged a "bad stack frame pointer" oops while servicing a syscall - frequently from a filesystem path. Your process did not corrupt the kernel; the node did.
      impact: The rank running on that node typically dies with EIO, a stuck syscall, or SIGBUS, and the distributed job aborts. The node is unsafe to reuse until rebooted.
      action: 'Do not retry on the same hostlist. Capture the failing rank, the node name, and the approximate timestamp. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: Job ID, hostlist with rank-to-node mapping, the exact timestamp the rank died, and the last 200 lines of stdout/stderr from that rank.
    cloud_operator:
      title: Kernel oops "bad stack frame pointer" - drain and reboot the node
      summary: Kernel logged a frame-pointer corruption oops, often inside a filesystem or storage-driver callstack. Has been observed in storage-adjacent paths under heavy-IO workloads on certain kernel/firmware combinations.
      impact: Node-scoped; the kernel is in a degraded state. Subsequent IO syscalls can return EIO, hang, or trip a follow-up panic. Other tenants on the node are at risk until reboot.
      action: Drain the node, capture the full dmesg block (oops + call trace), `journalctl -k --since "1 hour ago"`, and `uname -r` / kernel package version. Reboot the node before returning it to service. If the symptom recurs on the same node or kernel/firmware combination, submit a ticket to your system vendor with the dmesg evidence.
      support_details: dmesg with the full oops and call trace, kernel version, node model, storage driver versions (lustre, nfs, mlx5), and prior occurrences on the same node from the failure-history database.
  technical_details: |
    A "bad stack frame pointer" oops is a Linux kernel BUG triggered when the unwinder finds a frame-pointer value that does not match the expected stack layout. It indicates kernel-side memory corruption or a driver bug, not user-space wrongdoing. Observed in storage-adjacent kernel paths under heavy-IO workloads on some kernel/firmware combinations. Recovery requires a reboot - the kernel cannot be trusted after the oops, even if userspace continues to run.
  summary: The Linux kernel logged a frame-pointer oops on the node; drain and reboot the node and treat any in-flight job on it as collateral damage.
  signals:
    - kind: log
      pattern: 'bad (?:kernel )?stack frame pointer'
      note: kernel oops header in dmesg
    - kind: log
      pattern: 'kernel BUG at .*\.c:\d+'
      note: paired BUG line
    - kind: log
      pattern: 'Call Trace:'
      note: oops body in dmesg
