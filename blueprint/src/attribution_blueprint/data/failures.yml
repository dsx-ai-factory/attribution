  title: Node unexpectedly rebooted
  aliases:
  - unscheduled reboot
  - missing epilog reboot
  - Node reboot initiated
  category: unknown
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: The node rebooted during the job
      summary: NVIDIA Attribution distinguishes an explicit reboot initiation from evidence that the node rebooted unexpectedly.
      impact: '`Node reboot initiated` is an infrastructure-software lifecycle event; `Node unexpectedly rebooted` indicates
        an unplanned host reset and receives the hardware outcome.'
      action: Check the emitted symptom and contact your cluster administrator or cloud provider with the evidence below.
        For an initiated reboot, ask whether maintenance or automation requested it. For an unexpected reboot, request
        host investigation and retry on a healthy allocation when available; do not reboot shared nodes yourself.
      support_details: Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs), plus the emitted
        symptom, job ID, node hostname, timestamp, scheduler state, and last application log lines.
  technical_details: 'This page covers two distinct emitted symptoms. `Node reboot initiated` comes from explicit reboot
    lifecycle evidence such as `System is rebooting`, `systemd-shutdown[1]: Rebooting`, `reboot: Restarting system`, or
    a recorded `systemctl reboot` command. It is classified as `Fail InfraSW` with low priority and cascade-discards `Node
    unexpectedly rebooted` on the same node. `Node unexpectedly rebooted` comes from reboot telemetry without a corresponding
    graceful shutdown or epilog record. It is classified as `Fail InfraHW`. The explicit initiated signal is not evidence
    of an unexpected reset.

    '
