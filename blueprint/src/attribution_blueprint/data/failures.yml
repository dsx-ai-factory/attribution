      action: Pull XID and SDC counters for the suspect node, run NHC plus DCGM diagnostics, and compare failure rate against peer nodes before authorizing drain.
      support_details: Node, GPU UUID, recent XID history, DCGM/NHC output, recurrence pattern across jobs and ranks.
