failures:
- id: xid-48
  title: XID 48
  aliases:
  - cudaErrorECCUncorrectable
  - ECC Error
  - Double Bit ECC
  category: gpu
  likely_owner: infrastructure
  related_readme_anchor: xid-48
  personas:
    tenant_sre:
      title: Uncorrectable GPU memory error
      summary: CUDA received an uncorrectable GPU memory error. This is usually infrastructure, not application logic.
      impact: The process is expected to fail because the GPU requires reset or node recovery.
      action: Retry once on a different allocation. If failures repeat on the same node or GPU, escalate to platform support.
      support_details: Include rank/node mapping, CUDA log excerpt, job ID, and whether the failure is node-sticky.
    cloud_operator:
      title: XID 48 - DBE ECC error
      summary: GPU detected an uncorrectable ECC memory error.
      impact: The GPU normally requires reset or node reboot before returning to service.
      action: 'Drain the affected node and reset the GPU with `nvidia-smi -r`. If the issue persists, consult NVIDIA''s documentation.'
      support_details: Include GPU PCI ID, node, XID payload, ECC counters, and recurrence history.
  technical_details: 'XID 48 is logged when the GPU detects an uncorrectable memory error. It is commonly associated with
    double-bit ECC failures and may be followed by row remapping events.

    '
  severity: critical
  summary: An uncorrectable GPU memory (double-bit ECC) error was detected; the affected GPU usually requires reset or node recovery.
  signals:
  - kind: xid
    pattern: 'XID 48'
    note: kernel log / nvidia-smi
  - kind: log
    pattern: 'cudaErrorECCUncorrectable'
    note: CUDA runtime
  - kind: log
    pattern: '[Dd]ouble[- ]?[Bb]it ECC'
    note: driver or BMC log
  related:
  - xid-94-95
  - xid-79
  references:
  - title: NVIDIA XID error reference
    url: https://docs.nvidia.com/deploy/xid-errors/
  verification: verified
  last_reviewed: 2026-04-24
- id: xid-94-95
  title: XID 94 / XID 95
  aliases:
  - XID 94
  - XID 95
  - cudaErrorContained
  - contained ECC
  - uncontained ECC
  category: gpu
  likely_owner: infrastructure
  related_readme_anchor: xid-94
  personas:
    tenant_sre:
      title: Contained or uncontained GPU ECC error
      summary: XID 94 indicates a contained GPU error; XID 95 indicates an uncontained error that can affect more than one
        application.
      impact: XID 94 usually requires application restart. XID 95 normally requires GPU reset before additional work.
      action: Retry after rescheduling. Escalate if repeated on the same node or accompanied by other XIDs.
      support_details: Include XID type, rank/node mapping, job ID, and adjacent CUDA/NCCL errors.
    cloud_operator:
      title: XID 94 / 95 - Contained or uncontained ECC error
      summary: GPU driver reported an ECC error handled through containment.
      impact: XID 94 is application-contained; XID 95 requires GPU reset before reuse.
      action: Evaluate recurrence, check remapped rows and pending retirements, then reset or drain according to severity.
      support_details: Include nvidia-smi query output, XID payload, node, GPU UUID, and recurrence count.
  technical_details: 'XID 94 and XID 95 are generated on GPUs with error containment. XID 94 is contained to one application;
    XID 95 is uncontained and requires GPU reset.

    '
  severity: high
  summary: GPU driver reported a contained (XID 94) or uncontained (XID 95) ECC error; uncontained errors require a GPU reset before reuse.
  signals:
  - kind: xid
    pattern: 'XID 94'
    note: contained ECC
  - kind: xid
    pattern: 'XID 95'
    note: uncontained ECC
  - kind: log
    pattern: 'cudaErrorContained'
    note: CUDA runtime
  related:
  - xid-48
  - xid-79
  references:
  - title: NVIDIA XID error reference
    url: https://docs.nvidia.com/deploy/xid-errors/
  verification: verified
  last_reviewed: 2026-04-24
- id: xid-79
  title: XID 79
  aliases:
  - GPU has fallen off the bus
  - gpu is lost reported by slurm
  category: gpu
  likely_owner: infrastructure
  related_readme_anchor: xid-79
  personas:
    tenant_sre:
      title: GPU disappeared from the node
      summary: The driver could not access the GPU over its bus connection.
      impact: Distributed jobs usually fail after one rank loses its GPU.
      action: Treat as infrastructure unless there is strong evidence of an intentional reset.
      support_details: Include rank/node mapping and any preceding XID, PCIe, or Slurm messages.
    cloud_operator:
      title: XID 79 - GPU has fallen off the bus
      summary: Driver attempted to access a GPU and found it inaccessible.
      impact: The node or GPU usually requires drain and hardware/driver recovery.
      action: Drain node, inspect PCIe/kernel logs, and follow GPU debug guidelines.
      support_details: Include PCI address, BMC/system logs, dmesg, node, and recurrence history.
  technical_details: 'XID 79 indicates the GPU was no longer accessible over its PCIe connection. It is often caused by hardware,
    PCIe link, power, or driver issues.

    '
  severity: critical
  summary: The GPU driver lost PCIe access to a GPU; the affected node usually requires drain and hardware/driver recovery.
  signals:
  - kind: xid
    pattern: 'XID 79'
    note: kernel log
  - kind: log
    pattern: 'GPU has fallen off the bus'
    note: dmesg / nvidia-smi
  - kind: log
    pattern: 'GPU is lost'
    note: Slurm or NHC report
  related:
  - xid-48
  - xid-94-95
  references:
  - title: NVIDIA XID error reference
    url: https://docs.nvidia.com/deploy/xid-errors/
  verification: verified
  last_reviewed: 2026-04-24
- id: ib-error-12
  title: IB Error-12
  aliases:
  - IBV_WC_RETRY_EXC_ERR
  - IB Error-12 Vendor-129
  - NCCL port retry exceeded
  category: distributed_comm
  likely_owner: infrastructure
  related_readme_anchor: ib-error-12
  personas:
    tenant_sre:
      title: RDMA transport retry exceeded
      summary: One node could not receive acknowledgements from another node within RDMA retry limits.
      impact: NCCL or distributed collectives may surface this as a remote/system error.
      action: Check whether the failure is scale-dependent and collect NCCL logs; otherwise escalate as fabric instability.
      support_details: Include NCCL logs, rank-to-node mapping, peer IPs, and job size.
    cloud_operator:
      title: IB Error-12 - RDMA retry exceeded
      summary: RDMA sender exhausted retries without acknowledgement.
      impact: Usually points to network fabric, peer node, or link instability.
      action: Inspect fabric telemetry, port events, peer node health, and related NCCL errors.
      support_details: Include local and remote nodes, HCA/port, UFM events, NCCL peer IPs, and timing.
  technical_details: 'IB Error-12 maps to IBV_WC_RETRY_EXC_ERR. It occurs when the sender cannot receive acknowledgement from
    the receiver before retries are exhausted.

    '
  severity: high
  summary: An RDMA sender exhausted retries without acknowledgement; usually points to fabric, peer node, or link instability rather than the sender.
  signals:
  - kind: log
    pattern: 'IBV_WC_RETRY_EXC_ERR'
    note: NCCL or libibverbs
  - kind: log
    pattern: 'IB Error[ -]12'
    note: NCCL warning
  - kind: log
    pattern: 'Vendor[ -]?129'
    note: vendor-specific completion
  related:
  - rdma-fabric-flap
  - pytorch-nccl-watchdog
  references:
  - title: NCCL troubleshooting guide
    url: https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/troubleshooting.html
  verification: verified
  last_reviewed: 2026-04-24
- id: pytorch-nccl-watchdog
  title: PyTorch NCCL watchdog
  aliases:
  - Cancelled by PyTorch NCCL watchdog
  - NCCL watchdog timeout
  category: distributed_comm
  likely_owner: ambiguous
  related_readme_anchor: pytorch-nccl-watchdog
  personas:
    tenant_sre:
      title: PyTorch NCCL collective timeout
      summary: PyTorch terminated the process after an NCCL collective exceeded the configured timeout.
      impact: The watchdog is a symptom; the root cause can be network, GPU, remote rank crash, storage stall, or application
        hang.
      action: 'Review earlier logs on all ranks and correlate with NVIDIA Attribution secondary symptoms before changing NCCL settings.'
      support_details: 'Include all-rank logs around the timeout, job size, timeout configuration, and related NVIDIA Attribution symptoms.'
    cloud_operator:
      title: PyTorch NCCL watchdog timeout
      summary: PyTorch watchdog killed the job after collective progress stalled.
      impact: This is not proof NCCL caused the failure; it often reflects a blocked or failed rank elsewhere.
      action: Correlate with GPU XIDs, RDMA events, node failures, storage errors, and remote rank logs.
      support_details: 'Include affected ranks, responsible nodes, correlated telemetry window, and NVIDIA Attribution symptom list.'
  technical_details: 'The PyTorch NCCL watchdog terminates a job when a collective operation fails to complete before timeout.
    It is often a secondary symptom.

    '
  severity: medium
  summary: PyTorch terminated the job after an NCCL collective stalled past its timeout; usually a downstream symptom of network, GPU, or rank-side failure.
  signals:
  - kind: log
    pattern: 'Cancelled by PyTorch NCCL watchdog'
    note: PyTorch launcher
  - kind: log
    pattern: 'NCCL.*[Ww]atchdog'
    note: NCCL timeout or watchdog warning
  - kind: log
    pattern: 'ProcessGroupNCCL.*timed out'
    note: torch.distributed
  related:
  - rdma-fabric-flap
  - ib-error-12
  - xid-79
  references:
  - title: PyTorch distributed troubleshooting
    url: https://pytorch.org/docs/stable/distributed.html
  - title: NCCL environment variables
    url: https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/env.html
  verification: verified
  last_reviewed: 2026-04-24
- id: rdma-fabric-flap
  title: RDMA fabric flap
  aliases:
  - fatal_link_flap
  - port error
  - NCCL NET/IB async event
  category: distributed_comm
  likely_owner: infrastructure
  related_readme_anchor: rdma-fabric-flap
  personas:
    tenant_sre:
      title: RDMA or NCCL fabric link flap
      summary: NCCL observed an unrecoverable link or port error from the RDMA device.
      impact: Collectives can fail even if the application code is correct.
      action: Preserve NCCL WARN logs and check whether the failure appears on the same HCA or node.
      support_details: 'Include NCCL WARN lines, HCA/port, rank-to-node mapping, and NVIDIA Attribution symptoms.'
    cloud_operator:
      title: RDMA fabric flap
      summary: Fabric or port event interrupted RDMA communication.
      impact: Multi-node jobs using the affected path may fail.
      action: Inspect UFM/switch telemetry, link-down events, HCA counters, and cabling or transceiver health.
      support_details: Include switch port, HCA port, affected nodes, telemetry counters, and job timing.
  technical_details: 'NVIDIA Attribution observes RDMA fabric flaps from application logs or fabric telemetry, often through NCCL NET/IB async port errors.'
  severity: high
  summary: NCCL or RDMA observed an unrecoverable link or port event from the fabric; multi-node jobs along the affected path may fail.
  signals:
  - kind: log
    pattern: 'fatal_link_flap'
    note: fabric telemetry
  - kind: log
    pattern: 'NET/IB.*async.*port'
    note: NCCL warning
  - kind: log
    pattern: 'port (error|down)'
    note: HCA or switch event
  related:
  - ib-error-12
  - pytorch-nccl-watchdog
  - lustre-client-evicted
  references:
  - title: NCCL troubleshooting guide
    url: https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/troubleshooting.html
  verification: verified
  last_reviewed: 2026-04-24
- id: cancelled-by-timeout
  title: Cancelled by Timeout
  aliases:
  - wall time exceeded
  - time limit
  category: scheduler
  likely_owner: user
  related_readme_anchor: cancelled-by-timeout
  personas:
    tenant_sre:
      title: Scheduler wall-time timeout
      summary: The batch allocation expired before the workload completed.
      impact: Checkpointing and resume behavior determine how much progress was lost.
      action: Tune runtime, checkpoint cadence, or job partition/QoS settings.
      support_details: Include job script, requested time, checkpoint status, and last progress log.
    cloud_operator:
      title: Cancelled by Timeout
      summary: Scheduler cancelled the job after wall-time expiration.
      impact: Normal scheduler behavior.
      action: No infrastructure remediation unless timeout attribution is incorrect.
      support_details: Include Slurm state, time limit, elapsed time, and cancellation source.
  technical_details: 'Timeout cancellation means the scheduler terminated the job after it exceeded its allocated wall-clock
    limit.

    '
  severity: low
  summary: The scheduler cancelled the job because it exceeded its allocated wall-time limit; expected scheduler behavior, not infrastructure failure.
  signals:
  - kind: log
    pattern: 'DUE TO TIME LIMIT'
    note: Slurm
  - kind: log
    pattern: 'TIMEOUT'
    note: Slurm job state
  - kind: log
    pattern: 'wall(-| )?time'
    note: scheduler accounting
  related:
  - cancelled-by-user
  - slurm-preempted
  references:
  - title: Slurm sbatch documentation
    url: https://slurm.schedmd.com/sbatch.html
  verification: verified
  last_reviewed: 2026-04-24
- id: cancelled-by-user
  title: Cancelled by user
  aliases:
  - scancel
  - user cancellation
  category: scheduler
  likely_owner: user
  related_readme_anchor: cancelled-by-user
  personas:
    tenant_sre:
      title: Job cancellation signal
      summary: The job received a cancellation rather than failing from a specific application exception.
      impact: The cancellation source determines whether this is expected policy, user action, or secondary cleanup.
      action: Inspect scheduler metadata and application logs before treating it as a bug.
      support_details: Include cancelled_by, signal, job ID, and last application logs.
    cloud_operator:
      title: Cancelled by user or automation
      summary: 'Slurm recorded a cancellation; NVIDIA Attribution needs cancelled_by and context for attribution.'
      impact: May represent user scancel, admin action, site automation, watchdog cleanup, or self-termination.
      action: Inspect cancelled_by, scheduler logs, and correlated symptoms.
      support_details: 'Include cancelled_by, actor, Slurm state, signal, and adjacent NVIDIA Attribution symptoms.'
  technical_details: 'This symptom is ambiguous until the cancellation actor is inspected.

    '
  severity: low
  summary: The job received a cancellation signal; attribution depends on whether the cancelling actor was the user, an admin, automation, or a watchdog.
  signals:
  - kind: log
    pattern: 'CANCELLED'
    note: Slurm job state
  - kind: log
    pattern: 'scancel'
    note: scheduler action
  - kind: log
    pattern: 'cancelled_by'
    note: FACT scheduler metadata
  related:
  - cancelled-by-timeout
  - slurm-preempted
  references:
  - title: Slurm scancel documentation
    url: https://slurm.schedmd.com/scancel.html
  verification: verified
  last_reviewed: 2026-04-24
- id: slurm-preempted
  title: slurm-preempted
  aliases:
  - PREEMPTED
  - requeue
  category: scheduler
  likely_owner: scheduler_policy
  related_readme_anchor: slurm-preempted
  personas:
    tenant_sre:
      title: Scheduler preemption
      summary: The workload was interrupted by scheduling policy.
      impact: Application checkpoint/resume behavior determines recovery.
      action: Ensure the workload can resume from checkpoint or use a non-preemptible allocation when required.
      support_details: Include checkpoint cadence, job state history, partition, and QoS.
    cloud_operator:
      title: Slurm preempted
      summary: Slurm preempted the job according to configured policy.
      impact: Expected scheduler behavior unless policy or accounting is incorrect.
      action: Verify preemption state and requeue behavior; no node remediation required.
      support_details: Include Slurm job history, partition, QoS, and preemptor if available.
  technical_details: 'Preemption is a scheduler action to make room for higher-priority work. It is not an infrastructure
    failure by itself.

    '
  severity: low
  summary: The scheduler preempted the job according to configured policy; expected behavior, not an infrastructure failure.
  signals:
  - kind: log
    pattern: 'PREEMPTED'
    note: Slurm job state
  - kind: log
    pattern: 'requeue'
    note: scheduler action
  related:
  - cancelled-by-timeout
  - cancelled-by-user
  references:
  - title: Slurm preemption documentation
    url: https://slurm.schedmd.com/preempt.html
  verification: verified
  last_reviewed: 2026-04-24
- id: pyxis-cannot-find-container-file
  title: 'pyxis: cannot find container file'
  aliases:
  - container file missing
  - enroot image missing
  category: container
  likely_owner: user
  related_readme_anchor: pyxis-cannot-find-container-file
  personas:
    tenant_sre:
      title: Container file path or permission problem
      summary: Pyxis could not access the container image specified by the job.
      impact: Startup fails before application code runs.
      action: Validate image path from the compute environment and confirm user permissions.
      support_details: Include sbatch/srun container arguments, image path, permissions, and job ID.
    cloud_operator:
      title: Pyxis cannot find container file
      summary: Pyxis failed because the requested container image path was unavailable to the job.
      impact: Usually user configuration or permissions rather than node failure.
      action: Confirm path visibility and permissions; inspect Pyxis logs only if many users are affected.
      support_details: Include container path, mount context, user, node, and Pyxis logs if needed.
  technical_details: 'This usually means the provided container path is incorrect, missing, or not readable by the user.

    '
  severity: medium
  summary: Pyxis could not access the container image specified by the job; usually a path or permission issue rather than a node fault.
  signals:
  - kind: log
    pattern: 'cannot find container file'
    note: Pyxis startup
  - kind: log
    pattern: 'enroot.*ENOENT'
    note: enroot runtime
  - kind: log
    pattern: 'image (missing|not found)'
    note: container manager
  related:
  - pyxis-couldnt-start-container
  references:
  - title: Pyxis (NVIDIA Slurm container plugin)
    url: https://github.com/NVIDIA/pyxis
  verification: verified
  last_reviewed: 2026-04-24
- id: pyxis-couldnt-start-container
  title: 'pyxis: couldn''t start container'
  aliases:
  - container startup failed
  - enroot start failed
  category: container
  likely_owner: ambiguous
  related_readme_anchor: pyxis-couldn't-start-container
  personas:
    tenant_sre:
      title: Container runtime startup failure
      summary: Pyxis mounted or prepared the image but failed during container startup.
      impact: Causes can include bad entrypoint, missing shell, hook failure, dependency mismatch, or node runtime issue.
      action: Test the image with a minimal command and inspect startup hooks or missing executables.
      support_details: Include image name, command, entrypoint, Pyxis log, and node list.
    cloud_operator:
      title: Pyxis could not start container
      summary: Pyxis failed after image access, during container start.
      impact: Can be image-specific, hook-specific, or infrastructure/runtime-specific.
      action: Inspect slurmd/Pyxis/enroot logs and compare whether failures are image-wide, node-wide, or cluster-wide.
      support_details: Include slurmd logs, enroot logs, image, user, node, and recent runtime changes.
  technical_details: 'Pyxis startup failures can come from hooks, missing executables, runtime resource constraints, or inconsistent
    node software.

    '
  severity: medium
  summary: Pyxis prepared the image but failed during container startup; root cause may be entrypoint, hook, or node runtime.
  signals:
  - kind: log
    pattern: "couldn't start container"
    note: Pyxis startup
  - kind: log
    pattern: 'enroot start failed'
    note: enroot runtime
  - kind: log
    pattern: 'container startup failed'
    note: generic
  related:
  - pyxis-cannot-find-container-file
  references:
  - title: Pyxis (NVIDIA Slurm container plugin)
    url: https://github.com/NVIDIA/pyxis
  - title: Enroot runtime
    url: https://github.com/NVIDIA/enroot
  verification: verified
  last_reviewed: 2026-04-24
- id: dataloader-exception
  title: DataLoader Exception
  aliases:
  - DataLoader worker
  - DatasetGenerationError
  category: application
  likely_owner: ambiguous
  related_readme_anchor: dataloader-exception
  personas:
    tenant_sre:
      title: DataLoader worker or dataset generation failure
      summary: A data loading worker failed. The root cause may be application data, storage, or network filesystem behavior.
      impact: The main process usually aborts after a worker exception.
      action: Inspect the worker traceback and correlate with Lustre/NFS/S3 symptoms.
      support_details: Include full traceback, dataset path, worker ID, and storage symptoms.
    cloud_operator:
      title: DataLoader Exception
      summary: Application logs reported DataLoader or DatasetGeneration failure.
      impact: Ambiguous until correlated with storage or node symptoms.
      action: If LustreError or storage telemetry appears in the same window, attribute to storage; otherwise treat as app/data.
      support_details: Include traceback, storage telemetry, node, and timing window.
  technical_details: 'NVIDIA Attribution maps several application log patterns to DataLoader Exception. LustreError may override this symptom when storage evidence is present.'
  severity: medium
  summary: A PyTorch DataLoader worker failed; the root cause may be application data, storage backend, or network filesystem behavior.
  signals:
  - kind: log
    pattern: 'DataLoader worker'
    note: PyTorch traceback
  - kind: log
    pattern: 'DatasetGenerationError'
    note: HuggingFace datasets
  - kind: log
    pattern: 'Worker .* exited'
    note: PyTorch DataLoader
  related:
  - lustre-client-evicted
  - python-exception
  references:
  - title: PyTorch DataLoader documentation
    url: https://pytorch.org/docs/stable/data.html
  verification: verified
  last_reviewed: 2026-04-24
- id: lustre-client-evicted
  title: Lustre Client Evicted
  aliases:
  - LustreError client evicted
  - filesystem eviction
  category: storage
  likely_owner: infrastructure
  related_readme_anchor: lustre-client-evicted
  personas:
    tenant_sre:
      title: Lustre client eviction
      summary: The filesystem disconnected the client node, often due to network or storage-side disruption.
      impact: File operations can fail or hang, causing DataLoader, checkpoint, or import errors.
      action: Correlate with node network events and storage telemetry before changing application code.
      support_details: Include paths, file operation, node, job ID, and nearby LustreError logs.
    cloud_operator:
      title: Lustre client evicted
      summary: Lustre forcibly disconnected the client from storage target service.
      impact: Single-node eviction often points to node network connectivity; many clients points to storage backend.
      action: Compare affected clients, inspect storage targets, and check node NIC/network telemetry.
      support_details: Include OST/MDT, affected clients, kernel log line, network events, and timing.
  technical_details: 'Lustre client eviction occurs when the storage system disconnects a client. Scope across clients is
    key for attribution.

    '
  severity: high
  summary: Lustre forcibly disconnected the client from a storage target; file operations can hang or fail across the affected node.
  signals:
  - kind: log
    pattern: 'LustreError.*evicted'
    note: kernel log
  - kind: log
    pattern: 'client.*evicted'
    note: filesystem layer
  - kind: log
    pattern: 'lustre.*timeout'
    note: client RPC timeout
  related:
  - rdma-fabric-flap
  - dataloader-exception
  references:
  - title: Lustre client eviction (Lustre wiki)
    url: https://doc.lustre.org/lustre_manual.xhtml
  verification: verified
  last_reviewed: 2026-04-24
- id: python-exception
  title: Python Exception
  aliases:
  - traceback
  - unhandled exception
  category: application
  likely_owner: user
  related_readme_anchor: python-exception
  personas:
    tenant_sre:
      title: Unhandled Python exception
      summary: The process exited because Python raised an exception that the application did not handle.
      impact: 'NVIDIA Attribution may only see the generic symptom; the traceback contains the actionable cause.'
      action: Debug from the first exception in the traceback, not the final launcher cleanup message.
      support_details: Include full traceback, package versions, command line, and config.
    cloud_operator:
      title: Python Exception
      summary: 'NVIDIA Attribution detected a generic Python exception in application logs.'
      impact: Usually application-owned unless correlated with infrastructure symptoms.
      action: Ask for traceback and classify by exception type; check infra telemetry only if symptoms indicate it.
      support_details: 'Include log excerpt, user/job, exception class, node, and correlated NVIDIA Attribution symptoms.'
  technical_details: 'Generic Python Exception means NVIDIA Attribution detected a Python traceback but did not classify a more specific error pattern.'
  severity: medium
  summary: The process exited from an unhandled Python exception; the traceback contains the actionable cause and is usually application-owned.
  signals:
  - kind: log
    pattern: 'Traceback \(most recent call last\)'
    note: Python interpreter
  - kind: log
    pattern: 'unhandled exception'
    note: launcher cleanup
  related:
  - dataloader-exception
  - job-failed
  references:
  - title: Python errors and exceptions tutorial
    url: https://docs.python.org/3/tutorial/errors.html
  verification: verified
  last_reviewed: 2026-04-24
- id: job-failed
  title: Job failed
  aliases:
  - generic failed
  - unclassified failure
  category: unknown
  likely_owner: ambiguous
  related_readme_anchor: job-failed
  personas:
    tenant_sre:
      title: Unclassified job failure
      summary: 'NVIDIA Attribution did not match the available logs to a known failure signature.'
      impact: This can happen when logs are incomplete, the process failed early, or the pattern is not yet supported.
      action: Inspect raw stdout/stderr and identify the first error before launcher cleanup messages.
      support_details: Include complete logs, job script, environment, and any new recurring error text.
    cloud_operator:
      title: Generic job failure
