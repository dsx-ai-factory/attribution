    cloud_operator:
      title: SIGBUS delivered, possible PCIe or memory-mapped device fault
      summary: Per signal(7) SIGBUS indicates a hardware bus error, misaligned access, or mmap-past-EOF; on GPU nodes it frequently shadows a PCIe AER event or device MMIO failure.
      impact: 'Single process killed. If SIGBUS was triggered by a PCIe AER on a GPU or NIC, that device may need reset.'
      action: 'Cross-check `dmesg` for `pcieport ... AER`, `mce: [Hardware Error]`, and matching XID. Inspect BMC SEL. Run `lspci -vvv` and `mcelog`. If device-specific, drain the node and contact your hardware vendor.'
