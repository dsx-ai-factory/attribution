  related_readme_anchor: bus-error
  personas:
    tenant_sre:
      title: Your process was killed by SIGBUS
      summary: The kernel delivered SIGBUS to your process, usually because of a misaligned access or reading past the end of a memory-mapped file.
      impact: The process exits immediately and any unflushed work is lost; collectives on other ranks will hang or abort.
      action: 'Check that mmap''d files have not been truncated underneath you, validate alignment of any custom allocators, and rerun on a different node to rule out hardware. If the fault recurs, contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
