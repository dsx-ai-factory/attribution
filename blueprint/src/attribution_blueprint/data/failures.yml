- id: connection-closed
  title: Connection closed
  aliases:
  - connection closed by peer
  - enroot import connection closed
  - registry connection closed
  category: container
  likely_owner: ambiguous
  related_readme_anchor: connection-closed
  personas:
    tenant_sre:
      title: Image pull or peer connection dropped mid-stream
      summary: A TCP connection your job depended on was closed by the remote side; under Pyxis this most often means the registry dropped the enroot image pull.
      impact: The container never starts, or a partial layer leaves a corrupt image cached on the node.
      action: Retry once after a short delay; if the same node fails repeatedly, request a different allocation and report the registry URL plus timestamp.
      support_details: Provide job ID, node, container image URL, approximate time of failure, and whether prior pulls of the same image succeeded today.
    cloud_operator:
      title: Remote endpoint terminated a TCP session under Pyxis/enroot
      summary: enroot import or a dependent registry-side connection received TCP RST or graceful close before completion.
      impact: Persistent close events point to registry rate limiting, load-balancer flap, or MTU/path-MTU issues on egress; one-off closes are noise.
      action: Correlate with registry health, egress proxy logs, and per-node curl tests; clear partial enroot caches in `$ENROOT_CACHE_PATH` if reuse keeps failing.
      support_details: Capture image URL, `enroot import` stderr, time window, source node, registry response codes, and proxy/firewall logs.
  technical_details: '"Connection closed" inside a Pyxis/enroot context is almost always emitted by libcurl during `enroot import` when the registry or an intermediate proxy resets the TCP connection mid-pull. It can also surface from application sidecars launched inside the container that lose their peer. The string itself is a symptom, not a root cause; treat it as a pointer to investigate the remote endpoint identified by the surrounding log lines.'
  severity: medium
  summary: A TCP peer closed the connection; under Pyxis this is usually a registry-side drop during image import and is a symptom of a remote-side issue.
  signals:
  - kind: log
    pattern: 'Connection closed( by [a-z]+ peer)?'
    note: libcurl / enroot import
  - kind: log
    pattern: 'enroot-unsquash.*premature end'
    note: partial download
