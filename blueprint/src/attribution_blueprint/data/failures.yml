    cloud_operator:
      title: IBV QP fatal - queue pair in error state
      summary: A QP hit an unrecoverable error while accessing its work queue and was moved to IBV_QPS_ERR.
      impact: One QP per peer-pair is dead. If the underlying CQ also reports IBV_EVENT_CQ_ERR, the whole CQ subtree must be torn down. Persistent occurrences point to fabric flap, link errors, or HCA firmware issues.
      action: Run ibstat, check port state and counters via ibportstate / perfquery, scan dmesg for mlx5_core QP errors, correlate with UFM port events, and check for matching IBV_EVENT_CQ_ERR. Restart opensm or escalate to fabric vendor if errors recur.
