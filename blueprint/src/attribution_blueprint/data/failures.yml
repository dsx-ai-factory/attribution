  likely_owner: infrastructure
  related_readme_anchor: xid-145
  personas:
    tenant_sre:
      title: NVLink RLW cascade error on GB200 - usually a follow-on of another fault
      summary: Your job hit XID 145 NVLINK_RLW on a GB200 GPU; it is typically a cascade error and almost always points at another upstream XID such as XID 137 or XID 149.
      impact: The affected NCCL collective fails and the rank exits; a stand-alone XID 145 with no other XID often means another error was missed and the job should be retried after a fresh allocation.
      action: Resubmit on a healthy allocation, capture NCCL_DEBUG=INFO and the full dmesg around the failure (look for additional XIDs), and flag any combination with XID 137 in the ticket.
      support_details: Job ID, failing rank/node, dmesg around the failure (all XIDs and ErrorStatus values), NCCL log excerpt, whether MNNVL nvbandwidth was the failing kernel.
    cloud_operator:
      title: XID 145 NVLINK_RLW_ERROR cascade - decode subcode and run NVLink5 recovery
      summary: NVRM raised an NVLINK_RLW_ERROR on a GB200/NVLink5 link; sub-codes indicate Source Time Out (SRC_TRACK), RXPIPE protection faults, and REMAP failures during trunk-link fault handling.
      impact: A bare XID 145 means another XID was likely lost; combined with XID 137 it points at application-side memory release; combined with itself (RLW_REMAP-4/8/16/32) it points at the Global Fabric
        Manager and requires fabric-level intervention.
      action: Decode the subcode from dmesg (RLW_RXPIPE-8, RLW_SRC_TRACK-4/8, RLW_REMAP-4/8/16/32), correlate with NVSwitch link telemetry, and run the standard drain, nv-fabricmanager stop, nvidia-smi
        -r, FM restart cycle; pay attention to ErrorStatus 02/40/80 which require GPU reset.
      support_details: dmesg Xid 145 payload with subcode and ErrorStatus, NVSwitch link telemetry, /var/log/fabricmanager.log, GFM logs if RLW_REMAP, MNNVL nvbandwidth output if CUDA_ERROR_ILLEGAL_STATE
        was seen, NVSwitch and GPU firmware versions.
  technical_details: 'Documented subcodes from the NVIDIA Attribution readme include RLW_RXPIPE-8, RLW_SRC_TRACK-4, RLW_SRC_TRACK-8 and RLW_REMAP-4/8/16/32. XID 145 is typically a cascade indicator.'
  summary: Decode the XID 145 NVLINK_RLW subcode, look for the upstream XID, and run the NVLink5 recovery workflow on the affected node.
