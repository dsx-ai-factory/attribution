- id: exit-code-signal
  title: Exit code signal
  aliases:
  - signal exit
  - killed by signal
  - exit_status:signal
  category: scheduler
  likely_owner: ambiguous
  related_readme_anchor: exit-code-signal
  personas:
    tenant_sre:
      title: Process killed by an external signal
      summary: The job step ended because a process received an unhandled signal rather than exiting on its own.
      impact: Application logs may stop mid-step with no traceback; the launcher reports an exit_status:signal pair such as 0:9 or 0:15.
      action: Read sacct ExitCode and Reason, check whether scancel, timeout, or NCCL watchdog appears in the job log, and retry once if the signal is transient.
      support_details: 'Provide job ID, full sacct line (State, ExitCode, Reason, NodeList), the last 200 lines of stdout/stderr, and any cancelled_by value NVIDIA Attribution recorded.'
    cloud_operator:
      title: Job step terminated by signal - actor unknown
      summary: Slurmstepd records exit_status:signal_number; a non-zero signal field means an external party signalled the step.
      impact: Until the signal source is identified, attribution is open; treat as scheduler-actor investigation rather than node failure.
      action: Pull slurmctld and slurmd logs around the kill, run sacct -j JOBID --format=State,ExitCode,Reason,DerivedExitCode, and correlate with scancel audit, timeout enforcement, and site automation events.
      support_details: Provide slurmctld kill record, slurmd step termination log, signal number, KillWait setting, peer process tree, and any out-of-band BMC or NHC events on the node.
  technical_details: |
    Slurm reports job termination as exit_status:signal_number. A non-zero signal field indicates the
    process was killed by a signal rather than exiting cleanly. Common signals seen here are SIGTERM
    (15) from scancel or timeout enforcement and SIGKILL (9) from KillWait expiration or
    --signal=KILL. The signal alone does not identify the actor; the cancelled_by metadata,
    slurmctld log, and surrounding scheduler events do.
  severity: medium
  summary: A job step terminated because a process received an external signal; the signal number alone does not attribute the failure - the cancelling actor must be identified from scheduler metadata.
  signals:
  - kind: log
    pattern: 'exit code [0-9]+:[0-9]+'
    note: launcher / slurmstepd
  - kind: log
    pattern: 'killed by signal'
    note: shell / launcher
  - kind: log
    pattern: 'ExitCode=0:(9|15)'
    note: sacct record
