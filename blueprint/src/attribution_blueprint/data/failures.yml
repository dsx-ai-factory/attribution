      title: GPU push-buffer DMA error during your job
      summary: The GPU reported a push-buffer DMA error. NVIDIA Attribution classifies this symptom as Fail MultiCategory;
        the error alone does not establish which component caused it.
      action: Save the application error log and restart the affected application. Check the application and CUDA environment
        as described in the NVIDIA XID catalog. If the failure recurs, contact your cluster administrator or cloud provider
        with the job ID, node and retry results; note whether the failure follows the workload or the allocation.
      impact: The affected application may stop. A repeated failure needs investigation, but XID 32 alone does not prove
        that a GPU or PCIe component needs hardware service.
      support_details: Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs), plus job ID,
        node hostname, application error excerpt, CUDA and container versions, any XID line supplied by your cluster
        administrator or cloud provider, and retry results across allocations.
