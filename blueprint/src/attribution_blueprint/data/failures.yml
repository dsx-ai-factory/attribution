      summary: AWS Elastic Fabric Adapter reported error code 107, typically a connection or device-communication failure on the EFA NIC. NCCL or libfabric over EFA loses the transport and the collective fails.
      impact: The failing rank crashes; the collective aborts. Other ranks on the same instance may also be affected if the EFA device is the common point.
