      title: XID 13
      summary: The GPU reported XID 13, a graphics-engine exception; investigate the application without assuming a hardware
        cause.
      action: |-
        1. Preserve the first application error and the affected rank's log. If you can debug the application and cluster policy permits it, use Compute Sanitizer memcheck on a small safe reproduction with tooling supported by the installed CUDA version; inspect the failing kernel, launch arguments, and array bounds. Do not rerun the full job unchanged or reuse a process that reported a fatal CUDA error.

        2. After correcting an identified application problem, run one fresh-process test and confirm the failing operation and result validation pass. If debugging is unavailable or inconclusive, or the test fails, stop and contact the person or team responsible for your application; request your cluster administrator or cloud provider for GPU-health investigation or restricted diagnostics.
      impact: The affected application may stop or produce invalid results; check its own error and completion records.
      support_details: Provide the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs) when available, job/time,
        GPU/node identifiers and accessible XID lines, CUDA/driver/framework versions, failing kernel or operation, allowed reproduction
        and sanitizer output, and the correction/test result. Share only evidence you can access; remove credentials and private
        inputs. Ask the provider to collect restricted host logs. When asking for help, send the evidence available to you and say
        what is missing; do not delay the request because a diagnostic report or restricted logs are unavailable.
  technical_details: Use the XID together with the application error. Compute Sanitizer can investigate invalid CUDA memory
    accesses, but its result alone does not validate the complete workload.
