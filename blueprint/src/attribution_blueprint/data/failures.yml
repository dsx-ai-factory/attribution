- id: call-to-ibv-modify-qp-failed-eno-110-timeout-overwrite-nccl-parameters
  title: 'Call to ibv_modify_qp failed: errno 110 (ETIMEDOUT) - NCCL parameter override'
  aliases:
  - 'Call to ibv_modify_qp failed: eno 110 timeout(Overwrite NCCL parameters)'
  category: distributed_comm
  likely_owner: user
  personas:
    tenant_sre:
      title: QP timeout with NCCL parameter names found in the job script
      summary: NVIDIA Attribution observed an ibv_modify_qp timeout and found a restricted NCCL parameter name in the available
        job-script text. This variant is classified as `Fail User`.
      impact: Communicator setup can fail; this classification directs investigation to the job's NCCL configuration first.
      action: Compare the submitted script with the supported cluster configuration and remove unintended overrides. Capture
        the effective environment and rerun with supported settings. If the timeout persists, contact your cluster administrator
        or cloud provider with the evidence below.
      support_details: Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs), plus the failing
        log line, full submitted script, effective NCCL environment, rank-to-node mapping, and NCCL version.
  technical_details: 'When `ibv_modify_qp` returns errno 110, NVIDIA Attribution appends `(Overwrite NCCL parameters)`
    if the available job-script text contains any of `NCCL_IB_TC`, `NCCL_IB_GID_INDEX`, `NCCL_IB_HCA`, `NCCL_IB_SL`, `NCCL_CROSS_NIC`,
    `NCCL_IB_ADDR_RANGE`, `NCCL_IB_ADDR_FAMILY`, `NCCL_IB_ROCE_VERSION_NUM`, or `NCCL_IB_FIFO_TC`.


    This is a substring check, not shell evaluation. It does not prove that a variable was assigned or that its value caused
    the timeout. `NCCL_IB_MQP_RETRY_ALL` is not one of the names checked. The suffixed declaration is `Fail User`; without
    a matching parameter name, the processor emits the separately documented unsuffixed timeout, classified as `Fail InfraHW`.

    '
  summary: An ibv_modify_qp timeout coincided with a restricted NCCL parameter name in job-script text; NVIDIA Attribution
    selects the Fail User variant.
  signals:
