- id: cudaerrormemoryallocation
  title: cudaErrorMemoryAllocation
  aliases:
  - MemoryAllocation
  - cudaError 2
  - out of memory
  category: gpu
  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: CUDA could not allocate the requested memory
      summary: CUDA could not satisfy a memory or resource allocation. The requested size and the workload's live allocations
        need review.
      impact: The requested allocation failed; do not use its output as an allocated buffer.
      action: |-
        1. If you control the workload, capture the allocation error and requested size if reported. Use memory measurements available inside your job or container; if `nvidia-smi` is installed and exposes your assigned GPU, a sample during a safe reproduction can help, but a reading after the process exits can miss its peak.

        2. For PyTorch, distinguish live tensor memory from reserved allocator memory using the documentation for your installed version; `empty_cache()` does not free memory occupied by live tensors. Reduce per-GPU batch size or another supported application setting, or release allocations the application no longer needs.

        3. For other frameworks, use that framework's memory guidance or ask the person or team responsible for your application; do not apply PyTorch-specific changes to a different framework. Test once after the change and confirm both the allocation and the affected workload step succeed with valid results.

        4. If allocation still fails or you cannot change the workload, stop repeated retries and contact the person or team responsible for your application; contact your cluster administrator or cloud provider if investigation needs host or shared-resource access. Do not reset shared GPUs or stop other tenants' processes.
      support_details: For help, provide the job ID, timestamps, NVIDIA Attribution diagnosis (verdict, symptom chain, and source
        logs) when available, application and CUDA versions, and accessible error logs, together with the allocation API and requested
        size, workload shape, memory usage visible to your job, and the result of the smaller test. Remove credentials and private
        payloads before sharing. When asking for help, send the evidence available to you and say what is missing; do not delay
        the request because a diagnostic report or restricted logs are unavailable.
  technical_details: cudaErrorMemoryAllocation means that an allocation could not obtain the requested memory or resources.
    A failed allocation does not establish a hardware fault, and a free-memory estimate from cudaMemGetInfo is not a guarantee
    that a particular allocation will succeed. Use the allocation API's contract for the installed CUDA version; do not assume
    a failed call sets its output pointer to null.
  summary: CUDA could not satisfy a memory or resource allocation. The requested size and the workload's live allocations
    need review.
  signals:
