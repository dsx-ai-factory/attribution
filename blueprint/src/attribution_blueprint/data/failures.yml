      summary: The verbs transport layer detected a bad opcode or out-of-sequence packet on the responder side of an RC QP.
      impact: One QP is dead and must be reset. Recurrence points to subnet misconfiguration, switch corruption, or a malfunctioning peer HCA injecting illegal packets.
      action: Run ibstat and perfquery for the affected port, scan dmesg for mlx5_core invalid-request entries, walk the path with ibtracert, check UFM SM logs and switch counters, and engage fabric vendor if illegal packets persist.
      support_details: HCA, firmware, port, peer GUID, switch port, ibtracert output, dmesg mlx5, UFM SM log, port error counters.
  technical_details: |
