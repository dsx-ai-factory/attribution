- id: call-to-ibv-modify-qp-failed-eno-22-invalid-argument
  title: 'Call to ibv_modify_qp failed: errno 22 (EINVAL)'
  aliases:
  - ibv_modify_qp Invalid argument
  - eno 22 invalid argument
  - NCCL_IB_GID_INDEX out of range
  category: distributed_comm
  likely_owner: user
  personas:
    tenant_sre:
      title: ibv_modify_qp rejected because the chosen GID index is invalid
      summary: A forced `NCCL_IB_GID_INDEX` selected a GID slot that does not exist or is the wrong RoCE type on this NIC,
        so the kernel rejected the RTR transition with EINVAL.
      impact: The job fails immediately at communicator init; only the rank that hit the bad GID warns, but the whole world
        aborts.
      action: Unset `NCCL_IB_GID_INDEX` or set it to `-1` (auto-detect, recommended on NCCL 2.21+); rerun and confirm `ibv_modify_qp`
        succeeds.
      support_details: NCCL log with the EINVAL line, the value of NCCL_IB_GID_INDEX, NCCL version, and the output of `show_gids`
        from a healthy and a failing node.
  technical_details: '`ibv_modify_qp` returns EINVAL (errno 22) when an attribute is

    invalid for the requested state transition. On RoCE the most

    common offender is `attr->ah_attr.grh.sgid_index` pointing at a

    slot that is empty or carries a different RoCE version (v1 vs

    v2) than the peer expects. NCCL exposes this via

    `NCCL_IB_GID_INDEX`; forcing a fixed value across a cluster

    breaks when NIC firmware leaves holes in the GID table (some

    nodes use index 3, others 4 or 5). NCCL 2.21+ selects the

    correct GID dynamically when `NCCL_IB_GID_INDEX=-1`.

    '
  summary: ibv_modify_qp returned EINVAL because the selected RoCE GID index is invalid for the local NIC.
  signals:
  - kind: log
    pattern: ibv_modify_qp.*Invalid argument
    note: errno 22 string emitted by the verbs path.
  - kind: log
    pattern: NCCL WARN Call to ibv_modify_qp failed.*22
    note: NCCL warning carrying the bare errno value.
  - kind: log
    pattern: NCCL_IB_GID_INDEX=[0-9]+
    note: A non-negative pinned GID index in the environment is the usual smoking gun.
  related:
