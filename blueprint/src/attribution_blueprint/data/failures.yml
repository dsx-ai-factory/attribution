- id: ecc-error
  title: ECC Error
  aliases:
  - GPU ECC
  - SBE
  - DBE
  - single-bit error
  - double-bit error
  - poisoned gsp
  category: gpu
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: GPU reported an ECC memory error
      summary: Corrected single-bit errors are informational. Uncorrectable errors or the poisoned gsp diagnosis indicate
        an ECC-related workload failure.
      impact: DBE can abort the GPU context. The poisoned gsp diagnosis classifies the workload failure as Fail InfraHW and
        identifies the affected node.
      action: Retry on a different node. Open a ticket with job ID, node, and logs for uncorrectable errors.
      support_details: Job ID, node, GPU identifier if available, application log, and the three original driver messages
        for poisoned gsp, including timestamps.
  recommended_action:
    operational_state: monitor
  technical_details: 'GPU ECC corrects single-bit errors and reports uncorrectable memory errors, including XID 48. Corrected
    errors alone do not establish a failed workload.


    `poisoned gsp` is a compound symptom classified as `Fail InfraHW` (ECC). It requires all three active signals on the same
    node within the job''s collected evidence window:


    - `NV_PGSP_FALCON_IRQSTAT_FATAL_ERROR`

    - `XID-94`

    - `NV_ERR_RESET_REQUIRED`


    XID-48 and XID-95 are not required for this diagnosis. A missing signal or signals split across nodes do not produce `poisoned
    gsp`. XID-154 reporting a reset requirement does not substitute for `NV_ERR_RESET_REQUIRED`.


    The compound symptom retains the original source records. Its three component symptoms become secondary evidence instead
    of separate active diagnoses. Classification identifies an ECC-related infrastructure failure; the system vendor determines
    hardware repair or replacement after diagnostics.

    '
  summary: GPU ECC error, including poisoned gsp when fatal GSP, XID-94, and NV_ERR_RESET_REQUIRED occur together on one node
    in the job evidence.
