  technical_details: |
    IBV_WC_REM_INV_REQ_ERR (status 9) is generated when the responder NAKs a request as invalid: unsupported opcode, missing or undersized receive Work Request, or QP attributes that do not permit the operation. The fault is on the responder; the initiator just observes it.
  summary: The responder peer NAKed the request as invalid; investigate the peer's QP attributes and posted receives, not the sender.
