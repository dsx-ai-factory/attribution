  category: gpu
  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: GPU graphics exception flagged by your job
      summary: The GPU driver reported a software-notify exception for your CUDA kernel. This is most often an out-of-bounds
        memory access, an illegal instruction, or an illegal register access in your code.
      action: Reproduce under cuda-gdb or Compute Sanitizer (memcheck) to find the offending line. Re-run with CUDA_DEVICE_WAITS_ON_EXCEPTION=1
        if it only repros on the cluster. Retry on a different allocation only after you have ruled out an application bug.
      impact: The faulting CUDA context is torn down and the process exits with CUDA error. Other ranks usually fail next
        via NCCL timeouts.
      support_details: Attach job ID, rank-to-node mapping, the dmesg XID line, the kernel name from the XID payload, and
        any cuda-gdb or compute-sanitizer transcript.
  technical_details: 'XID 13 (GR: SW Notify Error) is logged by NVRM when the graphics engine raises a software-notify exception,
    typically from an out-of-bounds access, illegal instruction, or illegal register access in a CUDA kernel. In rare cases
    hardware or driver faults can also surface as XID 13.

    '
  summary: GPU raised a graphics SW-notify exception (XID 13); usually an application memory bug, occasionally hardware.
  signals:
  - kind: xid
    pattern: 'Xid.*: 13,'
    note: kernel log / dmesg
  - kind: log
