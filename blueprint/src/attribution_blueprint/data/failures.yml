- id: nvlink5-errors
  title: NVLink5 Errors
  aliases:
  - NVLink5 error family
  - GB200 NVLink errors
  - XID 144-150 family
  category: gpu
  likely_owner: infrastructure
  related_readme_anchor: nvlink5-errors
  personas:
    tenant_sre:
      title: 'Index entry for GB200 NVLink5 faults; look up the specific XID 144-150 for recovery guidance'
      summary: 'NVLink5 Errors is the family index for GB200 NVLink faults (XID 144-150). It is a workflow page for your cluster administrator or cloud provider; if you arrived from a job log, find the specific XID number and open that entry for guidance you can act on.'
      impact: A single rank seeing one of these XIDs means the fabric path between GPUs is broken, so any NCCL collective that crosses the failing link fails immediately; the H100-era XID 74 NVLINK_ERROR
        does not fire on this platform.
      action: 'Open the entry for the specific XID number from your dmesg line (144 SAW, 145 RLW, 146 TLW, 147 TREX, 148 NVLPW_CTRL, 149 NETIR or 150 MSE), capture NCCL_DEBUG=INFO, requeue on a healthy allocation. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: Job ID, rank/node mapping, dmesg Xid line, NCCL log excerpt, GB200 cluster name.
    cloud_operator:
      title: NVLink5 fault family on GB200 - XID 144 SAW through XID 150 MSE
      summary: GB200/NVLink5 platforms emit XID 144 (SAW), 145 (RLW), 146 (TLW), 147 (TREX), 148 (NVLPW_CTRL), 149 (NETIR) and 150 (MSE) for fabric faults that previously surfaced as XID 74 on Hopper/H100.
      impact: All seven XIDs require the same drain, FM stop, GPU reset, FM restart cycle; partial fabric loss can take down a full NVL72 domain.
      action: Use this entry as the dispatch table - confirm the XID number from dmesg, follow the per-XID entry below, and run the NVLink5 fabric recovery sequence on the affected node.
      support_details: dmesg Xid lines, /var/log/fabricmanager.log, NVSwitch SXid history, GB200/NVL72 topology map, GPU + NVSwitch firmware versions.
  technical_details: 'On GB200/NVLink5 platforms the legacy XID 74 (NVLINK_ERROR) is replaced by a per-block family: XID 144 NVLINK_SAW_ERROR, 145 NVLINK_RLW_ERROR, 146 NVLINK_TLW_ERROR, 147 NVLINK_TREX_ERROR, 148 NVLINK_NVLPW_CTRL_ERROR, 149 NVLINK_NETIR_ERROR and 150 NVLINK_MSE_ERROR. All seven share the same recovery sequence: drain the node, stop nv-fabricmanager, reset the GPUs with `nvidia-smi -r`, restart nv-fabricmanager, and validate link state before returning the node to service.'
  summary: Map any GB200 NVLink fault to one of XID 144-150 (SAW, RLW, TLW, TREX, NVLPW_CTRL, NETIR, MSE) instead of the H100 XID 74.
  signals:
  - kind: xid
    pattern: 'Xid \(PCI:[0-9a-fA-F:.]+\): 1(4[4-9]|50),'
    note: any GB200 NVLink5 XID
  - kind: log
    pattern: NVLINK_(SAW|RLW|TLW|TREX|NVLPW_CTRL|NETIR|MSE)_ERROR
    note: NVRM mnemonic in driver log
