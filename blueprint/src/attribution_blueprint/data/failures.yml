      impact: All subsequent CUDA work on the thread fails; ABI mixing can also cause silent corruption if not caught.
      action: Audit thread-context affinity (cuCtxSetCurrent), avoid calling cuCtxDestroy while other threads still hold the context, and pin to one CUDA API version per binary.
      support_details: 'Bring in another developer or framework owner if the issue stems from third-party libraries; your cluster administrator or cloud provider involvement is rarely needed. Threading code that wraps CUDA streams, library boundaries that mix driver and runtime APIs, and DSOs loaded at runtime that pull in their own CUDA.'
    cloud_operator:
      title: cudaErrorDeviceUninitialized
      summary: A workload reported a missing or destroyed CUDA context; this is almost always a code-side defect rather than a host issue.
      impact: 'Repeated occurrences cluster in user code or specific images, not host hardware; infrastructure confirmation just rules out environment factors.'
      action: Confirm the driver is loaded and healthy with nvidia-smi and DCGM, verify no other workload destabilized the GPU (xid in dmesg), then return to the application owner.
      support_details: Hand back to the developer once host health is confirmed clean. dmesg, DCGM health checks, and recent xid entries that could have torn down contexts cluster-wide.
