    cloud_operator:
      title: Power-down recorded in node syslog
      summary: The node logged a shutdown event; if unscheduled, the cause is typically a PSU failure, IPMI command, thermal trip, or admin-initiated reboot.
      impact: The node is offline until brought back; clustered occurrences imply a power or cooling event.
      action: 'Cross-check `journalctl -b -1` and BMC SEL for the power-down reason. Verify whether the shutdown was operator-initiated or hardware-driven. Capture `nvidia-bug-report.sh` if dmesg shows GPU faults around the shutdown. If a PSU or thermal trip is the cause, treat as `power-supply-unit-failure` and drain accordingly. If the issue persists, consult NVIDIA''s documentation.'
