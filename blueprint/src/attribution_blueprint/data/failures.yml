# NVIDIA Attribution failure catalog.
# recommended_action follows the Remediation Action Schema RFC (dsx-ai-factory/attribution#116):
#   operational_state: ready | monitor | drain
#   remediation_actions: ordered steps, present only when operational_state is drain.
#   Declared on infrastructure-owned entries only.
failures:
- id: xid-48
  title: XID 48
  aliases:
  - cudaErrorECCUncorrectable
  - ECC Error
  - Double Bit ECC
  category: gpu
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: Uncorrectable GPU memory error
      summary: CUDA received an uncorrectable GPU memory error. This is usually infrastructure, not application logic.
      impact: The process is expected to fail because the GPU requires reset or node recovery.
      action: Your remediation system should first attempt nvidia-smi --gpu-reset on the affected GPU (no other process may
        be using it). If the job still fails on this node, contact your cluster administrator or cloud provider. Include the
        NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).
      support_details: Include rank/node mapping, CUDA log excerpt, job ID, and whether the failure is node-sticky.
  recommended_action:
    operational_state: drain
    remediation_actions:
    - reset_gpu
    - service_required
  technical_details: 'XID 48 is logged when the GPU detects an uncorrectable memory error. It is commonly associated with
    double-bit ECC failures and may be followed by row remapping events.

    '
  severity: critical
  summary: An uncorrectable GPU memory (double-bit ECC) error was detected; the affected GPU usually requires reset or node
    recovery.
  signals:
  - kind: xid
    pattern: XID 48
    note: kernel log / nvidia-smi
  - kind: log
    pattern: cudaErrorECCUncorrectable
    note: CUDA runtime
  - kind: log
    pattern: '[Dd]ouble[- ]?[Bb]it ECC'
    note: driver or BMC log
  related:
  - xid-94-95
  - xid-79
  references:
  - title: NVIDIA XID error reference
    url: https://docs.nvidia.com/deploy/xid-errors/
  verification: verified
  last_reviewed: 2026-04-24
- id: xid-94-95
  title: XID 94 / XID 95
  aliases:
  - XID 94
  - XID 95
  - cudaErrorContained
  - contained ECC
  - uncontained ECC
  category: gpu
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: Contained or uncontained GPU ECC error
      summary: XID 94 indicates a contained GPU error; XID 95 indicates an uncontained error that can affect more than one
        application.
      impact: XID 94 requires an application restart. XID 95 requires a reset of the affected GPU before any application
        can restart.
      action: For XID 95, attempt nvidia-smi --gpu-reset on the affected GPU (no other process may be using it). For XID 94,
        restart the affected application. If the job still fails on this node after the restart, contact your cluster administrator
        or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).
      support_details: Include XID type, rank/node mapping, job ID, and adjacent CUDA/NCCL errors.
  technical_details: XID 94 and XID 95 occur on GPUs with error containment. XID 94 is contained to one application; restart
    that application and reset the GPU when convenient. XID 95 is uncontained; reset the affected GPU before applications
    restart.
  severity: high
  summary: For a contained GPU memory error (XID 94), restart the application. For an uncontained error (XID 95), reset
    the GPU before applications restart.
  signals:
  - kind: xid
    pattern: XID 94
    note: contained ECC
  - kind: xid
    pattern: XID 95
    note: uncontained ECC
  - kind: log
    pattern: cudaErrorContained
    note: CUDA runtime
  related:
  - xid-48
  - xid-79
  references:
  - title: NVIDIA XID error reference
    url: https://docs.nvidia.com/deploy/xid-errors/
  verification: verified
  last_reviewed: 2026-04-24
- id: xid-79
  title: XID 79
  aliases:
  - GPU has fallen off the bus
  - gpu is lost reported by slurm
  category: gpu
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: GPU disappeared from the node
      summary: The driver could not access the GPU over its bus connection.
      impact: Distributed jobs usually fail after one rank loses its GPU.
      action: Your remediation system should first attempt nvidia-smi --gpu-reset on the affected GPU (no other process may
        be using it). If the job still fails on this node, contact your cluster administrator or cloud provider. Include the
        NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).
      support_details: Include rank/node mapping and any preceding XID, PCIe, or Slurm messages.
  recommended_action:
    operational_state: drain
    remediation_actions:
    - reset_gpu
    - service_required
  technical_details: 'XID 79 indicates the GPU was no longer accessible over its PCIe connection. It is often caused by hardware,
    PCIe link, power, or driver issues.

    '
  severity: critical
  summary: The GPU driver lost PCIe access to a GPU; the affected node usually requires drain and hardware/driver recovery.
  signals:
  - kind: xid
    pattern: XID 79
    note: kernel log
  - kind: log
    pattern: GPU has fallen off the bus
    note: dmesg / nvidia-smi
  - kind: log
    pattern: GPU is lost
    note: Slurm or NHC report
  related:
  - xid-48
  - xid-94-95
  references:
  - title: NVIDIA XID error reference
    url: https://docs.nvidia.com/deploy/xid-errors/
  verification: verified
  last_reviewed: 2026-04-24
- id: ib-error-12
  title: IB Error-12
  aliases:
  - IBV_WC_RETRY_EXC_ERR
  - IB Error-12 Vendor-129
  - NCCL port retry exceeded
  - Irrecoverable NET/IB communicator error
  - Irrecoverable receive communicator error
  - Irrecoverable send communicator error
  category: distributed_comm
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: RDMA transport retry exceeded
      summary: One node could not receive acknowledgements from another node within RDMA retry limits.
      impact: NCCL or distributed collectives may surface this as a remote/system error.
      action: Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict,
        symptom chain, and source logs).
      support_details: Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs), plus NCCL logs,
        rank-to-node mapping, peer IPs, localGid, remoteGid, HCA name, and job size.
  recommended_action:
    operational_state: drain
    remediation_actions:
    - service_required
  technical_details: 'IB Error-12 maps to IBV_WC_RETRY_EXC_ERR. It occurs when the sender cannot receive acknowledgement
    from the receiver before retries are exhausted. NCCL may surface the same condition as an irrecoverable NET/IB communicator
    error with status IBV_WC_RETRY_EXC_ERR(12) or numeric status 12, a peer IP and port, vendor_err, localGid, remoteGid,
    qpn, and HCA name. When both GIDs are IPv4-mapped, NVIDIA Attribution can attach device IPs for both sides of the failing
    pair; otherwise it records the local and peer nodes.

    '
  severity: high
  summary: An RDMA sender exhausted retries without acknowledgement; usually points to fabric, peer node, or link instability
    rather than the sender.
  signals:
  - kind: log
    pattern: IBV_WC_RETRY_EXC_ERR
    note: NCCL or libibverbs
  - kind: log
    pattern: IB Error[ -]12
    note: NCCL warning
  - kind: log
    pattern: Vendor[ -]?129
    note: vendor-specific completion
  - kind: log
    pattern: Irrecoverable (?:send|receive) communicator error.*status[= ].*IBV_WC_RETRY_EXC_ERR\(12\)
    note: NCCL NET/IB communicator warning
  - kind: log
    pattern: Irrecoverable (?:send|receive) communicator error.*status[= ](?:IBV_WC_RETRY_EXC_ERR\(12\)|\b12\b).*vendor[
      _]err[ =]0\b
    note: NCCL NET/IB communicator warning with numeric status and no vendor syndrome
  - kind: log
    pattern: 'Irrecoverable (?:send|receive) communicator error.*localGid[: ].*remoteGid[: ].*hca[= ]'
    note: peer-pair metadata from NCCL NET/IB
  related:
  - rdma-fabric-flap
  - pytorch-nccl-watchdog
  references:
  - title: NCCL troubleshooting guide
    url: https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/troubleshooting.html
  verification: verified
  last_reviewed: 2026-04-24
- id: pytorch-nccl-watchdog
  title: PyTorch NCCL watchdog
  aliases:
  - Cancelled by PyTorch NCCL watchdog
  - NCCL watchdog timeout
  category: distributed_comm
  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: PyTorch NCCL collective timeout
      summary: PyTorch terminated the process after an NCCL collective exceeded the configured timeout.
      impact: The watchdog is a symptom; the root cause can be network, GPU, remote rank crash, storage stall, or application
        hang.
      action: Review earlier logs on all ranks and correlate with NVIDIA Attribution secondary symptoms before changing NCCL
        settings.
      support_details: Include all-rank logs around the timeout, job size, timeout configuration, and related NVIDIA Attribution
        symptoms.
  technical_details: 'The PyTorch NCCL watchdog terminates a job when a collective operation fails to complete before timeout.
    It is often a secondary symptom.

    '
  severity: medium
  summary: PyTorch terminated the job after an NCCL collective stalled past its timeout; usually a downstream symptom of network,
    GPU, or rank-side failure.
  signals:
  - kind: log
    pattern: Cancelled by PyTorch NCCL watchdog
    note: PyTorch launcher
  - kind: log
    pattern: NCCL.*[Ww]atchdog
    note: NCCL timeout or watchdog warning
  - kind: log
    pattern: ProcessGroupNCCL.*timed out
    note: torch.distributed
  related:
  - rdma-fabric-flap
  - ib-error-12
  - xid-79
  references:
  - title: PyTorch distributed troubleshooting
    url: https://pytorch.org/docs/stable/distributed.html
  - title: NCCL environment variables
    url: https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/env.html
  verification: verified
  last_reviewed: 2026-04-24
- id: rdma-fabric-flap
  title: RDMA fabric flap
  aliases:
  - fatal_link_flap
  - port error
  - NCCL NET/IB async event
  category: distributed_comm
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: RDMA or NCCL fabric link flap
      summary: NCCL observed an unrecoverable link or port error from the RDMA device.
      impact: Collectives can fail even if the application code is correct.
      action: Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom
        chain, and source logs).
      support_details: Include NCCL WARN lines, HCA/port, rank-to-node mapping, and NVIDIA Attribution symptoms.
  recommended_action:
    operational_state: drain
    remediation_actions:
    - service_required
  technical_details: NVIDIA Attribution observes RDMA fabric flaps from application logs or fabric telemetry, often through
    NCCL NET/IB async port errors.
  severity: high
  summary: NCCL or RDMA observed an unrecoverable link or port event from the fabric; multi-node jobs along the affected path
    may fail.
  signals:
  - kind: log
    pattern: fatal_link_flap
    note: fabric telemetry
  - kind: log
    pattern: NET/IB.*async.*port
    note: NCCL warning
  - kind: log
    pattern: port (error|down)
    note: HCA or switch event
  related:
  - ib-error-12
  - pytorch-nccl-watchdog
  - lustre-client-evicted
  references:
  - title: NCCL troubleshooting guide
    url: https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/troubleshooting.html
  verification: verified
  last_reviewed: 2026-04-24
- id: cancelled-by-timeout
  title: Cancelled by Timeout
  aliases:
  - wall time exceeded
  - time limit
  category: scheduler
  likely_owner: user
  personas:
    tenant_sre:
      title: Scheduler wall-time timeout
      summary: The batch allocation expired before the workload completed.
      impact: Checkpointing and resume behavior determine how much progress was lost.
      action: Tune runtime, checkpoint cadence, or job partition/QoS settings.
      support_details: Include job script, requested time, checkpoint status, and last progress log.
  technical_details: 'Timeout cancellation means the scheduler terminated the job after it exceeded its allocated wall-clock
    limit.

    '
  severity: low
  summary: The scheduler cancelled the job because it exceeded its allocated wall-time limit; expected scheduler behavior,
    not infrastructure failure.
  signals:
  - kind: log
    pattern: DUE TO TIME LIMIT
    note: Slurm
  - kind: log
    pattern: TIMEOUT
    note: Slurm job state
  - kind: log
    pattern: wall(-| )?time
    note: scheduler accounting
  related:
  - cancelled-by-user
  - slurm-preempted
  references:
  - title: Slurm sbatch documentation
    url: https://slurm.schedmd.com/sbatch.html
  verification: verified
  last_reviewed: 2026-04-24
- id: cancelled-by-user
  title: Cancelled by user
  aliases:
  - scancel
  - user cancellation
  category: scheduler
  likely_owner: user
  personas:
    tenant_sre:
      title: Job cancellation signal
      summary: The job received a cancellation rather than failing from a specific application exception.
      impact: The cancellation source determines whether this is expected policy, user action, or secondary cleanup.
      action: Inspect scheduler metadata and application logs before treating it as a bug.
      support_details: Include cancelled_by, signal, job ID, and last application logs.
  technical_details: 'This symptom is ambiguous until the cancellation actor is inspected.

    '
  severity: low
  summary: The job received a cancellation signal; attribution depends on whether the cancelling actor was the user, an admin,
    automation, or a watchdog.
  signals:
  - kind: log
    pattern: CANCELLED
    note: Slurm job state
  - kind: log
    pattern: scancel
    note: scheduler action
  - kind: log
    pattern: cancelled_by
    note: scheduler metadata
  related:
  - cancelled-by-timeout
  - slurm-preempted
  references:
  - title: Slurm scancel documentation
    url: https://slurm.schedmd.com/scancel.html
  verification: verified
  last_reviewed: 2026-04-24
- id: slurm-preempted
  title: slurm-preempted
  aliases:
  - PREEMPTED
  - requeue
  category: scheduler
  likely_owner: scheduler_policy
  personas:
    tenant_sre:
      title: Scheduler preemption
      summary: The workload was interrupted by scheduling policy.
      impact: Application checkpoint/resume behavior determines recovery.
      action: Ensure the workload can resume from checkpoint or use a non-preemptible allocation when required.
      support_details: Include checkpoint cadence, job state history, partition, and QoS.
  technical_details: 'Preemption is a scheduler action to make room for higher-priority work. It is not an infrastructure
    failure by itself.

    '
  severity: low
  summary: The scheduler preempted the job according to configured policy; expected behavior, not an infrastructure failure.
  signals:
  - kind: log
    pattern: PREEMPTED
    note: Slurm job state
  - kind: log
    pattern: requeue
    note: scheduler action
  related:
  - cancelled-by-timeout
  - cancelled-by-user
  references:
  - title: Slurm preemption documentation
    url: https://slurm.schedmd.com/preempt.html
  verification: verified
  last_reviewed: 2026-04-24
