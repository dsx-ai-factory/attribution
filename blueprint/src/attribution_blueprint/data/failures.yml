- id: missing-key-in-checkpoint
  title: Missing key in checkpoint
  aliases:
  - state_dict missing key
  - checkpoint key not found
  - load_state_dict missing keys
  category: application
  likely_owner: user
  personas:
    tenant_sre:
      title: Checkpoint state_dict is missing required keys
      summary: The checkpoint does not contain all parameters or buffers expected by the current model.
      impact: '`load_state_dict` fails immediately and the run cannot resume.'
      action: |-
        1. If you control the model configuration, match the model code and configuration to the checkpoint version using the loading procedure for your installed PyTorch version. Use `strict=False` only for an intentional partial load, inspect the returned missing and unexpected keys, and confirm that every required parameter and buffer is loaded or deliberately initialized. A successful partial load is not proof of a complete training resume.

        2. If resuming training, follow your application's procedure to restore the required optimizer and progress state as well as model parameters; use application-specific checks to confirm the intended resume point. The `load_state_dict` and `strict=False` advice is specific to PyTorch; for another framework, ask the application team for its supported loading procedure.

        3. Reload once after the correction and run your application's model validation before resuming work. If the mismatch persists, the omitted keys are unexplained, or you cannot change the model, stop and contact the person or team responsible for your application with the evidence below.
      support_details: Provide the traceback, missing and unexpected key lists, model code and configuration version, checkpoint
        identifier, and installed PyTorch version. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source
        logs) when available, the loading options, the change attempted, and the validation result. Share only evidence you can
        access and are permitted to disclose; do not upload model weights or credentials. For a training resume, include the intended
        and observed resume step and whether required optimizer and progress state was restored, without sharing checkpoint contents.
        When asking for help, send the evidence available to you and say what is missing; do not delay the request because a diagnostic
        report or restricted logs are unavailable.
  technical_details: >-
    PyTorch `load_state_dict` checks parameter and buffer keys against the model when `strict=True`.
    A missing key identifies a mismatch, not proof of checkpoint corruption. Setting `strict=False`
    allows missing or unexpected keys; it does not restore missing weights or prove the model is ready to use.
  summary: A checkpoint lacks keys expected by the current model. Check the model and checkpoint versions before resuming work.
