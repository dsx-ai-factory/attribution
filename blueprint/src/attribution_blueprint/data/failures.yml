- id: ibv-wc-loc-prot-err
  title: IBV_WC_LOC_PROT_ERR
  aliases:
    - Local Protection Error
    - WC LOC PROT ERR
    - IB Error 4
  category: distributed_comm
  likely_owner: developer
  related_readme_anchor: ibv-wc-loc-prot-err
  personas:
    tenant_sre:
      title: RDMA local protection error - bad address or LKey
      summary: 'The local HCA tried to access a buffer that is not covered by the registered memory region or whose LKey does not match. This is almost always an application bug: a freed buffer, a wrong LKey on the WR, or memory registered to a different PD.'
      impact: The failing rank crashes; the collective aborts. If only one rank is affected and the same code path is shared, suspect an MR-lifecycle bug.
      action: 'Capture NCCL/MPI logs with the failing rank, instrument the buffer-registration code path (ibv_reg_mr/ibv_dereg_mr ordering), and check for use-after-free against the WR address. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: NCCL/MPI logs, rank/node mapping, the WR address and length, the LKey used, the PD the QP was created in, and the IBV_WC_LOC_PROT_ERR line.
    cloud_operator:
      title: IBV_WC_LOC_PROT_ERR - WR address not covered by MR or LKey mismatch
      summary: 'HCA detected a memory protection violation locally: the SGE virtual address is outside any registered MR, the MR is in a different PD than the QP, or the LKey on the WR does not match the MR.'
      impact: Per-QP and per-process. Fabric is not implicated; do not drain unless paired with mlx5_core MR errors across multiple jobs.
      action: Check mlx5_core dmesg for MR-related errors, validate ibv_reg_mr return paths in the application, and capture the WC dump. The fix is in application code or its allocator, not in the fabric.
      support_details: HCA model, firmware, full WC dump (vendor_err pinpoints the protection check), mlx5_core kernel log, application allocator and MR-cache configuration.
  technical_details: |
    IBV_WC_LOC_PROT_ERR (status 4) is generated when the local HCA detects that a Work Request's data buffer falls outside any registered Memory Region accessible through the supplied LKey, the MR's protection domain does not match the QP's, or the access permissions are insufficient. It is reported on the side that posted the offending WR.
  summary: The local HCA blocked a Work Request whose buffer was not covered by a valid MR or LKey; fix the memory registration in the posting application.
  signals:
