- id: rdma-cm-events
  title: RDMA_CM Events
  aliases:
  - RDMA Connection Manager Events
  - RDMA CM Event Group
  category: distributed_comm
  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: RDMA Connection Manager event family
      summary: Group container for the RDMA_CM_EVENT_* enum, which the rdma_cm library delivers during connection setup, teardown,
        and asynchronous changes. Each specific event has its own entry; this one only orients the reader.
      impact: No direct impact - this is a category marker, not a fault.
      action: Drill into the specific RDMA_CM_EVENT_* entry that matches your log line for actionable steps.
      support_details: Identify the specific RDMA_CM_EVENT_* string from the log and pivot to that entry.
