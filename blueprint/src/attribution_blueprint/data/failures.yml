  category: distributed_comm
  likely_owner: developer
  related_readme_anchor: ibv-wc-loc-qp-op-err
  personas:
    tenant_sre:
      title: Verbs local QP operation error
      summary: The local Queue Pair rejected a Work Request because the operation is not legal for the current QP state or transport type. This is almost always an application or library bug in how the QP was created, transitioned, or used.
      action: Capture NCCL/MPI debug logs and the rank that hit the WC, then check the connection-establishment code path (rdma_connect/rdma_accept, responder_resources, initiator_depth, and QP attribute masks). Reproduce with verbose verbs tracing if possible.
      impact: The failing rank crashes; the collective aborts. Repeat on different nodes points to a code-path bug, not infrastructure.
      support_details: NCCL/MPI logs, rank/node mapping, the QP type (RC/UC/UD), ibv_create_qp / rdma_connect parameters, and the IBV_WC_LOC_QP_OP_ERR line.
    cloud_operator:
      title: IBV_WC_LOC_QP_OP_ERR - illegal WR for QP state or transport
      summary: 'Local QP detected an internal consistency error: opcode not supported by the QP transport, QP not in RTS, or required attributes missing.'
      impact: Per-QP. If reproducing on multiple ranks the application is the common cause, not the fabric.
      action: Inspect mlx5_core dmesg for QP error events, dump qp_state via mlx5dv, verify ibv_query_qp returns RTS, and confirm responder_resources / initiator_depth were set in rdma_conn_param. Hand back to the application owner once HCA and link are clean.
      support_details: HCA model, firmware, port, full WC dump (vendor_err is informative here), mlx5_core kernel log, QP attribute snapshot, and the rdma_cm event sequence.
  technical_details: |
    IBV_WC_LOC_QP_OP_ERR (status 2) is generated when the local QP detects an internal consistency error processing a Work Request, such as an opcode not allowed on the QP transport or required connect parameters left unset. rdmamojo lists missing responder_resources/initiator_depth before rdma_connect/rdma_accept as a common trigger.
  summary: The local QP rejected a Work Request as inconsistent with QP state or transport; investigate QP creation and connection setup code.
  signals:
