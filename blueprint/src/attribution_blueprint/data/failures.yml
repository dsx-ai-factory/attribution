    Megatron-LM raises this from `megatron/core/distributed/param_and_grad_buffer.py` when the parameter or gradient buffer contains a NaN or Inf after an all-reduce. Attribution is scope-driven: many ranks in one job points to software or data, the same node across jobs points to GPU hardware (often silent data corruption), and the same iteration plus rank across reruns points to a poisoned data shard.
  summary: Megatron's gradient buffer detected NaN or Inf; scope across jobs, ranks, and iterations decides whether root cause is data, software, or GPU silicon.
