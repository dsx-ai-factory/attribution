    cloud_operator:
      title: NMI watchdog reported hard LOCKUP
      summary: The hardlockup detector saw the NMI handler skip for `2*watchdog_thresh` seconds, indicating a CPU was stuck with interrupts disabled. By default the system stays locked up; if `hardlockup_panic`
        is set, the kernel panics.
      impact: Node is wedged or panicked and requires reboot; a recurring hard lockup on the same socket is a CPU/firmware/driver fault candidate.
      action: Fetch previous-boot logs via `journalctl -k -b -1`, inspect the NMI backtrace, configure kdump and analyze the vmcore with `crash(8)`; correlate with BMC SEL, MCE log, and recent driver changes;
        consider `nmi_watchdog=panic` to force vmcore on next event.
      support_details: dmesg/journalctl -k -b -1 with NMI backtrace, vmcore + System.map, BMC SEL, mcelog, kernel and driver versions, /proc/cpuinfo.
  technical_details: 'The hardlockup detector uses a per-CPU performance counter to deliver periodic NMIs. If the NMI handler does not run for `2*watchdog_thresh` seconds (default `watchdog_thresh=10`,
    so 20s), the kernel logs `NMI watchdog: Watchdog detected hard LOCKUP on cpu N` along with a backtrace. The system stays locked up unless `hardlockup_panic` is set or `nmi_watchdog=panic` was passed
    on the kernel command line.

    '
  summary: NMI watchdog detected a CPU stuck with interrupts disabled, requiring node reboot.
