- id: no-route-to-host
  title: No route to host
  aliases:
  - NCCL bootstrap No route to host
  - EHOSTUNREACH on NCCL bootstrap
  - ENETUNREACH IPoIB
  category: distributed_comm
  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: NCCL bootstrap socket reports No route to host
      summary: A bootstrap TCP or IPoIB connect() returned EHOSTUNREACH while NCCL was building the rendezvous ring.
      impact: The job aborts before any collective runs; ranks fail communicator init with no progress.
      action: Re-run on NCCL 2.23 or newer so the scalable bootstrap API is used at large scale, and confirm the failure is
        not a stale IPoIB ARP entry by retrying once after the cluster epilog clears.
      support_details: Capture NCCL_DEBUG=INFO output, the failing dst IP and interface (NCCL_SOCKET_IFNAME), the rank that
        printed the warning, and a `ip route get <dst>` from the failing node.
  technical_details: 'NCCL bootstrap uses TCP (or IPoIB when configured) to build the

    out-of-band rendezvous ring. EHOSTUNREACH ("No route to host") is

    returned by `connect(2)` when the kernel has no working route or

    the link is down. On IPoIB this is most often an InfiniBand link

    flap, an IPoIB software stack hang, or, on N/S TCP fabric, a BGP

    withdrawal. At very large scale, the legacy NCCL bootstrap can

    overload the root rank; NCCL 2.23 introduced a scalable bootstrap

    API that mitigates this.

    '
  summary: NCCL bootstrap connect failed with EHOSTUNREACH because the IPoIB or N/S TCP path to a peer rank is unreachable.
  signals:
  - kind: log
    pattern: No route to host
    note: NCCL bootstrap WARN line; check companion line for the dst IP.
  - kind: log
    pattern: NCCL WARN.*bootstrapInit.*connect
    note: NCCL bootstrap connect failure from `bootstrap.cc`.
  - kind: metric
    pattern: IB port DOWN or PortRcvErrors increasing
    note: UFM/switch counter signal correlated with the time of the warning.
