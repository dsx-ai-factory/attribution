  category: scheduler
  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: Job step ended after a signal
      summary: The exit status records a signal, but it does not identify who sent it or why.
      impact: The affected step stops; checkpoint completion cannot be inferred from the signal.
      action: |-
        1. Check your job and step accounting, including the exit-status/signal pair, and compare timestamps with timeout, cancellation, and application logs. If the signal followed an intended cancellation, this is an expected outcome. No corrective action is required for this symptom.

        2. For an unexpected signal, ask the person or team responsible for your application about launcher or watchdog termination, or your cluster administrator or cloud provider when the sender or scheduler policy is unknown; do not repeatedly retry without understanding the reason.

        3. After an authorized correction, resume once using the installed application's supported procedure and confirm progress.
      support_details: When asking for help, include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs)
        when available, plus job/step IDs, exit-status/signal pair, scheduler state, timestamps, available cancellation metadata,
        last application logs, and authorized-resume result. Share only evidence you can access; redact credentials and private
        application data. When asking for help, send the evidence available to you and say what is missing; do not delay the request
        because a diagnostic report or restricted logs are unavailable.
  technical_details: 'Slurm records an exit status and terminating signal separately. A signal may originate in the process,
    another authorized process, or scheduler handling; its number alone neither proves an external sender nor assigns fault.


    NVIDIA Attribution declares `exit code signal` with outcome `Fail User` at fallback priority. A fallback refiner can emit
    `exit code signal <number>` from job metadata when only a user-cancellation symptom remains. The prefix''s default outcome
    is not proof of who sent the signal; correlate scheduler and process logs to identify the actor.

    '
