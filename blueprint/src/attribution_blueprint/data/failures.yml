  personas:
    tenant_sre:
      title: Container could not be mounted on the node
      summary: Pyxis tried to start the container and enroot was unable to set up the mount namespace before your code ran.
      impact: The job exits at startup with no application output; rerunning on the same node usually fails the same way.
      action: 'Try once on a different node to rule out a node-local toolkit regression. If failures move with the node, hand off to platform support with the slurmd log line that begins with `pyxis: enroot mount failure`.'
      support_details: Provide job ID, node list, the full `pyxis:` log line, and whether `--container-mounts` paths exist and are readable by your UID.
    cloud_operator:
      title: enroot mount stage failed under Pyxis
      summary: enroot start aborted before pivot_root, typically in NVIDIA device injection, cgroup BPF filter, or bind-mount setup.
      impact: Affects every job that lands on the regressed node; nvidia-container-toolkit 1.17.7-1 reproduces this fleet-wide on DGX H100 until pinned back.
      action: Verify nvidia-container-toolkit version, check `/dev/nvidia*` device nodes, inspect `/run/enroot/user-$UID` for capacity and permissions, and review `journalctl -u slurmd` for the BPF or mount syscall that failed.
      support_details: Capture `dpkg -l | grep -E 'enroot|nvidia-container'`, kernel version, `cat /proc/sys/kernel/unprivileged_bpf_disabled`, enroot.conf, and the failing strace line.
  technical_details: 'Pyxis invokes enroot start during the SPANK job_init hook. enroot performs NVIDIA device injection through libnvidia-container, applies a cgroup v2 BPF device filter, and then bind-mounts user-supplied paths into the rootfs. Failure in any of these steps aborts container creation before the entrypoint runs. nvidia-container-toolkit 1.17.7-1 issues a BPF cgroup device-filter query that fails on DGX H100 with EOPNOTSUPP; pinning to 1.17.6-1 restores function. Permission denied on `/run/enroot` and missing `/dev/nvidiactl` reproduce the same Pyxis log line.'
  severity: high
  summary: enroot could not complete its mount setup under Pyxis; the container never started so the failure is infrastructure, not application code.
  signals:
