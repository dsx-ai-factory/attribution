- id: fatal-link-flap
  title: fatal_link_flap
  aliases:
    - end-of-job link flap
    - terminal link flap
  category: gpu
  likely_owner: infrastructure
  related_readme_anchor: fatal-link-flap
  personas:
    tenant_sre:
      title: Link flap at end of job caused NCCL IB errors
      summary: A network link flapped near the end of the job, breaking RDMA and surfacing as NCCL IB errors during the final collective phase.
      impact: The job's final iterations or checkpoint may be lost; subsequent jobs on the same node may also be affected.
      action: 'Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: 'Save the rank-to-host map, NCCL debug output, and the job end timestamp, then open a fabric ticket so your cluster administrator or cloud provider can investigate the flap.'
    cloud_operator:
      title: Fatal east-west link flap on node
      summary: A link transitioned through down-up cycles fast enough to abort RDMA queues, producing NCCL IB errors and treating the link as effectively down.
      impact: Any in-flight collective on the affected rail is lost; if the flap repeats, the rail must be removed from service.
      action: Pull `mlxlink` SI/FEC counters, check switch-side flap history and BER counters, run `ibdiagnet`, reseat or swap the cable/transceiver if SI errors are present, and capture `nvidia-bug-report.sh` and `dcgm diag -r 2`; if flapping persists after swap, escalate to the network vendor.
      support_details: Co-fires with `link-down-east-west`, `mellanox-links-are-down`, and UFM port flap; treat as one fabric incident.
  technical_details: |
    A "fatal" link flap is one whose duration or repetition exceeds the kernel/HCA's tolerance, causing in-flight RDMA work requests to error out. NCCL surfaces this as IB transport errors. The link itself may recover, but the in-flight work is unrecoverable.
  summary: Link flapped severely enough to abort RDMA queues, surfacing as NCCL IB errors and lost in-flight collectives.
  signals:
    - kind: log
      pattern: 'mlx5_core.*Port .* changed state to: Down'
      note: Driver-side link transition.
    - kind: log
      pattern: 'NCCL .*IB.*(error|failure)'
      note: NCCL transport error following the flap.
  related:
