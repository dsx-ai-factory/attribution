- id: ibv-event-qp-last-wqe-reached
  title: IBV_EVENT_QP_LAST_WQE_REACHED
  aliases:
    - Last WQE Reached
    - QP last WQE on SRQ
  category: distributed_comm
  likely_owner: infrastructure
  related_readme_anchor: ibv-event-qp-last-wqe-reached
  personas:
    tenant_sre:
      title: SRQ-attached QP drained its last WQE
      summary: A QP attached to a Shared Receive Queue has consumed its last receive WQE and entered the error state. The collective using that peer pair has failed.
      impact: That peer connection is dead; collectives time out and the job typically aborts.
      action: 'Preserve NCCL/MPI logs and the IBV_EVENT_QP_LAST_WQE_REACHED string, capture rank/node info. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: NCCL/MPI logs, IBV_EVENT_QP_LAST_WQE_REACHED and any preceding QP fatal/access events, rank/node mapping, job ID.
    cloud_operator:
      title: IBV_EVENT_QP_LAST_WQE_REACHED - SRQ QP drained
      summary: An SRQ-attached QP transitioned to IBV_QPS_ERR and finished consuming receive WQEs. Signals that no further WQEs will be consumed from the SRQ by this QP.
      impact: Local cleanup notification. Without this event after a QP error, the application would have to destroy the SRQ and all attached QPs to reclaim WQEs.
      action: Treat as the bookend to a prior QP fatal event; investigate the QP fatal/access/req error that preceded it. The application must move the failing QP to Reset for recovery.
      support_details: HCA, QP number, peer GUID, preceding async events on the same QP, dmesg mlx5.
  technical_details: |
    IBV_EVENT_QP_LAST_WQE_REACHED is generated for a QP attached to an SRQ when it transitions to IBV_QPS_ERR (either automatically by the device or explicitly by the user) and either has had a completion-with-error generated for the last WQE or has no remaining WQEs on its receive queue. It signals that no further WQEs will be consumed from the SRQ by this QP and serves as the safe point for resource reclamation.
  summary: An SRQ-attached QP entered the error state and consumed its last receive WQE; the application can safely reclaim resources for that QP without tearing down the SRQ.
  signals:
    - kind: log
      pattern: 'IBV_EVENT_QP_LAST_WQE_REACHED'
      note: libibverbs async-event log
    - kind: log
      pattern: 'async event.*last WQE'
      note: ULP async-event handler
