      title: client socket has timed out
      summary: A distributed application's client socket timed out; check the intended server and participating processes.
      impact: The affected operation may fail or prevent other ranks from progressing; check completion and output separately.
      action: |-
        1. Check the configured server address/port, expected process count and whether the server and clients started in the same job environment. If you own the launch configuration, correct an identified endpoint/rank mismatch. Use the installed PyTorch documentation for TCPStore backend and timeout options rather than switching backends or increasing timeouts without evidence.

        2. Use guidance for the installed framework, runtime and communication-library versions, and change only job/application settings you control. After a confirmed correction, run one small safe fresh-job test and verify all participating ranks complete the affected step with valid results.

        3. If it fails again, the cause is unclear, or changes need permissions you lack, stop and contact the person or team responsible for your application; ask your cluster administrator or cloud provider for restricted host, network or shared-service investigation. Do not repeatedly run the full job or change host services to suppress the error.
      support_details: Provide the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs) when available, job/time,
        framework/CUDA/NCCL or MPI/PMIx versions as applicable, traceback, operation/phase, server endpoint with secrets removed,
        expected/observed ranks, configured deadline, startup logs and backend if applicable, and the correction/test result. Share
        only logs you can access; remove credentials and private input data. Ask the provider to collect restricted diagnostics.
        When asking for help, send the evidence available to you and say what is missing; do not delay the request because a diagnostic
        report or restricted logs are unavailable.
