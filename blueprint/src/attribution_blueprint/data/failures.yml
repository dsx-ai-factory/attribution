- id: ibv-event-qp-access-err
  title: IBV_EVENT_QP_ACCESS_ERR
  aliases:
    - QP Access Error
    - Responder access violation
    - R_Key violation
  category: distributed_comm
  likely_owner: ambiguous
  related_readme_anchor: ibv-event-qp-access-err
  personas:
    tenant_sre:
      title: RDMA QP got an access violation
      summary: An RC queue pair received a request that violated memory protection - misaligned atomic, too many outstanding RDMA reads/atomics, an R_Key mismatch, or a length error. This is often caused by user code or library bugs.
      action: Preserve NCCL/MPI logs and any verbs traces, check whether the application or a recently updated library is using RDMA directly, file a bug with the framework or runtime team, and retry once on a fresh allocation to rule out a peer-side hardware glitch.
      impact: The QP is dead and the collective using it aborts; peer ranks typically time out.
      support_details: NCCL/MPI logs, IBV_EVENT_QP_ACCESS_ERR string, application or library version, rank/node mapping, recent code changes, job ID.
    cloud_operator:
      title: IBV QP access error - responder protection violation
      summary: The verbs transport detected a memory-protection violation (R_Key, alignment, length, atomic limit) on the responder side of an RC QP.
      impact: One QP is dead and must be reset. Recurrence on the same workload points at the application/library; recurrence across workloads on the same HCA points at a fabric or HCA defect.
      action: Run ibstat and perfquery, scan dmesg for mlx5_core access-violation entries, check UFM events for the path, and confirm whether the same job/library reproduces the event on a different node before opening a fabric ticket.
      support_details: HCA, firmware, port, peer GUID, dmesg mlx5 lines, UFM event log, application/library identification, recurrence pattern.
  technical_details: |
    IBV_EVENT_QP_ACCESS_ERR fires on RC QPs when the transport layer detects a request error on the responder - misaligned atomics, too many concurrent RDMA Read/Atomic requests, R_Key violations, or length errors without immediate data. These are usually triggered by application or middleware bugs. The QP is transitioned to IBV_QPS_ERR and must be moved to Reset for recovery.
  summary: An RC queue pair received a memory-protection or atomic-limit violation and was moved to error; reset the QP and investigate the application or library that issued the request.
  signals:
    - kind: log
      pattern: 'IBV_EVENT_QP_ACCESS_ERR'
      note: NCCL WARN or libibverbs async-event log
    - kind: log
      pattern: 'mlx5_core.*access (violation|error)'
      note: kernel mlx5 log
    - kind: log
      pattern: 'R_Key.*violation'
      note: libibverbs / ULP log
