      title: RDMA QP got a malformed responder request
      summary: An RC queue pair on this rank received an unsupported or out-of-sequence opcode from its peer; the QP is now in error.
      impact: The peer pair fails and the collective using it aborts. Other ranks usually time out behind it.
      action: 'Preserve NCCL/MPI logs, capture peer rank and node info. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
