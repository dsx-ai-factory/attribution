  personas:
    tenant_sre:
      title: Unexpected verbs transport opcode in the response
      summary: The local HCA received a response from the peer whose transport opcode does not match what was sent. This usually points to a peer-side bug, a corrupted packet on the wire, or mismatched verbs library versions.
      impact: The failing rank crashes; the collective aborts. If reproducible against a specific peer, the peer is the suspect.
      action: 'Capture NCCL/MPI logs, identify both ranks. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: NCCL/MPI logs, rank/node mapping, peer rank/node, the IBV_WC_BAD_RESP_ERR line, and the failing collective.
    cloud_operator:
      title: IBV_WC_BAD_RESP_ERR - unexpected transport opcode from responder
      summary: Initiator received a response with an opcode the local QP did not expect. Indicates either peer-side QP misbehavior, a packet-corruption event, or a software/firmware mismatch between the two sides.
      impact: Bilateral. If only one peer pair shows this, the peer is suspect; if many do, suspect a fabric corruption or firmware drift.
      action: On both nodes capture mlx5_core dmesg, ibv_devinfo, firmware versions, and port counters (symbol_error, port_rcv_errors). Check fabric-wide for asymmetric firmware. Engage vendor if pattern is fabric-scoped.
