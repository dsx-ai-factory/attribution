  severity: high
  verification: verified
  last_reviewed: 2026-04-26
- id: high-plr-receive-code-err
  title: High PLR Receive Code Err
  aliases:
  - PLR uPHY decode errors
  - Physical Link Reliability receive code error
  - UFM PLR receive code alarm
  category: distributed_comm
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: Receiver could not decode incoming PHY codewords
      summary: A UFM alarm reports that the Physical Link Reliability (PLR) layer on the receive side of an IB port is failing
        to decode incoming codewords above the configured threshold.
      impact: This is a physical-layer fault that produces increased link-level retransmits and visibly degrades NCCL bandwidth
        on flows that traverse the port; the application sees only secondary symptoms such as slow allreduces or sporadic
        retry-exceeded warnings.
      action: Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom
        chain, and source logs).
      support_details: Job ID, NCCL_IB_HCA value, alarm timestamp, and any IBV_WC_* error codes captured during the failing
        window.
  recommended_action:
    operational_state: drain
    remediation_actions:
    - service_required
  technical_details: 'PLR (Physical Link Reliability) is the NVIDIA HCA/uPHY subsystem

    that handles per-codeword integrity below FEC. The "receive code

    error" counter increments each time the uPHY decoder cannot

    reconstruct a valid codeword from the received symbols. This is

    strictly a physical-layer event - it precedes FEC correction and

    sits below the canonical IB counters (`SymbolErrors`,

    `PortRcvErrors`) that the kernel infiniband sysfs interface

    exposes. A high rate of receive code errors is a leading

    indicator of cable, connector, transceiver, or SerDes failure

    and tracks closely with raw BER.

    '
  summary: The PLR/uPHY receive decoder is rejecting incoming codewords at a rate above threshold, indicating a physical-layer
    fault on the port.
  signals:
  - kind: metric
    pattern: plr_rcv_code_err counter increasing
    note: NVIDIA HCA PLR counter exposed by UFM and `mlxlink`.
  - kind: metric
    pattern: SymbolErrors > 0 on same port
    note: Canonical IB counter that co-flags when PLR decode errors leak past FEC.
  - kind: metric
    pattern: mlxlink reports degraded FEC histogram or eye margin
    note: PHY-side confirmation of the cable/transceiver fault.
  related:
  - high-bit-error-rate-ber
  - high-symbol-effective-errors
  - high-plr-transmission-retry-events
  - rdma-fabric-flap
  references:
  - title: InfiniBand sysfs - kernel infiniband port counters
    url: https://www.kernel.org/doc/html/latest/infiniband/sysfs.html
  - title: man7 - perfquery(8)
    url: https://man7.org/linux/man-pages/man8/perfquery.8.html
  - title: NVIDIA UFM Enterprise Documentation
    url: https://docs.nvidia.com/networking/software/management-software/index.html
  severity: high
  verification: verified
  last_reviewed: 2026-04-26
- id: high-plr-transmission-retry-events
  title: High PLR Transmission Retry Events
  aliases:
  - PLR transmit retry counter
  - PLR retransmission events
  - UFM PLR retry alarm
  category: distributed_comm
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: Port is retransmitting at the physical layer
      summary: UFM raised a PLR transmission retry alarm on an IB port carrying this job's traffic; the HCA's physical layer
        is having to retry frames it failed to deliver on the first attempt.
      impact: Retries cost wall-clock time on the link and reduce achievable NCCL bandwidth; long collectives may surface
        IBV_WC_RETRY_EXC_ERR if the retry budget is exhausted.
      action: Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom
        chain, and source logs).
      support_details: NCCL_DEBUG=INFO log fragment, job-to-host mapping, and any IBV_WC_RETRY_EXC_ERR or transport timeouts
        seen during the window.
  recommended_action:
    operational_state: drain
    remediation_actions:
    - service_required
  technical_details: 'PLR transmission retry events count the number of times the

    NVIDIA uPHY had to retry sending a frame at the physical layer

    because the first attempt did not complete reliably (NACK, timed

    out, or corrupted). This is below the IB transport retry layer

    that surfaces as `IBV_WC_RETRY_EXC_ERR`; it is a sub-link-layer

    mechanism reported via NVIDIA HCA counters and UFM telemetry.

    A high rate correlates strongly with raw BER, symbol errors, and

    PLR receive code errors on either end of the link, and points at

    a physical-layer fault rather than a software or fabric-routing

    problem.

    '
  summary: PLR transmit retry events are above threshold, indicating the uPHY is retransmitting frames at the physical layer
    due to unreliable delivery.
  signals:
  - kind: metric
    pattern: plr_xmit_retry counter increasing
    note: NVIDIA HCA PLR counter exposed by UFM telemetry and `mlxlink`.
  - kind: metric
    pattern: PortXmitDiscards or PortRcvErrors co-incrementing
    note: Canonical IB counters that often co-flag during sustained PLR retries.
  - kind: metric
    pattern: effective_ber breach within same window
    note: UFM threshold; physical-layer faults raise BER and retries together.
  related:
  - high-bit-error-rate-ber
  - high-symbol-effective-errors
  - high-plr-receive-code-err
  - rdma-fabric-flap
  references:
  - title: InfiniBand sysfs - kernel infiniband port counters
    url: https://www.kernel.org/doc/html/latest/infiniband/sysfs.html
  - title: man7 - perfquery(8)
    url: https://man7.org/linux/man-pages/man8/perfquery.8.html
  - title: NVIDIA UFM Enterprise Documentation
    url: https://docs.nvidia.com/networking/software/management-software/index.html
  severity: high
  verification: verified
  last_reviewed: 2026-04-26
- id: high-portxmitwait
  title: High PortXmitWait
  aliases:
  - PortXmitWait elevated
  - IB credit stall alarm
  - UFM congestion XmitWait
  category: distributed_comm
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: Port is stalling on credits while trying to transmit
      summary: A UFM alarm reports that the port carrying this job's traffic is spending sustained time waiting for credit-based
        flow-control credits before it can send.
      impact: This is a congestion symptom, not a physical fault; NCCL collectives slow down because the HCA cannot push data
        downstream, and large allreduce or alltoall steps may extend their tail latency well past the SLA.
      action: Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom
        chain, and source logs).
      support_details: NCCL_DEBUG=INFO transcript covering the slow window, job-to-host mapping, NCCL collective and message
        size, and any timestamps where step time spiked.
  recommended_action:
    operational_state: drain
    remediation_actions:
    - service_required
  technical_details: '`PortXmitWait` is an extended IB performance counter (defined in

    the IBTA spec and exposed by the kernel infiniband sysfs

    interface and `perfquery(8)`) that increments each tick during

    which a port has at least one packet ready to transmit but no

    flow-control credit available on the target VL. Unlike BER or

    symbol errors, it is not a physical-layer signal - it is a

    congestion signal. High `PortXmitWait` means the path beyond

    this port is the bottleneck: a slow consumer, a contended

    switch uplink, or an SL/VL with under-allocated buffers. The

    remediation is fabric architecture (QoS, adaptive routing, SL

    mapping, congestion control profile), not cable or transceiver

    replacement.

    '
  summary: PortXmitWait counter is sustained above threshold because the port has data to send but is being held off by credit-based
    flow control downstream.
  signals:
  - kind: metric
    pattern: PortXmitWait increasing
    note: Extended IB counter; canonical name from the kernel infiniband sysfs interface.
  - kind: metric
    pattern: PortXmitWait / PortXmitData ratio rising
    note: Wait-per-byte ratio; the actionable metric for credit stalls.
  - kind: metric
    pattern: UFM congestion event on the same port or its downstream peer
    note: UFM congestion dashboard correlates this counter with downstream sinks.
  related:
  - high-bit-error-rate-ber
  - high-symbol-effective-errors
  - high-plr-transmission-retry-events
  - rdma-fabric-flap
  references:
  - title: InfiniBand sysfs - kernel infiniband port counters
    url: https://www.kernel.org/doc/html/latest/infiniband/sysfs.html
  - title: man7 - perfquery(8)
    url: https://man7.org/linux/man-pages/man8/perfquery.8.html
  - title: NVIDIA UFM Enterprise Documentation
    url: https://docs.nvidia.com/networking/software/management-software/index.html
  severity: medium
  verification: verified
  last_reviewed: 2026-04-26
- id: workflow-nvlink5-err
  title: NVLink5 fault recovery (XID 144-150)
  aliases:
  - NVLink5 error workflow
  - GB200 NVLink fault recovery workflow
  - XID 144-150 recovery workflow
  category: gpu
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: Report the specific NVLink5 error and its job impact
      summary: XID 144-150 events have different recovery requirements. Your cluster administrator or cloud provider decodes
        the full event; the XID number alone does not determine whether the node needs a reset.
      impact: Some events interrupt the job; others need no immediate recovery. The error details and observed job state
        determine the impact.
      action: Save the specific XID or scheduler message available in your job output, the timestamp and NCCL log. If the
        job failed, retry on a healthy allocation and ask your cluster administrator or cloud provider to correlate the
        host event.
      support_details: Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs), plus job ID,
        failing rank/node mapping, application log excerpt, scheduler reason string, and any XID payload supplied by your
        cluster administrator or cloud provider.
  technical_details: 'WORKFLOW_NVLINK5_ERR is the resolution bucket for XID 144-150. It is a decoding workflow, not a mandatory
    reset sequence. Use the NVIDIA XID 144-150 Decode table with the event''s subcomponent, intrInfo and errorStatus, including
    the local and remote effects.


    Decoded actions include `IGNORE`, `RESET_GPU`, or `XID_154_EVAL`. For `XID_154_EVAL`, follow the accompanying XID 154
    recovery action; if no XID 154 is present, restart the affected application. `IGNORE` means no immediate recovery for
    that decoded event, not ignoring other faults or any investigative guidance.


    An NVIDIA Attribution classification suffix identifies the attribution outcome, not a recovery command. Software-classified
    errors can still require recovery. Your cluster administrator or cloud provider selects any node-level recovery from
    the decoded action and validates GPU and link health afterward. Do not reset shared GPUs or restart infrastructure
    services without authorization.

    '
  summary: Decode the XID payload for NVLink5 errors 144-150 before selecting recovery; the error number alone does not
    mandate a node drain or GPU reset.
  signals:
  - kind: xid
    pattern: 'Xid \(PCI:[0-9a-fA-F:.]+\): 1(4[4-9]|50),'
    note: identifies an event to decode; does not by itself require drain or reset
  - kind: log
    pattern: WORKFLOW_NVLINK5_ERR
    note: NVIDIA Attribution bucket label
  related:
  - nvlink5-errors
  - xid-144
  - xid-145
  - xid-146
  - xid-147
  - xid-148
  - xid-149
  - xid-150
  - xid-74
  references:
  - title: NVIDIA XID error catalog
    url: https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html
  - title: NVIDIA Fabric Manager user guide
    url: https://docs.nvidia.com/datacenter/tesla/fabric-manager-user-guide/index.html
  severity: medium
  verification: verified
  last_reviewed: 2026-04-26
