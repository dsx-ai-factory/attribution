      url: https://man7.org/linux/man-pages/man5/nfs.5.html
    - title: Linux kernel - NFS filesystem documentation
      url: https://www.kernel.org/doc/html/latest/filesystems/nfs/index.html
    - title: Lustre Manual
      url: https://doc.lustre.org/lustre_manual.xhtml
  severity: medium
  verification: verified
  last_reviewed: 2026-04-26

- id: s3-exception
  title: S3 Exception
  aliases:
    - botocore ClientError
    - S3 ClientError
    - boto3 S3 exception
    - AWS S3 API error
  category: storage
  likely_owner: ambiguous
  related_readme_anchor: s3-exception
  personas:
    tenant_sre:
      title: An S3 API call from your job failed
      summary: The AWS SDK raised an exception on an S3 call. The HTTP status and the `Error.Code` in the response identify the actual failure - AccessDenied, ExpiredToken, NoSuchBucket, RequestTimeTooSkewed, SlowDown, etc. The exception message alone is not enough to triage.
      impact: The dataloader, checkpoint write, or artifact upload that issued the call fails. If the failure is auth-related (ExpiredToken, InvalidAccessKeyId), every subsequent S3 call from that process will fail the same way until credentials are refreshed.
      action: 'For 5xx or SlowDown - retry with exponential backoff. Otherwise contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: Full traceback, S3 error code and HTTP status, bucket name and key (or prefix), operation name, region/endpoint, AWS SDK version, IAM principal identity, job ID, rank/node, and timestamp.
    cloud_operator:
      title: S3 API error - identify the code, decide retryable vs auth vs config
      summary: Boto3/botocore surfaced a `ClientError` on an S3 call. The HTTP status and the S3 `<Code>` element from the XML body classify the fault into auth (`AccessDenied`, `InvalidAccessKeyId`, `SignatureDoesNotMatch`, `ExpiredToken`, `RequestTimeTooSkewed`), missing-resource (`NoSuchBucket`, `NoSuchKey`), throttling (`SlowDown` 503), service (`InternalError` 500, `ServiceUnavailable` 503), or request-shape (`InvalidArgument` 400, `BadDigest` 400, `EntityTooLarge` 400).
      impact: Scope follows the code. Auth errors are tenant- or role-scoped and will fail every call until the credential is fixed. `SlowDown` is per-prefix throttling. 5xx is service-side and usually transient. `RequestTimeTooSkewed` indicates node clock drift > 15 minutes - the node is the suspect.
      action: Pull the `<Code>`, HTTP status, and request id from the SDK response. For auth codes - verify IAM role on the instance metadata service, run `aws sts get-caller-identity`, check token expiry, confirm region matches the bucket. For `ExpiredToken`/`TokenRefreshRequired` - check STS credential TTL, IAM role rotation events, and (if a presigned URL is in play) confirm `X-Amz-Date` + `X-Amz-Expires` has not elapsed. For `RequestTimeTooSkewed` - run `chronyc tracking` on the node and fix NTP. For `SlowDown` - confirm SDK retry config (`max_attempts`, adaptive mode) and key-prefix distribution. For `NoSuchBucket`/`NoSuchKey` - confirm endpoint and account; mismatched `endpoint_url` against the wrong S3-compatible service is a common trap. For `InvalidArgument` on headers like `x-amz-content-sha256` - upgrade the SDK or fix the custom signing path.
      support_details: SDK error code, HTTP status, x-amz-request-id and x-amz-id-2 headers, bucket name, region, endpoint URL, IAM role/principal, AWS SDK version, node clock skew (`chronyc tracking`), recent IAM/role rotation events, and concurrent error rate from S3 access logs or CloudTrail.
  technical_details: |
    "S3 Exception" is the umbrella term for any failure of an S3 API call surfaced through the AWS SDK. In Python it is most commonly `botocore.exceptions.ClientError` carrying `response['Error']['Code']` (the S3 `<Code>` from the XML error body), `response['Error']['Message']`, and `response['ResponseMetadata']['HTTPStatusCode']`. Authoritative classification comes from the S3 ErrorResponses reference - 4xx codes split into auth (`AccessDenied`, `InvalidAccessKeyId`, `SignatureDoesNotMatch`, `ExpiredToken`, `TokenRefreshRequired`, `RequestTimeTooSkewed`) and request-shape (`InvalidArgument`, `BadDigest`, `EntityTooLarge`, `MalformedXML`); 404s split into `NoSuchBucket` vs `NoSuchKey`; 503s split into throttling (`SlowDown`) vs capacity (`ServiceUnavailable`); 500s are `InternalError` and retryable. Non-AWS S3-compatible services (MinIO, Ceph RGW, OCI, on-prem object stores) emit the same XML schema, so the triage path is identical with the endpoint as a known-different variable.
  summary: An S3 API call failed; classify by HTTP status and the S3 error code, then route to auth, throttling, missing-resource, request-shape, or service buckets.
  signals:
    - kind: log
      pattern: 'botocore\.exceptions\.ClientError'
      note: boto3/botocore exception class in tracebacks
    - kind: log
      pattern: 'An error occurred \(([A-Za-z]+)\) when calling the (\w+) operation'
      note: standard botocore message - capture the code and operation
    - kind: log
      pattern: '\b(?:AccessDenied|ExpiredToken|InvalidAccessKeyId|SignatureDoesNotMatch|RequestTimeTooSkewed|NoSuchBucket|NoSuchKey|SlowDown|InternalError|ServiceUnavailable|InvalidArgument)\b'
      note: S3 error codes per AWS ErrorResponses reference
    - kind: log
      pattern: 'HTTP\s+(?:4\d{2}|5\d{2})'
      note: HTTP status from request logs
  related:
    - dataloader-exception
    - stale-file-handle
    - lustreerror
  references:
    - title: AWS S3 - Error Responses
      url: https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponses.html
    - title: AWS S3 - Common Error Codes
      url: https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponsesList.html
    - title: AWS - Best practices design patterns - optimizing S3 performance
      url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/optimizing-performance.html
    - title: man7 - errno(3)
      url: https://man7.org/linux/man-pages/man3/errno.3.html
  severity: high
  verification: verified
  last_reviewed: 2026-04-26
