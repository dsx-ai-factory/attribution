- id: cudaerrornotready
  title: cudaErrorNotReady
  aliases:
  - CUDA Error 600
  - cudaErrorNotReady
  category: gpu
  likely_owner: developer
  personas:
    tenant_sre:
      title: CUDA asynchronous work is not complete yet
      summary: A CUDA completion query reported unfinished asynchronous work. This is normal while work is pending; it does
        not guarantee progress or eventual completion.
      impact: The queried result is not ready to use. Treating this status as a fatal error can stop an otherwise progressing
        application.
      action: |-
        1. No corrective action is required for this symptom. In an expected cudaEventQuery or cudaStreamQuery polling path, let the application follow its documented retry interval and progress timeout; do not treat this status alone as a GPU fault.

        2. If the application exceeds that timeout, stops unexpectedly, or treats a normal pending result as fatal, stop extending the wait and contact the person or team responsible for your application. If no progress timeout is defined, ask the person or team responsible for your application what limit to use rather than waiting indefinitely. Do not reset a GPU or change shared host settings based on this status alone.
      support_details: No support report is needed while the workload is progressing normally. If you seek help, include the NVIDIA
        Attribution diagnosis (verdict, symptom chain, and source logs) when available with the following evidence. For persistent
        no-progress or unexpected termination, provide the job ID, timestamps and elapsed wait, the query API and stream or event
        context if logged, configured timeout, last completed workload step, surrounding errors, and application and CUDA versions
        available in your job environment. Remove credentials and private payloads before sharing with the person or team responsible
        for your application. When asking for help, send the evidence available to you and say what is missing; do not delay the
        request because a diagnostic report or restricted logs are unavailable.
  technical_details: cudaErrorNotReady is an informational result from completion queries such as cudaEventQuery and cudaStreamQuery
    when the queried asynchronous work remains incomplete. It is distinct from cudaSuccess. A pending result does not measure
    progress or rule out a stalled workload. Check the query contract for your installed CUDA version and keep the application's
    bounded progress policy; replacing a query with a blocking synchronization call is not a generic recovery step.
  summary: A CUDA completion query found unfinished asynchronous work. This is normal while work is pending, but it does not
    guarantee progress or eventual completion.
  signals:
