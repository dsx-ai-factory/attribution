    tenant_sre:
      title: Remote side rejected the verbs request as invalid
      summary: The peer's HCA reported that the inbound request was malformed or unsupported - bad opcode, insufficient receive buffer, or a request the responder QP cannot service. In NCCL/MPI this surfaces as a transport error on the sending rank.
      impact: The sending rank fails; the collective aborts. The fault is on the receiving peer's QP, not the sender's HCA.
      action: 'Capture NCCL_DEBUG=INFO logs and identify both the failing rank and the peer rank. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: NCCL/MPI logs, rank/node mapping, peer rank/node, the IB Error-5 line, the failing collective, and timing.
    cloud_operator:
      title: IB Error-5 - remote invalid request on the responder QP
      summary: 'The responder peer signaled an invalid-request NAK: opcode not supported by its QP transport, receive buffer too small for the inbound send, or required QP attributes not configured for the operation.'
      impact: Bilateral - the sender sees the WC, but the fault is on the responder's QP. Per-pair unless many peers report the same.
      action: On the peer node, dump qp_state with mlx5dv, check posted receive depth against incoming message size, verify QP transport supports the operation (e.g., RDMA Read needs initiator_depth on responder), and correlate mlx5_core dmesg.
