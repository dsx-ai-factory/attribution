- id: high-bit-error-rate-ber
  title: High Bit Error Rate (BER)
  aliases:
  - Raw BER threshold exceeded
  - Effective BER alarm
  - Symbol BER alarm
  - UFM BER warning
  category: distributed_comm
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: Fabric port flagged for elevated bit error rate
      summary: UFM raised a BER alarm on an InfiniBand port carrying this job's traffic; the rate of physical-layer bit errors
        is above the post-FEC or symbol BER threshold for the link's media class.
      impact: NCCL throughput drops as the HCA spends more cycles on FEC and link-level retries; long jobs may surface sporadic
        IBV_WC_RETRY_EXC_ERR or NCCL timeouts even though no application error code maps directly to BER.
      action: Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom
        chain, and source logs).
      support_details: Job ID, NCCL_DEBUG=INFO log slice covering the alarm window, the host and HCA name from `NCCL_IB_HCA`,
        and the UFM event ID if your cluster administrator or cloud provider has already opened one.
  recommended_action:
    operational_state: drain
    remediation_actions:
    - service_required
  technical_details: InfiniBand BER is reported at three layers, each governed by a different threshold. Raw BER should not
    exceed 1e-5 for sustained operation. Effective BER must beat 1e-15 for steady-state HCA-to-switch links. UFM evaluates
    each port against the threshold table for its FEC scheme. When the measured rate crosses Warning or Error, UFM raises
    a BER event and the port is suspect for a physical-layer fault.
  summary: A UFM BER alarm fired because the port's raw, symbol, or post-FEC bit error rate exceeded the threshold for its
    FEC scheme.
  signals:
  - kind: metric
    pattern: PortRcvErrors increasing on UFM-flagged port
    note: IB extended counter; canonical name from kernel infiniband sysfs counters.
  - kind: metric
    pattern: SymbolErrors > 0 sustained
    note: Per-port symbol error counter; non-zero indicates physical-layer faults.
  - kind: metric
    pattern: effective_ber > 1e-15 OR raw_ber > 1e-5
    note: UFM telemetry threshold breach; KP4 RS-FEC links may use 1e-10 warning band.
  - kind: metric
    pattern: mlxlink FEC histogram skew or low margin
    note: PHY-level confirmation that the link is running with degraded eye margin.
  related:
  - high-symbol-effective-errors
  - high-plr-receive-code-err
  - high-plr-transmission-retry-events
  - rdma-fabric-flap
  references:
  - title: InfiniBand sysfs - kernel infiniband port counters
