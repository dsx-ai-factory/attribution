      title: A peer node closed the TCP/socket connection
      summary: A socket call to another rank failed because the peer side dropped the connection. NCCL is the messenger; the failure is on the remote node.
      impact: The collective fails and the job aborts. Restart is required.
      action: 'From the NCCL WARN, capture the remote IP and port. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs). Re-running on the same hostlist is unlikely to help if the peer is unhealthy.'
      support_details: NCCL trace excerpt showing the peer IP, rank-to-node mapping, hostlist, job ID, and the time the error occurred.
    cloud_operator:
      title: ECONNRESET on NCCL OOB or socket transport
      summary: A TCP socket used by NCCL was closed unexpectedly by the peer (RST). Usually the peer process died, the peer kernel reset the connection, or a fabric event tore down the link.
      impact: Rank pair severed; collective deadlocks job-wide. Recovery cost is the cost of finding what killed the peer.
      action: Resolve peer IP via RDMA-IP or hostname mapping. On the peer node, check process exit (SIGSEGV, OOM-killer), dmesg for XIDs, IB port flap events, and container/runtime termination. Cross-check switch port logs and conntrack/firewall for unexpected resets.
