- id: client-socket-has-timed-out
  title: client socket has timed out
  aliases:
    - TCPStore timeout
    - PyTorch client socket timeout
  category: distributed_comm
  likely_owner: ambiguous
  related_readme_anchor: client-socket-has-timed-out
  personas:
    tenant_sre:
      title: PyTorch TCPStore client socket timed out
      summary: A rank's TCPStore client could not reach the rendezvous within the timeout, often because the legacy TCPStore does not scale well at high rank counts.
      impact: The job fails during init or on the first store operation; ranks never agree on world membership.
      action: 'Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: Try setting `TORCH_DIST_INIT_BARRIER=1`, switch to the libuv TCPStore backend, capture the failing rank and `MASTER_ADDR`, and attach them to the ticket; do not reset hardware on this signal.
    cloud_operator:
      title: TCPStore client timeout on cluster
      summary: The PyTorch rendezvous store could not respond within the timeout; usually a scaling property of the legacy TCPStore exacerbated by NS-network jitter or AWS environments.
      impact: Job-level failure but no infrastructure fault implied; if many jobs hit it, work with users to enable libuv TCPStore and verify the NS network is healthy.
      action: Check NS-network and DNS health on the rendezvous host, verify `MASTER_ADDR/PORT` reachability and firewall rules, recommend `TORCH_DIST_INIT_BARRIER=1` and the libuv TCPStore backend; do not drain or reset GPUs unless the timeout co-fires with a real hardware XID.
      support_details: 'This is a framework-layer issue; infrastructure action is limited to confirming network health and advising users on the libuv backend.'
  technical_details: |
    PyTorch's distributed init uses a TCPStore for rendezvous. The legacy implementation has known scaling limits, especially under jittery NS networks; the libuv-based TCPStore reduces the symptom. The timeout is a symptom of either store scaling or NS-network reachability.
  summary: PyTorch TCPStore client timed out, typically a framework scaling issue rather than a hardware fault.
  signals:
    - kind: log
      pattern: 'client socket has timed out'
      note: PyTorch-side store timeout message.
    - kind: log
      pattern: 'torch.distributed.*TCPStore.*timeout'
      note: Companion message naming the store.
  related:
    - gloo-connectfullmesh-failed
    - ns-network-connection-lost
  references:
    - title: PyTorch torch.distributed
      url: https://pytorch.org/docs/stable/distributed.html
    - title: NVIDIA GPU debug guidelines
      url: https://docs.nvidia.com/deploy/gpu-debug-guidelines/index.html
  severity: medium
  verification: verified
  last_reviewed: 2026-04-26

- id: gloo-connectfullmesh-failed
  title: Gloo connectFullMesh failed
  aliases:
    - gloo full mesh connect error
    - gloo init failure
  category: distributed_comm
  likely_owner: ambiguous
  related_readme_anchor: gloo-connectfullmesh-failed
  personas:
    tenant_sre:
      title: Gloo could not build the full-mesh connection
      summary: Gloo failed to establish connections to every peer, usually because of a misconfigured `GLOO_SOCKET_IFNAME`/`NCCL_SOCKET_IFNAME` or an unhealthy east-west network.
      impact: Job init aborts; no training step runs.
      action: 'Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: Verify that `GLOO_SOCKET_IFNAME` and `NCCL_SOCKET_IFNAME` point at the right interface, consider `--disable-gloo-process-groups` in Megatron, and capture the failing rank, host, and interface list in the ticket.
    cloud_operator:
      title: Gloo full-mesh init failed across ranks
      summary: Gloo's all-to-all connect step failed; the cause is typically east-west fabric trouble, wrong socket interface env vars, or an unauthenticated host on the management network.
      impact: Job-level failure; if many jobs hit the same pattern, suspect the EW fabric or a cluster-wide misconfig before per-node action.
      action: Confirm `link-down-east-west` and `mellanox-links-are-down` are clear, verify the interfaces named by `GLOO_SOCKET_IFNAME`/`NCCL_SOCKET_IFNAME` are up on every host, check NS-network and EAP/802.1X status, and only after fabric is healthy advise users to retry; do not drain GPUs solely on a Gloo init failure.
      support_details: This is a control-plane signal; pair with EW link-down or NS-loss to localize.
  technical_details: |
    Gloo builds a full-mesh of TCP connections during process-group init. A failure means at least one pairwise connection could not be established; the underlying cause is almost always either a misnamed socket interface or an unhealthy network rather than a GPU fault.
  summary: Gloo full-mesh connection setup failed, usually due to an interface misconfiguration or east-west network issue.
  signals:
    - kind: log
      pattern: 'connectFullMesh failed'
      note: Gloo-side error message.
    - kind: log
      pattern: 'Gloo .*Connection (refused|reset)'
      note: Companion connection-level error.
  related:
    - link-down-east-west
    - mellanox-links-are-down
