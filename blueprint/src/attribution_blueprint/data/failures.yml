      title: A single NUMA node ran out of memory under your job
      summary: The kernel exhausted memory on one NUMA node before the system as a whole, which on GB200 can mean GPU-attached
        NUMA memory was filled by ordinary `malloc` calls.
      impact: Allocations targeting that node fail; the kernel may not invoke OOM killer if other nodes still have free memory,
        so behavior is silent until kernel-side allocations break.
      action: Check NUMA memory use. Keep host allocations on CPU NUMA nodes.
      support_details: Job ID, node, framework version, driver version, `numactl -H` and `numastat` output if collectable,
        application memory profile.
  recommended_action:
    operational_state: ready
  technical_details: 'On GB200 NVL72 platforms the OS sees CPU-attached NUMA nodes (e.g. 0/1) and GPU-attached NUMA nodes
    (2/10/18/26), the latter without CPUs. Standard `malloc` calls can land on GPU NUMA memory, and CUDA-side allocations
    are not visible to the kernel accounting, so a node-bound allocation can be exhausted before the system reaches global
    OOM. The kernel may report per-node allocation failures without invoking the OOM killer; NVIDIA driver 580+ adds mitigations.

    '
  summary: A single NUMA node was exhausted, often silently on GB200 where GPU memory appears as additional NUMA nodes.
