      summary: The HCA reported a fatal transport error. Recovering usually requires reloading the RDMA driver or rebooting the node. From the application's view the job is dead and the node is suspect.
      impact: The job fails. The node where the fatal occurred is likely unhealthy until reset.
      action: 'Capture NCCL/MPI logs, the failing rank, the timestamp, and the kernel log around it. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
