    operational_state: ready
  technical_details: 'On GB200 NVL72 platforms the OS sees CPU-attached NUMA nodes (e.g. 0/1) and GPU-attached NUMA nodes
    (2/10/18/26), the latter without CPUs. Standard `malloc` calls can land on GPU NUMA memory, and CUDA-side allocations
    are not visible to the kernel accounting, so a node-bound allocation can be exhausted before the system reaches global
    OOM. The kernel may report per-node allocation failures without invoking the OOM killer; NVIDIA driver 580+ adds mitigations.

    '
  summary: A single NUMA node was exhausted, often silently on GB200 where GPU memory appears as additional NUMA nodes.
