      action: 'Re-run with NCCL_DEBUG=INFO and NCCL_DEBUG_SUBSYS=INIT,NET,COLL, capture all rank logs, and search for the first NCCL WARN preceding the ncclInternalError. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: Attach rank logs (especially rank 0 and the first reporter), NCCL version, collective op type and shape, hostlist with rank-to-node mapping, NCCL_* env-var dump, and the NCCL_DEBUG=INFO output.
    cloud_operator:
      title: ncclInternalError - NCCL aborted; root cause upstream
      summary: NCCL returned ncclInternalError, which is a catch-all that masks a more specific failure earlier in the log.
      impact: One or more ranks tear down. Blast radius depends on the underlying cause - transport setup failures usually scope to a node or peer pair; memory faults are local.
      action: Walk backward from the ncclInternalError to the first NCCL WARN. Cross-check fabric counters, peer node health, and recent XIDs. Confirm topology (NCCL_TOPO_DUMP_FILE) and HCA selection (NCCL_IB_HCA) match the cluster wiring.
      support_details: Full NCCL trace at NCCL_DEBUG=INFO, env-var dump, peer node syslog/dmesg around the failure window, UFM/switch port events, nvidia-smi snapshot, and the topology file if available.
  technical_details: |
    ncclInternalError is the NCCL result code returned when the library hits an unexpected internal state. It is intentionally generic; the actionable signal is the first NCCL WARN line that precedes it (for example "Rank N has no transport for recv peer M on channel X/Y", a transport bootstrap failure, or a memory allocation failure).
  summary: NCCL aborted with an internal error; the real cause is in the first NCCL WARN preceding the error code.
  signals:
  - kind: log
    pattern: 'ncclInternalError'
    note: NCCL result code in rank logs or framework wrapper
  - kind: log
    pattern: 'NCCL WARN .*has no transport for'
    note: common underlying cause - missing transport between ranks
  - kind: log
    pattern: 'NCCL INFO.*Init COMPLETE'
