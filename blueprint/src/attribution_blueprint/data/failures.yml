- id: ibv-event-port-err
  title: IBV_EVENT_PORT_ERR
  aliases:
    - Port Error
    - Link down
    - IB port down
  category: distributed_comm
  likely_owner: infrastructure
  related_readme_anchor: ibv-event-port-err
  personas:
    tenant_sre:
      title: RDMA port went down
      summary: The InfiniBand port lost connectivity. Reliable connections may survive a brief outage, but a long flap exhausts retries and kills the QP.
      impact: Collectives stall and usually time out; ranks on the affected node may fail outright.
      action: 'Preserve NCCL/MPI logs and the IBV_EVENT_PORT_ERR string, capture the node and port. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: NCCL/MPI logs, IBV_EVENT_PORT_ERR string, node name, port number, job ID, timestamp.
    cloud_operator:
      title: IBV_EVENT_PORT_ERR - link down
      summary: The port_attr.state left ACTIVE/ACTIVE_DEFER and dropped to DOWN/INIT/ARMED; the link is unavailable for traffic.
      impact: Host-level outage on that port. RC connections survive only if the link returns within retry timeout; long flaps cause QP fatal events. Multi-host scope when the impaired link is on a switch trunk.
      action: Run ibstat and read /sys/class/infiniband/<dev>/ports/<n>/state, scan dmesg for mlx5_core link-down entries, check UFM for the peer switch port and counters (symbol errors, link downed, link error recovery), and reseat the cable / transceiver. Restart opensm or escalate to your fabric vendor for repeated flaps.
      support_details: HCA, port, switch port, dmesg mlx5, UFM port-event log, link error counters, cable/transceiver vendor and PN.
  technical_details: |
    IBV_EVENT_PORT_ERR is generated when a port that was ACTIVE or ACTIVE_DEFER drops to DOWN, INIT, or ARMED. The link is unavailable for traffic. RC connections do not fail immediately, but if the link does not return before the retry count is exceeded, QPs go fatal.
  summary: An InfiniBand port went down; RDMA traffic is suspended on that port and connections may go fatal if the link does not recover quickly.
  signals:
    - kind: log
      pattern: 'IBV_EVENT_PORT_ERR'
      note: NCCL WARN or libibverbs async-event log
    - kind: log
      pattern: 'mlx5_core.*Port.*(DOWN|down)'
      note: kernel mlx5 log
    - kind: log
      pattern: 'Link is down'
      note: kernel link-state log
  related:
