  personas:
    tenant_sre:
      title: Container cannot open the host RDMA device
      summary: libibverbs inside the container could not open `/dev/infiniband/uverbsN`; the device is either missing, not exposed, or blocked by permissions.
      impact: NCCL falls back to TCP at best, or the job aborts at communicator init; either way distributed throughput is gone.
      action: Confirm your srun line includes the cluster's standard RDMA mount/device flags, retry on a different node, and report if the failure is node-sticky.
      support_details: Provide srun command, container image, node list, and `ls /dev/infiniband` output captured from a quick sanity step.
    cloud_operator:
      title: RDMA device not exposed into Pyxis container namespace
      summary: enroot did not bind-mount `/dev/infiniband/*` into the container, the host driver is not loaded, or cgroup device-filter denies access.
      impact: Persistent on a node when `mlx5_ib`/`mlx5_core` is unloaded or the IB hook script is missing; cluster-wide when an image lacks the rdma-core user-space libraries.
      action: Verify `lsmod | grep mlx5`, check `/dev/infiniband/uverbs*` exists with appropriate ACL, audit the enroot hook that injects RDMA devices, and confirm `dmesg` shows the HCA enumerated.
      support_details: Capture HCA model, kernel module list, `ls -l /dev/infiniband`, enroot hook directory contents, and node BMC/PCIe events.
  technical_details: '`ibv_open_device` opens `/dev/infiniband/uverbsN` (and the matching `/dev/infiniband/rdma_cm` if used). Failure under Pyxis is typically one of: (a) the container image was built without rdma-core user-space and ships an incompatible libibverbs, (b) enroot did not inject `/dev/infiniband` into the rootfs because the host RDMA hook script is absent, (c) the host kernel modules `mlx5_core` / `mlx5_ib` are not loaded, or (d) the hardware itself failed and `dmesg` shows PCIe link or HCA enumeration errors. Cgroup v2 device-filter rules can also prevent the container from reading the chardev even when it is bind-mounted.'
  severity: high
  summary: The container could not open an RDMA chardev; in a Pyxis context this is normally device exposure, kernel modules, or image/host stack mismatch rather than user code.
  signals:
