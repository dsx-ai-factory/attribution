- id: numa-node-memory-exhaustion
  title: numa node memory exhaustion
  aliases:
  - per-NUMA OOM
  - NUMA memory pressure
  category: unknown
  likely_owner: infrastructure
  related_readme_anchor: numa-node-memory-exhaustion
  personas:
    tenant_sre:
      title: A single NUMA node ran out of memory under your job
      summary: The kernel exhausted memory on one NUMA node before the system as a whole, which on GB200 can mean GPU-attached NUMA memory was filled by ordinary `malloc` calls.
      impact: Allocations targeting that node fail; the kernel may not invoke OOM killer if other nodes still have free memory, so behavior is silent until kernel-side allocations break.
      action: On GB200, ensure your runtime is on driver 580+ and pin host allocations to CPU NUMA nodes via `numactl` or the framework equivalent; rerun with NUMA-aware placement.
      support_details: Job ID, node, framework version, driver version, `numactl -H` and `numastat` output if collectable, application memory profile.
    cloud_operator:
      title: Per-NUMA memory exhaustion
      summary: Linux can OOM a single NUMA node when allocations are bound (e.g. `__GFP_THISNODE`); on GB200 the GPU-attached NUMA nodes (2/10/18/26) are visible to the kernel and `malloc` can silently
        land on GPU memory, exhausting it without firing system-wide OOM.
      impact: Kernel-side allocations on the affected node fail, jobs see ENOMEM/EIO, and OOM killer may not run; node remains up but degraded. Driver upgrade (>=580) is the documented mitigation.
      action: Inspect `numastat -m`, `/sys/devices/system/node/nodeN/meminfo`, dmesg for `Node N normal_pages allocation failure`, evaluate upgrading NVIDIA driver to 580+, set NUMA policy via `numactl`/cgroup
        `cpuset.mems` to keep host allocations on CPU NUMAs, and document on GB200 platform runbook.
      support_details: numastat -m, /proc/buddyinfo, /sys/devices/system/node/*/meminfo, dmesg allocation failures, driver version, GB200 topology.
  technical_details: 'On GB200 NVL72 platforms the OS sees CPU-attached NUMA nodes (e.g. 0/1) and GPU-attached NUMA nodes (2/10/18/26), the latter without CPUs. Standard `malloc` calls can land on GPU NUMA
    memory, and CUDA-side allocations are not visible to the kernel accounting, so a node-bound allocation can be exhausted before the system reaches global OOM. The kernel may report per-node allocation
    failures without invoking the OOM killer; NVIDIA driver 580+ adds mitigations.

    '
  summary: A single NUMA node was exhausted, often silently on GB200 where GPU memory appears as additional NUMA nodes.
  signals:
  - kind: log
    pattern: Node \d+ .* allocation failure
    note: kernel allocator
  - kind: log
    pattern: page allocation failure.*nodemask
    note: kernel allocator
