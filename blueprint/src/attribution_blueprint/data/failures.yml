- id: eap-authentication-failed
  title: EAP authentication failed
  aliases:
  - 802.1X EAP failure
  - wpa_supplicant EAP-Failure
  - RADIUS port authentication failure
  category: distributed_comm
  likely_owner: infrastructure
  related_readme_anchor: eap-authentication-failed
  personas:
    tenant_sre:
      title: Compute node lost link because 802.1X re-authentication failed
      summary: The node-side supplicant could not re-authenticate the access port against the CSP RADIUS server and the switch dropped the port from the authorized VLAN.
      impact: All traffic over that NIC stops, including NCCL and IPoIB; jobs scheduled on the affected node hang or fail with downstream timeouts.
      action: 'Do not retry on the same node; report the affected hostname and timestamp so your cluster administrator or cloud provider can drain it, then resubmit the job on healthy nodes.'
      support_details: Provide the node hostname, NIC name, time of the failure, and any NCCL or socket error captured at that timestamp.
    cloud_operator:
      title: Port-level RADIUS/EAP authentication failed on the access switch
      summary: The Ethernet access port on this node failed 802.1X re-authentication against the CSP RADIUS realm, so the switch moved the port to an unauthorized state.
      impact: The node is partitioned from the data-plane network; any RDMA QP transitioning through that link will get ETIMEDOUT until the port is re-authorized.
      action: Pull `journalctl -u wpa_supplicant`, the kernel `IFLA_CARRIER` events, and switch authentication-session logs; cordon and drain the node, open a CSP ticket with the EAP failure timestamp,
        and only return the node to service after the supplicant succeeds and the port is back in the authorized VLAN.
      support_details: wpa_supplicant log, switch RADIUS accounting records, switchport authentication state, NIC carrier history, and the CSP support case reference.
  technical_details: 'EAP (RFC 3748) over 802.1X (IEEE 802.1X-2010) is used by some CSPs

    on bare-metal compute access ports. The host-side

    supplicant (typically `wpa_supplicant`) periodically re-authenticates

    against a RADIUS server. On EAP-Failure the switch moves the port

    out of the authorized VLAN, the kernel reports CARRIER_DOWN, and

    every L2/L3 path over that interface starts to fail. This is a

    port/fabric-level failure that is independent of any RDMA verb but

    is the most common upstream cause of `ibv_modify_qp` ETIMEDOUT on

    affected CSP clusters.

    '
  summary: 802.1X EAP re-authentication against the CSP RADIUS server failed and the switch deauthorized the access port.
  signals:
  - kind: log
    pattern: wpa_supplicant.*CTRL-EVENT-EAP-FAILURE
    note: Host supplicant indicates the RADIUS server rejected the EAP exchange.
  - kind: log
    pattern: EAP authentication failed
    note: NCCL/CSP downstream message echoing the supplicant failure.
  - kind: metric
    pattern: Switchport state authorized -> unauthorized
    note: From the access-switch authentication-session table.
