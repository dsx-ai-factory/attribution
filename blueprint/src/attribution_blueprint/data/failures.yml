- id: ibv-wc-rem-op-err
  title: IBV_WC_REM_OP_ERR
  aliases:
    - Remote Operation Error
    - WC REM OP ERR
    - IB Error 11
  category: distributed_comm
  likely_owner: ambiguous
  related_readme_anchor: ibv-wc-rem-op-err
  personas:
    tenant_sre:
      title: Remote responder failed to complete the operation
      summary: The peer reported it could not complete the request - typically an internal QP error on the responder or a malformed receive WQE on its receive queue. From the sender's view, the peer is broken or its application posted bad receives.
      impact: The sending rank fails; the collective aborts. The peer is the place to investigate.
      action: 'Capture NCCL/MPI logs and the rank pair. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: NCCL/MPI logs, rank/node mapping, peer rank/node, the IBV_WC_REM_OP_ERR line, and the failing collective.
    cloud_operator:
      title: IBV_WC_REM_OP_ERR - responder cannot complete the operation
      summary: Responder NAKed the request because of an internal QP fault or a malformed receive WQE. Distinct from REM_INV_REQ (request itself was illegal) and REM_ACCESS (permission failure) - here the responder accepted the request but failed during processing.
      impact: Per-QP on the peer. Fabric not directly implicated.
      action: On the peer node, inspect mlx5_core dmesg for QP async events, dump qp_state, validate the responder's posted receive WQEs, and check ibv_devinfo and firmware. If the peer's HCA is stuck, escalate to vendor.
      support_details: Both endpoints' HCA model, firmware, peer GUID, full WC dump including vendor_err, mlx5_core kernel logs from both sides, responder QP attribute snapshot.
  technical_details: |
    IBV_WC_REM_OP_ERR (status 11) is reported when the responder cannot complete the operation due to an internal QP error or a malformed Work Queue Element on its receive queue. The request was syntactically valid but the responder failed during execution.
  summary: The responder peer could not complete the operation; investigate the peer's QP state and receive-WQE posting.
  signals:
