      impact: Ranks on the affected node stop immediately, causing the distributed job to fail.
      action: Your remediation system should first restart the affected node's operating system (a VM reboot on a virtualized
        GPU, a host-level reboot on bare metal). If the job still fails on this node, contact your cluster administrator or
