  personas:
    tenant_sre:
      title: RDMA CM connection disconnected
      summary: The connection between the local and remote endpoints was torn down. The associated QP transitioned to the
        error state and outstanding work requests were flushed. Mid-job, this means the peer disconnected, the peer crashed,
        or the fabric dropped the connection.
      impact: The affected rank fails on flushed WRs; the collective aborts. If the disconnect was orderly (job teardown),
        it is not a failure.
      action: Capture NCCL/MPI logs and check whether the disconnect coincided with job end (orderly) or mid-run (failure).
        For mid-run disconnects, contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis
        (verdict, symptom chain, and source logs).
      support_details: NCCL/MPI logs, rank/node mapping, peer rank/node, timestamp, and whether job end overlaps the disconnect.
  technical_details: 'RDMA_CM_EVENT_DISCONNECTED is generated on both sides in response to rdma_disconnect. The associated
    QP transitions to the error state, all posted Work Requests are flushed, and the user must transition the QP to Reset
    before reuse.

    '
  summary: An rdma_cm connection was disconnected; correlate with job teardown for orderly cases or investigate peer/fabric
    for mid-run disconnects.
