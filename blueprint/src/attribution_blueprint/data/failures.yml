  category: storage
  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: A file handle is no longer valid
      summary: A filesystem operation returned ESTALE; reusing the old handle may not reach the intended object.
      impact: The affected read or write may fail; interrupted output must be validated before reuse.
      action: |-
        1. Record the affected path and operation without deleting or replacing the artifact. If you control the application and its installed version supports reopening or resuming safely, verify the intended file still exists, reopen it, and test the affected step once; validate file identity and output, not just successful opening.

        2. If reopening fails, the handle becomes stale again, or output integrity is uncertain, stop and contact your cluster administrator or cloud provider with the storage evidence. Ask the person or team responsible for your application if safe reopen/resume is unavailable; do not remount the filesystem.
      support_details: When asking for help, include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs)
        when available, plus path and operation, ESTALE traceback, file identity/size information you can access, job/rank/node
        IDs, timestamps, and reopen/validation result. Share only evidence you can access; redact credentials and private application
        data. When asking for help, send the evidence available to you and say what is missing; do not delay the request because
        a diagnostic report or restricted logs are unavailable.
  technical_details: 'ESTALE means a stale file handle. A file or export change can invalidate access, but the error alone
    does not identify who changed it or prove that retrying an interrupted write is safe.

    '
