      summary: The Lustre client in the kernel printed a `LustreError:` line. The prefix is a marker - the suffix tells you whether you got evicted, an RPC timed out, or the OST/MDT is unreachable. None of these are application bugs.
      impact: Pending IO on the affected mount returns EIO, ETIMEDOUT, or ESTALE; the rank usually crashes at the next read/write/checkpoint. If the eviction clears, the mount recovers but the failed syscalls do not.
      action: 'Capture the failing rank, the node name, and the exact `LustreError:` line from dmesg. Do not retry on the same hostlist if eviction or bulk-IO timeouts are present. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
