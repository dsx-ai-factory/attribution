- id: rdma-cm-event-device-removal
  title: RDMA_CM_EVENT_DEVICE_REMOVAL
  aliases:
    - CM Event Device Removal
  category: distributed_comm
  likely_owner: infrastructure
  related_readme_anchor: rdma-cm-event-device-removal
  personas:
    tenant_sre:
      title: RDMA CM device removed - HCA gone from the system
      summary: The RDMA device backing the rdma_cm_id was removed - typically a driver unload, hot-unplug, or HCA fatal event that took the device out of service. The application must destroy the affected rdma_cm_id.
      impact: All RDMA traffic on the device fails on the affected rank; usually the node is unhealthy.
      action: 'Capture NCCL/MPI logs and timestamp. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: NCCL/MPI logs, rank/node mapping, the RDMA_CM_EVENT_DEVICE_REMOVAL line, dmesg around the timestamp.
    cloud_operator:
      title: RDMA_CM_EVENT_DEVICE_REMOVAL - HCA went away, drain the node
      summary: rdma_cm reports the underlying device was removed. Indicates a driver unload, fatal HCA event, or PCIe-level removal - the node should be drained.
      impact: Node-scoped. All RDMA workloads on the node fail until the device is restored.
      action: Drain the node, inspect mlx5_core dmesg for fatal events or PCIe AER errors, run lspci to confirm device presence, capture firmware version and ibv_devinfo, and reload mlx5_ib or reboot. File a vendor case if the device does not return.
      support_details: HCA model, firmware, lspci output, mlx5_core kernel log, PCIe AER events, recurrence history.
  technical_details: |
    RDMA_CM_EVENT_DEVICE_REMOVAL is generated when the rdma_cm indicates that the device associated with the rdma_cm_id has been removed. Upon receipt, the user must destroy the related rdma_cm_id; the underlying device is no longer usable.
  summary: The HCA backing the rdma_cm_id was removed; drain the node and investigate driver, firmware, or hardware removal.
  signals:
    - kind: log
      pattern: 'RDMA_CM_EVENT_DEVICE_REMOVAL'
      note: rdma_cm event line
    - kind: log
      pattern: 'mlx5_core.*device removed'
      note: mlx5 driver removal
