    url: https://www.rdmamojo.com/2013/01/12/ibv_modify_qp/
  - title: NCCL Troubleshooting - RoCE GID index
    url: https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/troubleshooting.html
  severity: medium
  verification: verified
  last_reviewed: 2026-04-26
- id: call-to-ibv-modify-qp-failed-eno-22-invalid-argument-mismatched-gid
  title: 'Call to ibv_modify_qp failed: errno 22 (EINVAL) - mismatched GID'
  aliases:
  - mismatched GID
  - RoCE v1/v2 GID mismatch
  - source/destination GID type mismatch
  category: distributed_comm
  likely_owner: infrastructure
  related_readme_anchor: call-to-ibv-modify-qp-failed-eno-22-invalid-argument-mismatched-gid
  personas:
    tenant_sre:
      title: NCCL picked incompatible GIDs on the two endpoints
      summary: NCCL selected different GID types (RoCE v1 vs v2, or IPv4 vs IPv6) on the two ends of the QP, so the kernel rejected the RTR transition with EINVAL.
      impact: Communicator init fails on the rank that picks the bad GID; the job aborts before any collective starts.
      action: Confirm the host has all expected IPv4 addresses configured on the RoCE interface, verify NCCL is on a recent (2.21+) version, and rerun with `NCCL_DEBUG=INFO` so the chosen GID is logged.
      support_details: NCCL_DEBUG=INFO log, `show_gids` and `ip addr show <ifname>` from both peers, and NCCL version.
    cloud_operator:
      title: Inconsistent IP/GID configuration across the fabric
      summary: A subset of nodes is missing IPs (most often the IPv4 RoCE-v2 address) so the GID table populated by the kernel does not align with what peers advertise.
      impact: Any pair that includes a misconfigured node will fail at QP modify; symptom is sticky to specific node combinations and will recur every job.
      action: Reconcile interface configuration with the cluster source of truth (cloud-init/Ignition/Ansible), reapply missing IPv4/IPv6 addresses, validate with `show_gids` and a `ib_write_bw` between
        the suspect pair, and only readmit the node once both endpoints advertise matching RoCE v2 GIDs.
      support_details: '`show_gids` from each suspect node, network configuration template, `ib_write_bw` results, and the remediation ticket linking node and switch port.'
  technical_details: 'RoCE-v2 GIDs are derived from the IP addresses configured on the

    RDMA interface. If a host is missing its expected IPv4 address,

    the kernel will not populate the corresponding RoCE-v2 GID, and

    NCCL on the peer will still advertise its own RoCE-v2 GID. When

    `ibv_modify_qp` is called with `IBV_QP_AV` carrying a destination

    GID whose type does not match the local source GID, the kernel

    returns EINVAL. The fix is to restore the missing IP addresses

    so the GID tables on both ends are symmetric; setting

    `NCCL_IB_GID_INDEX=-1` does not help once the underlying GID

    table is incomplete.

    '
  summary: ibv_modify_qp returned EINVAL because the source and destination GIDs are of different types or the local GID table is missing entries.
  signals:
  - kind: log
    pattern: ibv_modify_qp.*Invalid argument
    note: errno 22 string from the verbs path.
  - kind: log
    pattern: NCCL INFO.*GID.*selected
    note: NCCL_DEBUG=INFO line revealing the GID NCCL picked on each side.
  - kind: metric
    pattern: missing IPv4 on RoCE interface
    note: '`ip addr show` shows no IPv4 on the RDMA NIC where peers expect one.'
  related:
  - call-to-ibv-modify-qp-failed-eno-22-invalid-argument
  - call-to-ibv-modify-qp-failed
