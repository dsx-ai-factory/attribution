  technical_details: 'XID 149 is NVLINK_NETIR_ERROR. NETIR is the network interface block of the NVLink5 controller and is
    typically the root-cause XID for GB200 fabric faults. Documented sub-codes: 149.0 (informational NETIR_INT without link-down),
    149.2 (signal integrity / SER+BER), 149.4 (alignment loss), 149.10 (PHY retransmit timeout), 149.22 (switch-side port
    down), 149.30 (fast recovery symbol BER), 149.33 (peer switch disabled), 149.37 (peer switch reset), 149.42 (L1 failure).
