  personas:
    tenant_sre:
      title: RDMA shared receive queue went fatal
      summary: A Shared Receive Queue used by NCCL or another RDMA library hit a fatal error; every QP attached to it is now dead.
      impact: All ranks sharing this SRQ lose their RDMA connections; the collective fails and the job typically aborts.
      action: 'Preserve NCCL/MPI logs and the IBV_EVENT_SRQ_ERR string, capture rank/node mapping. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: NCCL/MPI logs, IBV_EVENT_SRQ_ERR string, rank/node mapping, job ID, timestamp.
    cloud_operator:
      title: IBV_EVENT_SRQ_ERR - shared receive queue in error
      summary: The verbs layer reported a fatal SRQ error; receive WRs cannot be dequeued and every associated QP transitions to IBV_QPS_ERR with IBV_EVENT_QP_FATAL.
      impact: HCA-local but multi-QP. Application must reset every affected QP. Recurring SRQ errors point at HCA or firmware issues.
      action: Run ibstat, scan dmesg for mlx5_core SRQ entries, check UFM event log, and reload mlx5_core if the HCA does not recover. Escalate to fabric/HW vendor with firmware version if recurring.
      support_details: HCA model and firmware, port, dmesg mlx5, UFM event log, list of affected QPs and peer GUIDs.
  technical_details: |
    IBV_EVENT_SRQ_ERR is generated when a fatal error on a Shared Receive Queue prevents dequeuing of WRs and reporting of receive completions. Every QP associated with the SRQ is transitioned to IBV_QPS_ERR and receives IBV_EVENT_QP_FATAL; each must be moved to Reset for recovery.
  summary: A Shared Receive Queue went fatal and every QP bound to it is in error; the application must reset all affected QPs.
  signals:
    - kind: log
      pattern: 'IBV_EVENT_SRQ_ERR'
