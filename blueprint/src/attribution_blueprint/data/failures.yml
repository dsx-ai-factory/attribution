- id: broken-pipe
  title: Broken pipe
  aliases:
  - Broken pipe
  - EPIPE
  - errno 32
  category: distributed_comm
  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: Communication encountered a closed pipe or socket
      summary: The communication endpoint was no longer available. Look for the first process exit or shutdown rather than
        assuming the reporting rank caused the failure.
      impact: The affected operation fails, and other ranks can terminate during distributed-job cleanup.
      action: Compare the error timestamp with logs from the peer and launcher. Investigate earlier application exceptions,
        memory exhaustion, cancellation, or node loss before retrying. If the cause remains unclear or the failure recurs,
        contact your cluster administrator or cloud provider with the evidence below.
      support_details: Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs), plus the full
        warning, peer IP and port if present, both ranks' logs, exit codes, job ID, and timestamps.
  technical_details: '`Broken pipe` is the generic operating-system error description for `EPIPE`, associated with writing
    to a pipe without a reader or to a socket shut down for writing. NVIDIA Attribution''s socket processors preserve the
    captured error reason as a symptom name. The declaration for `Broken pipe` has outcome `Fail MultiCategory` and priority
    `LOW_GENERIC`; stronger related evidence can supersede it.


    The separately documented Python exception `BrokenPipeError` can describe the same operating-system condition, but
    it is a distinct registered name. This page documents the exact `Broken pipe` symptom and does not change either name''s
    runtime classification.

    '
  summary: A pipe or socket was no longer available for communication; investigate the preceding endpoint failure or shutdown.
  signals:
  - kind: log
    pattern: 'socketProgressOpt:.*failed : Broken pipe'
    note: The socket processor captures Broken pipe as the emitted reason.
  - kind: log
    pattern: socketPollConnect:.*returned [0-9]+\(Broken pipe\) errno
