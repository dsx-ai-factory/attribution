- id: workflow-nvlink5-err
  title: 'NVLink5 fault recovery (XID 144-150)'
  aliases:
  - NVLink5 error workflow
  - GB200 NVLink fault recovery workflow
  - XID 144-150 recovery workflow
  category: gpu
  likely_owner: infrastructure
  related_readme_anchor: workflow-nvlink5-err
  personas:
    tenant_sre:
      title: 'If you arrived from a job log find the specific XID entry for recovery guidance'
      summary: This is the platform-team recovery procedure for NVLink5 faults (XID 144-150); it is not an application-side failure. If you reached this page from a job log, look
        up the specific XID number for guidance you can act on.
      impact: 'From the job''s perspective, the affected rank dies and any collective spanning that node fails; the job is held or requeued until your cluster administrator or cloud provider finishes the recovery.'
      action: 'Open the entry for the specific XID 144-150 number you saw, requeue on a different allocation, and attach the failing rank, NCCL_DEBUG=INFO log and timestamp. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: Job ID, failing rank/node mapping, NCCL log excerpt, dmesg Xid line if available, scheduler reason string for the affected node.
    cloud_operator:
      title: Run the canonical NVLink5 recovery sequence for XID 144-150 on the affected node
      summary: This entry covers the NVIDIA-specified recovery procedure for NVLINK SAW/RLW/TLW/TREX/NVLPW_CTRL/NETIR/MSE faults on GB200/NVLink5 platforms.
      impact: 'One node is removed from service for the duration of nv-fabricmanager stop, GPU reset, and nv-fabricmanager restart. If nv-fabricmanager cannot retrain links, the node stays drained.'
      action: Drain the node, stop nv-fabricmanager, run nvidia-smi -r on the affected GPUs, restart nv-fabricmanager, verify with nvidia-smi nvlink -s and nvidia-smi nvlink -e, and only un-drain after
        links come up clean.
      support_details: dmesg Xid payload, /var/log/fabricmanager.log, NVSwitch SXid history, nvidia-smi nvlink -e counters, GPU and NVSwitch firmware versions, PCI BDFs of the affected GPUs and switches.
  technical_details: 'XID 144 through XID 150 cover the NVLink5 fault family on GB200 platforms (NVLINK SAW, RLW, TLW, TREX, NVLPW_CTRL, NETIR, MSE). Recovery: drain the affected node, stop nv-fabricmanager, reset the GPUs with `nvidia-smi -r`, restart nv-fabricmanager, and validate with `nvidia-smi nvlink -s` and `nvidia-smi nvlink -e` before returning the node to service.'
  summary: Run the standard drain / FM stop / nvidia-smi -r / FM restart sequence whenever XID 144-150 fires on a GB200 node.
