# NVIDIA Attribution failure catalog.
# recommended_action follows the Remediation Action Schema RFC (dsx-ai-factory/attribution#116):
#   operational_state: ready | monitor | drain
#   remediation_actions: ordered steps, present only when operational_state is drain.
#   Declared on infrastructure-owned entries only.
failures:
- id: xid-48
  title: XID 48
  aliases:
  - cudaErrorECCUncorrectable
  - ECC Error
  - Double Bit ECC
  category: gpu
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: Uncorrectable GPU memory error
      summary: CUDA received an uncorrectable GPU memory error. This is usually infrastructure, not application logic.
      impact: The process is expected to fail because the GPU requires reset or node recovery.
      action: Your remediation system should first attempt nvidia-smi --gpu-reset on the affected GPU (no other process may
        be using it). If the job still fails on this node, contact your cluster administrator or cloud provider. Include the
        NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).
      support_details: Include rank/node mapping, CUDA log excerpt, job ID, and whether the failure is node-sticky.
  recommended_action:
    operational_state: drain
    remediation_actions:
    - reset_gpu
    - service_required
  technical_details: 'XID 48 is logged when the GPU detects an uncorrectable memory error. It is commonly associated with
    double-bit ECC failures and may be followed by row remapping events.

    '
  severity: critical
  summary: An uncorrectable GPU memory (double-bit ECC) error was detected; the affected GPU usually requires reset or node
    recovery.
  signals:
  - kind: xid
    pattern: XID 48
    note: kernel log / nvidia-smi
  - kind: log
    pattern: cudaErrorECCUncorrectable
    note: CUDA runtime
  - kind: log
    pattern: '[Dd]ouble[- ]?[Bb]it ECC'
    note: driver or BMC log
  related:
  - xid-94-95
  - xid-79
  references:
  - title: NVIDIA XID error reference
    url: https://docs.nvidia.com/deploy/xid-errors/
  verification: verified
  last_reviewed: 2026-04-24
- id: xid-94-95
  title: XID 94 / XID 95
  aliases:
  - XID 94
  - XID 95
  - cudaErrorContained
  - contained ECC
  - uncontained ECC
  category: gpu
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: Contained or uncontained GPU ECC error
      summary: XID 94 indicates a contained GPU error; XID 95 indicates an uncontained error that can affect more than one
        application.
      impact: XID 94 requires an application restart. XID 95 requires a reset of the affected GPU before any application
        can restart.
      action: For XID 95, attempt nvidia-smi --gpu-reset on the affected GPU (no other process may be using it). For XID 94,
        restart the affected application. If the job still fails on this node after the restart, contact your cluster administrator
        or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).
      support_details: Include XID type, rank/node mapping, job ID, and adjacent CUDA/NCCL errors.
  technical_details: XID 94 and XID 95 occur on GPUs with error containment. XID 94 is contained to one application; restart
    that application and reset the GPU when convenient. XID 95 is uncontained; reset the affected GPU before applications
    restart.
  severity: high
  summary: For a contained GPU memory error (XID 94), restart the application. For an uncontained error (XID 95), reset
    the GPU before applications restart.
  signals:
  - kind: xid
    pattern: XID 94
    note: contained ECC
  - kind: xid
    pattern: XID 95
    note: uncontained ECC
  - kind: log
    pattern: cudaErrorContained
    note: CUDA runtime
  related:
  - xid-48
  - xid-79
  references:
  - title: NVIDIA XID error reference
    url: https://docs.nvidia.com/deploy/xid-errors/
  verification: verified
  last_reviewed: 2026-04-24
- id: xid-79
  title: XID 79
  aliases:
  - GPU has fallen off the bus
  - gpu is lost reported by slurm
  category: gpu
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: GPU disappeared from the node
      summary: The driver could not access the GPU over its bus connection.
      impact: Distributed jobs usually fail after one rank loses its GPU.
      action: Your remediation system should first attempt nvidia-smi --gpu-reset on the affected GPU (no other process may
        be using it). If the job still fails on this node, contact your cluster administrator or cloud provider. Include the
        NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).
      support_details: Include rank/node mapping and any preceding XID, PCIe, or Slurm messages.
  recommended_action:
    operational_state: drain
    remediation_actions:
    - reset_gpu
    - service_required
  technical_details: 'XID 79 indicates the GPU was no longer accessible over its PCIe connection. It is often caused by hardware,
    PCIe link, power, or driver issues.

    '
  severity: critical
  summary: The GPU driver lost PCIe access to a GPU; the affected node usually requires drain and hardware/driver recovery.
  signals:
  - kind: xid
    pattern: XID 79
    note: kernel log
  - kind: log
    pattern: GPU has fallen off the bus
    note: dmesg / nvidia-smi
  - kind: log
    pattern: GPU is lost
    note: Slurm or NHC report
  related:
  - xid-48
  - xid-94-95
  references:
  - title: NVIDIA XID error reference
    url: https://docs.nvidia.com/deploy/xid-errors/
  verification: verified
  last_reviewed: 2026-04-24
- id: ib-error-12
  title: IB Error-12
  aliases:
  - IBV_WC_RETRY_EXC_ERR
  - IB Error-12 Vendor-129
  - NCCL port retry exceeded
  - Irrecoverable NET/IB communicator error
  - Irrecoverable receive communicator error
  - Irrecoverable send communicator error
  category: distributed_comm
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: RDMA transport retry exceeded
      summary: One node could not receive acknowledgements from another node within RDMA retry limits.
      impact: NCCL or distributed collectives may surface this as a remote/system error.
      action: Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict,
        symptom chain, and source logs).
      support_details: Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs), plus NCCL logs,
        rank-to-node mapping, peer IPs, localGid, remoteGid, HCA name, and job size.
  recommended_action:
    operational_state: drain
    remediation_actions:
    - service_required
  technical_details: 'IB Error-12 maps to IBV_WC_RETRY_EXC_ERR. It occurs when the sender cannot receive acknowledgement
    from the receiver before retries are exhausted. NCCL may surface the same condition as an irrecoverable NET/IB communicator
    error with status IBV_WC_RETRY_EXC_ERR(12) or numeric status 12, a peer IP and port, vendor_err, localGid, remoteGid,
    qpn, and HCA name. When both GIDs are IPv4-mapped, NVIDIA Attribution can attach device IPs for both sides of the failing
    pair; otherwise it records the local and peer nodes.

    '
  severity: high
  summary: An RDMA sender exhausted retries without acknowledgement; usually points to fabric, peer node, or link instability
    rather than the sender.
  signals:
  - kind: log
    pattern: IBV_WC_RETRY_EXC_ERR
    note: NCCL or libibverbs
  - kind: log
    pattern: IB Error[ -]12
    note: NCCL warning
  - kind: log
    pattern: Vendor[ -]?129
    note: vendor-specific completion
  - kind: log
    pattern: Irrecoverable (?:send|receive) communicator error.*status[= ].*IBV_WC_RETRY_EXC_ERR\(12\)
    note: NCCL NET/IB communicator warning
  - kind: log
    pattern: Irrecoverable (?:send|receive) communicator error.*status[= ](?:IBV_WC_RETRY_EXC_ERR\(12\)|\b12\b).*vendor[
      _]err[ =]0\b
    note: NCCL NET/IB communicator warning with numeric status and no vendor syndrome
  - kind: log
    pattern: 'Irrecoverable (?:send|receive) communicator error.*localGid[: ].*remoteGid[: ].*hca[= ]'
    note: peer-pair metadata from NCCL NET/IB
  related:
  - rdma-fabric-flap
  - pytorch-nccl-watchdog
  references:
  - title: NCCL troubleshooting guide
    url: https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/troubleshooting.html
  verification: verified
  last_reviewed: 2026-04-24
- id: pytorch-nccl-watchdog
  title: PyTorch NCCL watchdog
  aliases:
  - Cancelled by PyTorch NCCL watchdog
  - NCCL watchdog timeout
  category: distributed_comm
  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: PyTorch NCCL watchdog
      summary: PyTorch's NCCL watchdog reported a communication failure or stalled progress; inspect the full message and
        earlier errors across ranks.
      impact: The affected operation may fail or prevent other ranks from progressing; check completion and output separately.
      action: |-
        1. First identify whether the full message reports a collective timeout, a CUDA/NCCL exception, or missing watchdog heartbeat. Find the earliest error across available rank logs and compare collective order, tensor shapes, rank counts and progress. Correct a demonstrated application/input issue before retrying.

        2. Keep the framework's error handling enabled; do not simply extend timeouts or continue computations after a failed collective whose outputs may be invalid. Use guidance for the installed framework, runtime and communication-library versions, and change only job/application settings you control.

        3. After a confirmed correction, run one small safe fresh-job test and verify all participating ranks complete the affected step with valid results.

        4. If it fails again, the cause is unclear, or changes need permissions you lack, stop and contact the person or team responsible for your application; ask your cluster administrator or cloud provider for restricted host, network or shared-service investigation. Do not repeatedly run the full job or change host services to suppress the error.

        5. If normal logs are insufficient and you can safely reproduce in a small job, use additional logging supported by your installed PyTorch/NCCL versions. For NCCL, `NCCL_DEBUG=INFO` with supported `NCCL_DEBUG_SUBSYS=INIT,NET,COLL` can help; do not change shared service settings or expose credentials in the report. Restore normal logging afterward. Missing logs from some ranks do not prevent asking the application team or provider for help.
      support_details: When asking for help, include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs)
        when available, job ID and failure time, installed PyTorch/CUDA/NCCL versions, the full watchdog message, and the earliest
        errors in rank logs available to you. Include collective order and tensor shapes if logged, configured timeouts, rank-to-node
        mapping, last progress timestamps, and the correction and small-test result. State which rank logs or diagnostics are unavailable;
        ask the provider to collect restricted host or network evidence. Remove credentials and private input data before sharing.
        When asking for help, send the evidence available to you and say what is missing; do not delay the request because a diagnostic
        report or restricted logs are unavailable.
  technical_details: The watchdog can surface a CUDA/NCCL exception, a collective timeout, or a separate watchdog-heartbeat
    failure. The watchdog label alone does not establish which occurred, and none by itself proves a fabric or GPU fault.
  severity: medium
  summary: PyTorch's NCCL watchdog reported a communication failure or stalled progress; inspect the full message and earlier
    errors across ranks.
  signals:
  - kind: log
    pattern: Cancelled by PyTorch NCCL watchdog
    note: PyTorch launcher
  - kind: log
    pattern: NCCL.*[Ww]atchdog
    note: NCCL timeout or watchdog warning
  - kind: log
    pattern: ProcessGroupNCCL.*timed out
    note: torch.distributed
  related:
  - rdma-fabric-flap
  - ib-error-12
  - xid-79
  references:
  - title: PyTorch distributed communication
    url: https://pytorch.org/docs/stable/distributed.html
  - title: NCCL return codes and data types
    url: https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/api/types.html
  - title: PyTorch NCCL watchdog implementation
    url: https://github.com/pytorch/pytorch/blob/main/torch/csrc/distributed/c10d/ProcessGroupNCCL.cpp
  - title: NCCL diagnostic logging environment variables
    url: https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/env.html
  verification: draft
  last_reviewed: 2026-04-24
- id: rdma-fabric-flap
  title: RDMA fabric flap
  aliases:
  - fatal_link_flap
  - port error
  - NCCL NET/IB async event
  category: distributed_comm
  likely_owner: infrastructure
  personas:
    tenant_sre:
      title: RDMA or NCCL fabric link flap
      summary: NCCL observed an unrecoverable link or port error from the RDMA device.
      impact: Collectives can fail even if the application code is correct.
      action: Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom
        chain, and source logs).
      support_details: Include NCCL WARN lines, HCA/port, rank-to-node mapping, and NVIDIA Attribution symptoms.
  recommended_action:
    operational_state: drain
    remediation_actions:
    - service_required
  technical_details: NVIDIA Attribution observes RDMA fabric flaps from application logs or fabric telemetry, often through
    NCCL NET/IB async port errors.
  severity: high
  summary: NCCL or RDMA observed an unrecoverable link or port event from the fabric; multi-node jobs along the affected path
    may fail.
  signals:
  - kind: log
    pattern: fatal_link_flap
    note: fabric telemetry
  - kind: log
    pattern: NET/IB.*async.*port
    note: NCCL warning
  - kind: log
    pattern: port (error|down)
    note: HCA or switch event
  related:
  - ib-error-12
  - pytorch-nccl-watchdog
  - lustre-client-evicted
  references:
  - title: NCCL troubleshooting guide
    url: https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/troubleshooting.html
  verification: verified
  last_reviewed: 2026-04-24
- id: cancelled-by-timeout
  title: Cancelled by Timeout
  aliases:
  - wall time exceeded
  - time limit
  category: scheduler
  likely_owner: user
  personas:
    tenant_sre:
      title: Scheduler wall-time timeout
      summary: The batch allocation expired before the workload completed.
      impact: Checkpointing and resume behavior determine how much progress was lost.
      action: |-
        1. Check the scheduler's recorded termination reason and time limit if you can access them; distinguish a scheduler wall-time limit from an application or distributed-operation timeout. Compare the recorded runtime with your requested time limit, then check your outputs and latest usable checkpoint.

        2. If work remains, adjust your own job's requested time within the permitted partition limits, or use your application's supported checkpoint-and-resume procedure. Confirm that the resumed job progresses beyond the previous stopping point and produces the expected outputs before its time limit.

        3. If changing runtime or checkpoint behavior requires code you do not control, contact the person or team responsible for your application. If the required time exceeds your allocation limits, or the recorded limit does not match your request, contact your cluster administrator or cloud provider. Do not change shared scheduler limits or repeatedly resubmit the unchanged job.

        4. If enforced limits or accounting are unavailable, ask your cluster administrator or cloud provider to confirm them rather than guessing.
      support_details: Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs) when available. Add the
        job and step IDs, submission script, requested and recorded time limits, start and end times, last progress log, checkpoint
        status, and the result of any resumed run. Share only records available to you and remove secrets. Ask your cluster administrator
        or cloud provider to check scheduler accounting and enforced limits if those records are unavailable to you. When asking
        for help, send the evidence available to you and say what is missing; do not delay the request because a diagnostic report
        or restricted logs are unavailable.
  technical_details: 'A Slurm TIMEOUT records enforcement of a time limit. It is not by itself evidence of an application
    defect or infrastructure fault. Progress and usable checkpoints determine whether work can safely resume.

    '
  severity: low
  summary: The scheduler stopped the job at its configured time limit; this does not identify why the workload needed longer.
  signals:
  - kind: log
    pattern: DUE TO TIME LIMIT
    note: Slurm
  - kind: log
    pattern: TIMEOUT
    note: Slurm job state
  - kind: log
    pattern: wall(-| )?time
    note: scheduler accounting
  related:
  - cancelled-by-user
  - slurm-preempted
  references:
  - title: Slurm batch submission and time limits
    url: https://slurm.schedmd.com/sbatch.html
  - title: Slurm job accounting
    url: https://slurm.schedmd.com/sacct.html
  verification: draft
  last_reviewed: 2026-04-24
- id: cancelled-by-user
  title: Cancelled by user
  aliases:
  - scancel
  - user cancellation
  category: scheduler
  likely_owner: user
  personas:
    tenant_sre:
      title: Job cancellation recorded
      summary: The scheduler recorded cancellation, but the state alone does not identify the person, service, or reason.
      impact: The job stops; whether any recovery is needed depends on the reason for cancellation.
      action: |-
        1. Check the cancellation details and job logs available to you. If you intentionally cancelled the job and no further work is required, this is an expected outcome. No corrective action is required for this symptom.

        2. For an unexpected cancellation, ask the person or team responsible for your application about its launchers or watchdogs, and contact your cluster administrator or cloud provider if the sender or policy is unknown; do not repeatedly resubmit until the reason is understood.

        3. If you are authorized to resume, use the installed application's supported checkpoint procedure and confirm progress after one restart.
      support_details: When asking for help, include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs)
        when available, plus job and step IDs, cancellation time, displayed cancellation actor if available, exit signal, last application
        messages, checkpoint state, and whether cancellation was intended. Share only evidence you can access; redact credentials
        and private application data. When asking for help, send the evidence available to you and say what is missing; do not delay
        the request because a diagnostic report or restricted logs are unavailable.
  technical_details: 'Cancellation can be requested by a user, administrator, or automation acting with permission. Missing
    cancellation metadata does not prove a crash, and an account name alone does not prove a manual action.

    '
  severity: low
  summary: The scheduler recorded cancellation, but the state alone does not identify the person, service, or reason.
  signals:
  - kind: log
    pattern: CANCELLED
    note: Slurm job state
  - kind: log
    pattern: scancel
    note: scheduler action
  - kind: log
    pattern: cancelled_by
    note: scheduler metadata
  related:
  - cancelled-by-timeout
  - slurm-preempted
  references:
  - title: Slurm cancellation and signals
    url: https://slurm.schedmd.com/scancel.html
  - title: Slurm job states
    url: https://slurm.schedmd.com/job_state_codes.html
  verification: draft
  last_reviewed: 2026-04-24
- id: slurm-preempted
  title: slurm-preempted
  aliases:
  - PREEMPTED
  - requeue
  category: scheduler
  likely_owner: scheduler_policy
  personas:
    tenant_sre:
      title: Scheduler preemption interrupted the job
      summary: The scheduler interrupted the allocation under its configured preemption policy.
      impact: Work is interrupted, suspended, or requeued according to the configured policy.
      action: |-
        1. Check whether the job was suspended, requeued, or terminated before submitting another copy. If you control the workload, use its supported checkpoint/resume procedure for the installed version and a partition or QoS your account is permitted to use.

        2. Confirm that the resumed attempt progresses without duplicating the original job; if repeated preemption prevents progress or the policy is unclear, stop resubmitting and contact your cluster administrator or cloud provider. Ask the person or team responsible for your application if checkpoint recovery is unavailable or cannot be changed.
      support_details: When asking for help, include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs)
        when available, plus job state history, partition/QoS, requeue status, checkpoint timestamp, attempt IDs, and observed progress
        after resume. Share only evidence you can access; redact credentials and private application data. When asking for help,
        send the evidence available to you and say what is missing; do not delay the request because a diagnostic report or restricted
        logs are unavailable.
  technical_details: 'The response to Slurm preemption depends on configured PreemptMode and the job. A preemption marker
    alone is not evidence that a node failed, and a requeued job need not resume application state automatically.

    '
  severity: low
  summary: The scheduler interrupted the allocation under its configured preemption policy.
  signals:
  - kind: log
    pattern: PREEMPTED
    note: Slurm job state
  - kind: log
    pattern: requeue
    note: scheduler action
  related:
  - cancelled-by-timeout
  - cancelled-by-user
  references:
  - title: Slurm preemption
    url: https://slurm.schedmd.com/preempt.html
  - title: Slurm queue inspection
    url: https://slurm.schedmd.com/squeue.html
  verification: draft
  last_reviewed: 2026-04-24
- id: pyxis-cannot-find-container-file
  title: 'pyxis: cannot find container file'
  aliases:
  - container file missing
  - enroot image missing
  category: container
  likely_owner: user
  personas:
    tenant_sre:
      title: Requested container image is inaccessible
      summary: Pyxis could not locate or read the image selected for the job.
      impact: The selected container cannot be started until its image is accessible.
      action: |-
        1. If you control the job configuration, check the image reference, path visibility, and read permission from the allocated job environment using the options supported by the installed Pyxis version. Correct an owned path or select an authorized, known-good image, then retry once and confirm the intended image and startup command run.

        2. If it still fails or you cannot change the image, contact the person or team responsible for your application; ask your cluster administrator or cloud provider when a shared mount or permission requires their access. Do not change shared permissions or replace a shared image.
      support_details: When asking for help, include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs)
        when available, plus job ID, image reference or digest, relevant container arguments, exact path/access error, affected
        nodes, installed runtime versions, and retry result. Share only evidence you can access; redact credentials and private
        application data. When asking for help, send the evidence available to you and say what is missing; do not delay the request
        because a diagnostic report or restricted logs are unavailable.
  technical_details: 'An inaccessible image can reflect a wrong path, missing file, permissions, or storage visibility. The
    startup error alone does not establish which of these caused the failure.

    '
  severity: medium
  summary: Pyxis could not locate or read the image selected for the job.
  signals:
  - kind: log
    pattern: cannot find container file
    note: Pyxis startup
  - kind: log
    pattern: enroot.*ENOENT
    note: enroot runtime
  - kind: log
    pattern: image (missing|not found)
    note: container manager
  related:
  - pyxis-couldnt-start-container
  references:
  - title: NVIDIA Pyxis container options
    url: https://github.com/NVIDIA/pyxis
  - title: NVIDIA Enroot usage
    url: https://github.com/NVIDIA/enroot/blob/main/doc/usage.md
  verification: draft
  last_reviewed: 2026-04-24
- id: pyxis-couldnt-start-container
  title: Pyxis could not start container
  aliases:
  - container startup failed
  - enroot start failed
  category: container
  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: Container startup failed
      summary: Pyxis or Enroot failed to start the requested container; the preceding error identifies the next check.
      impact: The requested containerized process does not start successfully.
      action: |-
        1. Read the preceding startup message and check the image entrypoint, command, and mounts you control against the installed Pyxis/Enroot options. If permitted, correct that specific mismatch and run a small startup check once within an allocation; confirm the intended executable starts.

        2. If startup still fails or you cannot modify the image, contact the person or team responsible for your application; send plugin, shared hook, or restricted host-runtime failures to your cluster administrator or cloud provider. Do not disable site hooks or modify shared runtime configuration.
      support_details: When asking for help, include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs)
        when available, plus image digest, startup command, container mount arguments, first startup error, job/node IDs, Pyxis/Enroot
        versions, and the small-check result. Share only evidence you can access; redact credentials and private application data.
        When asking for help, send the evidence available to you and say what is missing; do not delay the request because a diagnostic
        report or restricted logs are unavailable.
  technical_details: 'Container startup can fail because of an image command, requested mount, runtime hook, or host configuration.
    The generic message does not establish that all image preparation steps succeeded or diagnose a node fault.

    '
  severity: medium
  summary: Pyxis or Enroot failed to start the requested container; the preceding error identifies the next check.
  signals:
  - kind: log
    pattern: couldn't start container
    note: Pyxis startup
  - kind: log
    pattern: enroot start failed
    note: enroot runtime
  - kind: log
    pattern: container startup failed
    note: generic
  related:
  - pyxis-cannot-find-container-file
  references:
  - title: NVIDIA Pyxis container options
    url: https://github.com/NVIDIA/pyxis
  - title: NVIDIA Enroot usage
    url: https://github.com/NVIDIA/enroot/blob/main/doc/usage.md
  verification: draft
  last_reviewed: 2026-04-24
- id: dataloader-exception
  title: DataLoader Exception
  aliases:
  - DataLoader worker
  - DatasetGenerationError
  category: application
  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: Data loading worker failed
      summary: A data-loading exception prevented the workload from obtaining its next input batch.
      impact: The workload cannot obtain the expected input batch and may abort.
      action: |-
        1. Read the original worker traceback and identify the failing sample or input operation. If you control the loader, use the installed framework's supported diagnostic settings; for PyTorch, a small test with `num_workers=0` can expose a clearer traceback, but is not itself a fix.

        2. Correct only a confirmed input or loader problem, test the affected batch once, then confirm loading works with the intended worker configuration. If the cause persists or you cannot change the loader, contact the person or team responsible for your application; send inaccessible shared-storage or network investigation to your cluster administrator or cloud provider.
      support_details: When asking for help, include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs)
        when available, plus original worker traceback, sample or dataset identifier without private data, failing operation, worker
        settings, framework version, rank/node IDs, associated storage errors, and diagnostic-test result. Share only evidence you
        can access; redact credentials and private application data. When asking for help, send the evidence available to you and
        say what is missing; do not delay the request because a diagnostic report or restricted logs are unavailable.
  technical_details: 'A DataLoader or dataset-generation exception can arise from input data, transforms, worker execution,
    or the storage operation supplying data. A nearby storage symptom is useful evidence, not an automatic diagnosis for every
    worker failure.

    '
  severity: medium
