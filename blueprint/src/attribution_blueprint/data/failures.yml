- id: exit-code-signal-15
  title: Exit code signal 15
  aliases:
  - SIGTERM
  - signal 15
  - exit 0:15
  - terminated
  category: scheduler
  likely_owner: ambiguous
  related_readme_anchor: exit-code-signal-15
  personas:
    tenant_sre:
      title: Process killed with SIGTERM
      summary: The job step received SIGTERM (signal 15), the standard polite-termination signal sent by scancel and time-limit enforcement.
      impact: Application work stops at the next non-blocking point; if no SIGTERM handler is registered, the process exits without flushing checkpoints.
      action: 'Check sacct cancelled_by - if it is your own user account you ran scancel; otherwise contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs). Consider installing a SIGTERM handler that flushes checkpoints.'
      support_details: Provide job ID, sacct line showing ExitCode=0:15 and State, the cancelled_by value, your scancel history, and the last checkpoint timestamp.
    cloud_operator:
      title: Slurmstepd delivered SIGTERM to the step
      summary: Slurm's default termination sequence sends SIGTERM, waits KillWait seconds, then escalates to SIGKILL; ExitCode=0:15 means the step exited inside that grace window.
      impact: Identifies that termination was orderly and from Slurm-internal tooling, not a kernel kill; the cancelling principal still has to be confirmed before attribution closes.
      action: Cross-reference the slurmctld log for the scancel RPC (uid, hostname), check whether timeout enforcement or preemption fired, and verify cancelled_by uid against the site automation service-account map.
      support_details: Provide slurmctld scancel log line including uid and host, KillWait value, partition QoS, sacct DerivedExitCode, and any site automation audit entry within the same minute.
  technical_details: |
    Signal 15 is SIGTERM. sbatch and scancel use SIGTERM as the default termination signal before
    escalating to SIGKILL after KillWait seconds. Sources of SIGTERM observable as ExitCode=0:15
    include: user scancel without --signal, scheduler time-limit enforcement (TIMEOUT state),
    preemption with GraceTime, site automation, and any process on the node
    that explicitly sends signal 15 to the step PID. The signal number alone does not distinguish
    these; the slurmctld log and cancelled_by metadata do.
  severity: medium
  summary: The job step exited because slurmstepd or another actor delivered SIGTERM (signal 15); attribution requires identifying the cancelling actor from cancelled_by and slurmctld logs.
  signals:
  - kind: log
    pattern: 'ExitCode=0:15'
    note: sacct record
  - kind: log
    pattern: 'signal 15'
    note: launcher / step
  - kind: log
    pattern: 'SIGTERM'
    note: application or shell log
