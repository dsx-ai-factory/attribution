- id: system-out-of-memory
  title: System-out of memory
  aliases:
  - OOM
  - oom-killer
  - OOM killer invoked
  category: unknown
  likely_owner: application
  personas:
    tenant_sre:
      title: The OOM killer terminated your process
      summary: An out-of-memory event terminated a process, potentially at a workload memory limit rather than across the
        whole node.
      impact: The affected process stops; peer processes may fail or time out afterward.
      action: |-
        1. Check the job's host-memory request, memory limit, and available accounting against its observed memory use, using documentation for your installed scheduler and runtime; do not treat GPU memory as host RAM. Use accessible termination records to distinguish a workload memory-limit kill from node-wide memory pressure; exit code 137 alone does not prove either cause.

        2. On Slurm, inspect your job and step accounting, requested memory and any recorded out-of-memory state. `MaxRSS` is the maximum for one task in the reported step, not the combined memory of the whole job; compare measurements and limits at the same scope.

        3. On Kubernetes, if you can read your pod status, check the affected container's termination reason and memory limit. Missing accounting or permissions are reasons to ask for help, not to guess the cause.

        4. If you control the workload, reduce host-memory demand such as buffered input or worker count, or request more host memory within your allocation policy; otherwise contact the person or team responsible for your application.

        5. Retry once after the change and confirm the affected workload phase completes without another out-of-memory kill, while checking memory use within the job's limit.

        6. If the kill recurs, the limit is unknown, or further investigation requires host access, stop repeated runs and contact your cluster administrator or cloud provider; do not change system memory limits, swap, or other tenants' processes.
      support_details: Provide the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs) when available, job/node
        identifiers and time, accessible kill or scheduler messages, requested memory and known limits, recorded peak resident memory,
        worker/input settings, installed scheduler/runtime versions, and retry result. Accounting may miss brief peaks. Include
        only logs you can access and remove credentials or private inputs; ask the provider to collect kernel OOM records and cgroup
        limits/events if those are restricted. When asking for help, send the evidence available to you and say what is missing;
        do not delay the request because a diagnostic report or restricted logs are unavailable.
  technical_details: Linux can invoke out-of-memory handling for system-wide pressure or an enforced memory-control-group
    limit. A killed process or SIGKILL alone does not prove that the whole node ran out of RAM. In cgroup v2, memory.events
    records OOM-related counters; interpreting the limit and event scope may require provider access.
