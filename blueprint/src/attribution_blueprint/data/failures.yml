- id: call-to-ibv-modify-qp-failed-eno-110-timeout-overwrite-nccl-parameters
  title: 'Call to ibv_modify_qp failed: errno 110 (ETIMEDOUT) - NCCL parameter override'
  aliases:
  - NCCL_IB_MQP_RETRY_ALL workaround
  - ibv_modify_qp ETIMEDOUT after NCCL retry tuning
  category: distributed_comm
  likely_owner: infrastructure
  related_readme_anchor: call-to-ibv-modify-qp-failed-eno-110-timeout-overwrite-nccl-parameters
  personas:
    tenant_sre:
      title: ETIMEDOUT persists after applying the NCCL modify-QP retry override
      summary: Even with `NCCL_IB_MQP_RETRY_ALL=1` set, `ibv_modify_qp` still returns ETIMEDOUT, which means the underlying fabric problem is not transient.
      impact: The job cannot make progress on this node set; rerunning blindly will keep hitting the same nodes and waste GPU hours.
      action: 'Stop retrying with the same NCCL flags; capture the failing peer pair and hand off to your cluster administrator or cloud provider for fabric remediation, then resubmit on a clean partition.'
      support_details: NCCL log showing the override is set, the failing source/destination ranks, and the runtime NCCL version.
    cloud_operator:
      title: Persistent fabric fault despite NCCL kernel retries
      summary: '`NCCL_IB_MQP_RETRY_ALL=1` causes NCCL to retry the verb call across all attribute-mask groups, but the modify keeps timing out, so the fault is at the HCA, switch, or EAP layer - not in
        NCCL.'
      impact: A subset of nodes is producing repeat ETIMEDOUTs; leaving them in the schedulable pool will keep failing future jobs.
      action: Identify the implicated nodes from the warning history, drain them, run port-level diagnostics (`ibstat`, `ethtool`, switch port counters, EAP session table) and remediate before returning
        them to service; raise a CSP ticket if access-port re-auth is the root cause.
      support_details: List of failing nodes/peers, drain ticket, switch and UFM telemetry around the failure window, and CSP case reference if applicable.
  technical_details: '`NCCL_IB_MQP_RETRY_ALL=1` is a NCCL runtime override that retries

    `ibv_modify_qp` across every attribute-mask grouping when a

    transient kernel-level error is reported. It papers over short

    fabric blips but cannot mask a sustained ETIMEDOUT. When the

    override is set and ETIMEDOUT is still observed, the cause is

    not retryable from user space - the path is genuinely broken

    (link flap, EAP de-auth, dead remote QP) and the only release-

    grade remediation is to drain the node and clear the underlying

    fault.

    '
  summary: ibv_modify_qp keeps returning ETIMEDOUT even with NCCL_IB_MQP_RETRY_ALL=1, indicating a sustained fabric fault rather than a transient drop.
  signals:
  - kind: log
    pattern: NCCL_IB_MQP_RETRY_ALL=1
    note: Confirms the override was active during the failed run.
  - kind: log
    pattern: NCCL WARN Call to ibv_modify_qp failed.*110
    note: Errno-110 warning that survived the retry override.
  - kind: metric
    pattern: switchport.*deauthorized|link flap
    note: Persistent port event on the implicated switch interface.
