    cloud_operator:
      title: LustreError in dmesg - decode the suffix and triage by target
      summary: Kernel `LustreError:` line surfaced from the Lustre client. The actionable signal is the suffix - eviction, bulk RPC timeout (-110), peer not found (-113), or stale handle (-116) - each routes differently.
      impact: Per-mount on the client at minimum. Cluster-wide if the same OSS/MDS is the source - check whether other nodes log the same target NID at the same timestamp.
