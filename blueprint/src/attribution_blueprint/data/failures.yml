    The east-west fabric carries RDMA collectives between GPU nodes. A link-down event is reported by the IB/Ethernet driver and by UFM/switch telemetry. Until the link retrains, the affected NIC port cannot move data; multi-port topologies fall back to surviving rails at reduced bandwidth.
