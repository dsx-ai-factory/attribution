  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: DataLoader worker or dataset generation failure
      summary: A data loading worker failed. The root cause may be application data, storage, or network filesystem behavior.
      impact: The main process usually aborts after a worker exception.
      action: Inspect the worker traceback and correlate with Lustre/NFS/S3 symptoms.
      support_details: Include full traceback, dataset path, worker ID, and storage symptoms.
  technical_details: NVIDIA Attribution maps several application log patterns to DataLoader Exception. LustreError may override
    this symptom when storage evidence is present.
  severity: medium
  summary: A PyTorch DataLoader worker failed; the root cause may be application data, storage backend, or network filesystem
    behavior.
  signals:
  - kind: log
    pattern: DataLoader worker
    note: PyTorch traceback
  - kind: log
    pattern: DatasetGenerationError
    note: HuggingFace datasets
  - kind: log
    pattern: Worker .* exited
    note: PyTorch DataLoader
  related:
  - lustre-client-evicted
  - python-exception
  references:
  - title: PyTorch DataLoader documentation
    url: https://pytorch.org/docs/stable/data.html
