      title: Verbs work completion succeeded (not a failure)
      summary: This is the success status returned by ibv_poll_cq when a Work Request finishes cleanly. If a job-failure tool surfaces this code, treat it as a detection-rule false positive, not a workload problem.
      impact: No job impact. Surface only in audits or when investigating why a healthy completion was flagged.
      action: Confirm the surrounding context shows no real error. If a tool flagged this, file a detection-rule bug rather than retrying or escalating.
      support_details: Job ID, the matched log line, and the surrounding lines so the tooling owner can fix the rule.
