- id: ibv-wc-loc-eec-op-err
  title: IBV_WC_LOC_EEC_OP_ERR
  aliases:
    - Local EE Context Operation Error
    - WC LOC EEC OP ERR
    - IB Error 3
  category: distributed_comm
  likely_owner: ambiguous
  related_readme_anchor: ibv-wc-loc-eec-op-err
  personas:
    tenant_sre:
      title: Verbs local EE Context operation error (RD transport)
      summary: A Reliable Datagram End-to-End Context hit an internal error executing a request packet. This applies only to the RD transport, which is rare in modern NCCL/MPI stacks.
      impact: The failing RD QP fails; if the workload is not actually using RD, this is suspicious and likely a misidentified status.
      action: 'Confirm whether the workload uses Reliable Datagram (it usually does not). Capture the WC line and stack. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs). If RD is not in use, treat as a verbs/driver anomaly rather than an app bug.'
      support_details: NCCL/MPI logs, transport type configured (RC/UC/UD/RD), rank/node mapping, and the IBV_WC_LOC_EEC_OP_ERR line.
    cloud_operator:
      title: IBV_WC_LOC_EEC_OP_ERR - local EEC consistency error on RD
      summary: Local End-to-End Context for Reliable Datagram detected an internal consistency error while processing a request. RD support is largely absent on modern HCAs, so this typically indicates a driver or firmware path error.
      impact: Per-EEC, but observing this on hardware that does not implement RD points to a driver/firmware bug or a misclassified vendor error.
      action: Check ibv_devinfo for RD capability, capture mlx5_core dmesg, file a vendor case with the full WC dump (vendor_err is the key field) and firmware version. Do not drain the node on a single occurrence unless other fabric symptoms accompany it.
      support_details: HCA model, firmware, ibv_devinfo output, full WC dump including vendor_err, mlx5_core kernel log around the failure timestamp.
  technical_details: |
    IBV_WC_LOC_EEC_OP_ERR (status 3) indicates an internal consistency error in the local End-to-End Context for the Reliable Datagram transport. RD is a legacy transport and is not implemented on most current HCAs, so this status is almost never seen on production NCCL/MPI workloads.
  summary: Local EEC reported an RD-transport consistency error; verify whether RD is actually in use and treat occurrences as driver or firmware anomalies otherwise.
  signals:
