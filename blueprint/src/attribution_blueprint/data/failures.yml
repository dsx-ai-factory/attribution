- id: call-to-ibv-modify-qp-failed
  title: Call to ibv_modify_qp failed
  aliases:
  - ibv_modify_qp returned non-zero
  - NCCL WARN Call to ibv_modify_qp failed
  category: distributed_comm
  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: NCCL aborted because ibv_modify_qp returned an error
      summary: NCCL tried to drive a QP through the RESET -> INIT -> RTR -> RTS state machine and the kernel rejected one
        of the transitions.
      impact: The communicator cannot be initialized on this rank; all collectives that touch this QP fail and the job aborts.
      action: Capture the errno reported in the warning - EINVAL (22) usually means a forced GID index is wrong, ETIMEDOUT
        (110) means the peer or fabric is unreachable; unset NCCL_IB_GID_INDEX (or set it to -1) and retry on a different
        node.
      support_details: NCCL warning line with the errno, the peer rank, NCCL_IB_GID_INDEX/NCCL_IB_HCA values, output of `show_gids`,
        and the local node hostname.
  technical_details: '`ibv_modify_qp(3)` walks a QP through the IBV_QPS_RESET ->

    IBV_QPS_INIT -> IBV_QPS_RTR -> IBV_QPS_RTS state machine. The

    function returns the errno value directly (not via `errno`). The

    two values seen in production NCCL traces are EINVAL (22) and

    ETIMEDOUT (110); the warning text alone is ambiguous, so the

    errno must be read from the NCCL or strace output before any

    remediation. EINVAL almost always means an invalid attribute -

    most often a forced RoCE GID index that does not exist on the

    local NIC. ETIMEDOUT means the kernel command timed out, which on

    RoCE indicates the peer is unreachable (link flap, EAP de-auth,

    or congested fabric).

    '
  summary: ibv_modify_qp returned a non-zero errno during a NCCL QP state transition; the specific errno determines root cause.
  signals:
  - kind: log
    pattern: NCCL WARN Call to ibv_modify_qp failed
    note: NCCL `ibvwrap.cc` warning; companion log line carries the errno string.
  - kind: log
    pattern: ibv_modify_qp.*Invalid argument
    note: errno=22 (EINVAL); most often a GID-index/RoCE-type mismatch.
  - kind: log
    pattern: ibv_modify_qp.*Connection timed out
    note: errno=110 (ETIMEDOUT); peer unreachable or fabric/EAP issue.
  related:
  - call-to-ibv-modify-qp-failed-eno-22-invalid-argument
  - call-to-ibv-modify-qp-failed-eno-110-timeout
  - eap-authentication-failed
