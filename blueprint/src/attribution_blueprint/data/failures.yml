- id: cancelled-by-pytorch-nccl-watchdog
  title: Cancelled by PyTorch NCCL watchdog
  aliases:
  - PyTorch NCCL watchdog cancellation
  - ProcessGroupNCCL timed out
  - Watchdog caught collective operation timeout
  category: distributed_comm
  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: Cancelled by PyTorch NCCL watchdog
      summary: PyTorch's NCCL watchdog reported a communication failure or stalled progress; inspect the full message and
        earlier errors across ranks.
      impact: The affected operation may fail or prevent other ranks from progressing; check completion and output separately.
      action: |-
        1. First identify whether the full message reports a collective timeout, a CUDA/NCCL exception, or missing watchdog heartbeat. Find the earliest error across available rank logs and compare collective order, tensor shapes, rank counts and progress. Correct a demonstrated application/input issue before retrying.

        2. Keep the framework's error handling enabled; do not simply extend timeouts or continue computations after a failed collective whose outputs may be invalid. Use guidance for the installed framework, runtime and communication-library versions, and change only job/application settings you control.

        3. After a confirmed correction, run one small safe fresh-job test and verify all participating ranks complete the affected step with valid results.

        4. If it fails again, the cause is unclear, or changes need permissions you lack, stop and contact the person or team responsible for your application; ask your cluster administrator or cloud provider for restricted host, network or shared-service investigation. Do not repeatedly run the full job or change host services to suppress the error.

        5. If normal logs are insufficient and you can safely reproduce in a small job, use additional logging supported by your installed PyTorch/NCCL versions. For NCCL, `NCCL_DEBUG=INFO` with supported `NCCL_DEBUG_SUBSYS=INIT,NET,COLL` can help; do not change shared service settings or expose credentials in the report. Restore normal logging afterward. Missing logs from some ranks do not prevent asking the application team or provider for help.
      support_details: When asking for help, include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs)
        when available, job ID and failure time, installed PyTorch/CUDA/NCCL versions, the full watchdog message, and the earliest
        errors in rank logs available to you. Include collective order and tensor shapes if logged, configured timeouts, rank-to-node
        mapping, last progress timestamps, and the correction and small-test result. State which rank logs or diagnostics are unavailable;
        ask the provider to collect restricted host or network evidence. Remove credentials and private input data before sharing.
        When asking for help, send the evidence available to you and say what is missing; do not delay the request because a diagnostic
        report or restricted logs are unavailable.
  technical_details: The watchdog can surface a CUDA/NCCL exception, a collective timeout, or a separate watchdog-heartbeat
    failure. The watchdog label alone does not establish which occurred, and none by itself proves a fabric or GPU fault.
  summary: PyTorch's NCCL watchdog reported a communication failure or stalled progress; inspect the full message and earlier
    errors across ranks.
  signals:
  - kind: log
    pattern: Cancelled by PyTorch NCCL watchdog
    note: PyTorch launcher
  - kind: log
    pattern: ProcessGroupNCCL.*[Tt]imed out
    note: torch.distributed
  - kind: log
    pattern: Watchdog caught collective operation timeout
    note: ProcessGroupNCCL
  related:
  - pytorch-nccl-watchdog
  - dataloader-exception
  - python-exception
  references:
  - title: PyTorch distributed communication
    url: https://pytorch.org/docs/stable/distributed.html
  - title: NCCL return codes and data types
    url: https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/api/types.html
  - title: PyTorch NCCL watchdog implementation
    url: https://github.com/pytorch/pytorch/blob/main/torch/csrc/distributed/c10d/ProcessGroupNCCL.cpp
  - title: NCCL diagnostic logging environment variables
    url: https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/env.html
  severity: medium
  verification: draft
  last_reviewed: 2026-04-26
