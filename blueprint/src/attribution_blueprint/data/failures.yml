- id: rdma-cm-event-connect-error
  title: RDMA_CM_EVENT_CONNECT_ERROR
  aliases:
    - CM Event Connect Error
  category: distributed_comm
  likely_owner: ambiguous
  related_readme_anchor: rdma-cm-event-connect-error
  personas:
    tenant_sre:
      title: RDMA CM connection establishment failed
      summary: An error occurred while establishing the RDMA connection. The peer was reachable but the handshake (rdma_connect/rdma_accept) failed. NCCL/MPI startup typically aborts.
      impact: The affected rank fails before data movement starts; the collective never forms.
      action: 'Capture NCCL/MPI logs and identify both ranks. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: NCCL/MPI logs, rank/node mapping, peer rank/node, the RDMA_CM_EVENT_CONNECT_ERROR line, and any qp_attr settings used during connect.
    cloud_operator:
      title: RDMA_CM_EVENT_CONNECT_ERROR - handshake failure on connect
      summary: rdma_cm reported an error during connection establishment. Could be peer-side rejection logic, mismatched QP attributes, or transport-level failure mid-handshake.
      impact: Per-connection. Patterns across many ranks point to a configuration drift between endpoints.
      action: Pull mlx5_core dmesg from both ends, inspect ibstat for link issues, validate rdma_conn_param parity (responder_resources, initiator_depth, retry_count), and check the peer application's accept logic.
      support_details: Both endpoints' HCA model, firmware, mlx5_core kernel log, rdma_conn_param values, peer process status.
  technical_details: |
    RDMA_CM_EVENT_CONNECT_ERROR is generated on either side of a connection when an error occurs during establishment. It is distinct from RDMA_CM_EVENT_REJECTED (explicit peer rejection) and RDMA_CM_EVENT_UNREACHABLE (no peer response).
  summary: rdma_cm connection establishment failed; investigate handshake parameters, peer accept logic, and link state on both endpoints.
  signals:
    - kind: log
      pattern: 'RDMA_CM_EVENT_CONNECT_ERROR'
      note: rdma_cm event line
