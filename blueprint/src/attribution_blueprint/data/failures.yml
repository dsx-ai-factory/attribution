      title: CUDA runtime returned cudaErrorMemoryAllocation (2)
      summary: Runtime allocator could not honor the request; could be exhaustion (application), fragmentation, or upstream driver/MIG issue.
      impact: Per-process; the rank fails the allocation but the GPU may remain usable for other tenants.
      action: Cross-check nvidia-smi free memory, dcgmi dmon for GPU memory used, and dmesg for OOM or XID events. Drain or reset only if multiple jobs on the same node fail allocation while nvidia-smi
        shows ample free memory.
      support_details: Distinguish application leak from infrastructure by job-vs-node correlation; same-node-many-jobs implies hardware or driver suspect.
  technical_details: 'cudaErrorMemoryAllocation (value 2) is returned when a CUDA allocation API cannot allocate the requested memory or resources. It can result from application exhaustion, fragmentation
    of the device heap, MIG slice limits, or driver-side resource constraints.

    '
