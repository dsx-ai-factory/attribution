- id: network-address-cannot-be-retrieved
  title: network address cannot be retrieved
  aliases:
    - cannot get network address
    - getaddrinfo failed
  category: gpu
  likely_owner: infrastructure
  related_readme_anchor: network-address-cannot-be-retrieved
  personas:
    tenant_sre:
      title: Job could not resolve a network address
      summary: A rank failed to resolve its own or a peer's address during initialization, blocking process-group setup.
      impact: The collective never forms; the job exits during init before any training step runs.
      action: 'Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: Record the failing host, the env vars `MASTER_ADDR`, `NCCL_SOCKET_IFNAME`, `GLOO_SOCKET_IFNAME`, and the resolver error, then open a network ticket.
    cloud_operator:
      title: Address resolution failure on node
      summary: DNS, getaddrinfo, or interface enumeration failed on the node, indicating a misconfigured resolver, missing interface, or NS-network outage.
      impact: One or many nodes cannot bring up rendezvous; widespread occurrence suggests a DNS or DHCP outage rather than a per-node defect.
      action: Inspect `/etc/resolv.conf`, run `getent hosts`, `ip -4 addr`, and `dig` against the cluster resolver, check `systemd-resolved` and DHCP lease state, and validate the management-network NIC; only after host-network is healthy reattempt the job.
      support_details: Correlate with `ns-network-connection-lost` and Lustre/Prometheus drops to confirm whether this is a resolver bug or a broader north-south outage.
  technical_details: |
    Address resolution happens at job init and during socket-based control-plane traffic. A retrieval failure means either the resolver is unreachable, the requested record does not exist, or the host has lost its management-network interface; this is a control-plane failure that bypasses GPU hardware paths.
  summary: A node could not retrieve a network address, blocking job rendezvous and indicating DNS, DHCP, or NS-network problems.
  signals:
    - kind: log
      pattern: 'getaddrinfo .*Name or service not known'
      note: Standard libc resolver error.
    - kind: log
      pattern: 'Temporary failure in name resolution'
      note: Resolver reachability failure rather than missing record.
