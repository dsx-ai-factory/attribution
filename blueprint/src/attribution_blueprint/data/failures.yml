- id: ibv-event-srq-limit-reached
  title: IBV_EVENT_SRQ_LIMIT_REACHED
  aliases:
    - SRQ Limit Reached
    - SRQ low watermark
  category: distributed_comm
  likely_owner: infrastructure
  related_readme_anchor: ibv-event-srq-limit-reached
  personas:
    tenant_sre:
      title: SRQ low-watermark hit (informational)
      summary: The number of WRs left in a Shared Receive Queue dropped below its configured limit. This is a flow-control hint to repost receive buffers, not an error.
      impact: None on its own. Untreated, it can lead to receiver-not-ready stalls if the SRQ runs dry.
      action: No action unless your application owns the SRQ. Library-managed SRQs (NCCL, UCX) repost automatically.
      support_details: None for typical workloads; if your application uses SRQs directly, log the SRQ depth at the time of the event.
    cloud_operator:
      title: IBV_EVENT_SRQ_LIMIT_REACHED - SRQ low watermark
      summary: SRQ depth crossed below the configured limit and the device fired the rearm notification.
      impact: None on its own. Frequent firing means the application is undersized on receive buffers and may eventually starve the SRQ.
      action: No fabric remediation; identify the owning ULP from the device and PD, and route the tuning suggestion (raise SRQ depth or post rate) to the application owner.
      support_details: Device, PID/process owning the SRQ, SRQ size and configured limit, posting rate.
  technical_details: |
    IBV_EVENT_SRQ_LIMIT_REACHED is generated when the number of outstanding WRs on a Shared Receive Queue drops below the user-configured limit. It signals the application to post more WRs and rearm the SRQ; it is not a failure.
  summary: A Shared Receive Queue dropped below its configured low-watermark limit; the application should repost receive buffers and rearm the SRQ.
  signals:
    - kind: log
      pattern: 'IBV_EVENT_SRQ_LIMIT_REACHED'
      note: libibverbs async-event log
    - kind: log
      pattern: 'async event.*SRQ limit'
      note: ULP async-event handler
