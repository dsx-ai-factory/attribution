    cloud_operator:
      title: IBV_WC_FATAL_ERR - HCA fatal transport error, drain the node
      summary: HCA signaled a fatal transport error. Recovery typically requires module reload, HCA reset, or node reboot. Treat as a hardware-affecting event until proven otherwise.
      impact: Node-scoped. All QPs on the affected HCA are at risk; collectives across the node fail.
      action: Drain the node, capture mlx5_core dmesg, ibv_devinfo, ibstat counters, and full WC dump (vendor_err is critical), then attempt rmmod mlx5_ib && modprobe mlx5_ib or reboot if the HCA does not recover. File a vendor case if recurring.
