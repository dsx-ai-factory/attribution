- id: stale-file-handle
  title: Stale file handle
  aliases:
    - ESTALE
    - errno 116
    - stale NFS file handle
    - stale Lustre file handle
  category: storage
  likely_owner: ambiguous
  related_readme_anchor: stale-file-handle
  personas:
    tenant_sre:
      title: An open file's backing object disappeared on the server
      summary: Your syscall returned ESTALE (errno 116) - the kernel held an NFS or Lustre file handle whose underlying inode/object is no longer valid on the server. Typically the file was unlinked/replaced by another job, the storage failed over, or an OST went away.
      impact: The open fd is dead - read, write, stat, and close on it will keep returning ESTALE. The job step usually fails on the next checkpoint, dataset read, or shared-library load.
      action: 'Capture the failing path and the operation that returned ESTALE. Reopen by path - if that succeeds, retry the step once. If reopen also fails or the same path fails on multiple ranks, contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: The file path and operation, the rank/node where ESTALE was raised, the mount type (`mount | grep <path>`), the job ID, and the timestamp.
    cloud_operator:
      title: ESTALE on NFS or Lustre - server invalidated the client's handle
      summary: A client-side file handle no longer matches the server's view. On NFS this maps to NFS3ERR_STALE / NFS4ERR_STALE - inode generation changed (delete+recreate, server-side restore, failover). On Lustre it maps to a destroyed OST object or FID mismatch after target loss.
      impact: Per-fd on the originating client. Many ranks reporting ESTALE on the same path at the same time means the storage backend (export, OST, MDT) had an event - that is the place to look.
      action: 'Identify the mount with `findmnt <path>`. For NFS - run `nfsstat -m` and `nfsstat -c`, check `dmesg` for `NFS: server <ip> not responding`, verify `exportfs -v` on the server, and inspect the underlying export filesystem state. For Lustre - run `lfs check servers`, `lctl get_param osc.*.state mdc.*.state`, scan dmesg for paired `LustreError: ... -116`, and check OSS/MDS recovery state. Storage failover or target loss is the prime suspect.'
      support_details: Mount info (`findmnt`, `mount`), NFS version and options, `nfsstat -m` and `-c` output, `dmesg` excerpts, `lfs check servers` output if Lustre, server-side export/OSS state, recent failover events from the storage team.
  technical_details: |
    ESTALE (errno 116, "Stale file handle") is returned when the kernel presents a file handle to a network filesystem and the server reports the handle no longer maps to a valid object. On NFS this is NFS3ERR_STALE / NFS4ERR_STALE - the server's inode generation, fsid, or export fh has changed since the client cached the handle (causes - file unlinked and inode reused; export restored from backup; failover with different fsid; subtree_check rewrite). On Lustre it is returned when the OST object backing an open file has been destroyed or a FID lookup misses on the MDT (causes - OST loss, unexpected unlink across clients, target failover with state divergence). The error surfaces on `read(2)`, `write(2)`, `stat(2)`, `close(2)`, `mmap`-faulted page-ins, and reopen-by-handle paths. The fd cannot be salvaged - close and reopen by path, or treat the storage backend as unhealthy.
  summary: A network-filesystem file handle no longer maps to a server-side object; close the fd, reopen by path, and investigate the export/OST if the condition persists.
  signals:
    - kind: log
      pattern: 'Stale file handle'
      note: glibc / kernel-translated ESTALE message
    - kind: log
      pattern: '\bESTALE\b'
      note: errno mnemonic in framework or dataloader stack traces
    - kind: log
      pattern: 'errno (?:=|:)?\s*116'
      note: numeric errno in C/Python wrappers
    - kind: log
      pattern: 'NFS: server.*not responding|NFS: stale (?:fh|filehandle)'
      note: NFS-side kernel log
    - kind: log
      pattern: 'cannot open shared object file: Stale file handle'
      note: dynamic linker hitting ESTALE on .so load
  related:
    - lustreerror
    - lustre-client-evicted
    - dataloader-exception
    - bad-kernel-stack-frame-pointer
  references:
