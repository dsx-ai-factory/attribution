      summary: Inspect whether the failure pins to a single (iteration, rank) pair before blaming hardware.
      impact: The optimizer step aborts and the run terminates at the offending micro-batch.
      action: Re-run with deterministic data ordering, lower learning rate, gradient clipping, or fp32 master weights; capture the iteration index and rank to bisect the dataset shard.
