      title: A CPU on your node hung and the kernel watchdog killed the host
      summary: The Linux NMI watchdog detected a CPU that stopped servicing interrupts and reported a hard lockup; the host
        is unrecoverable without a reboot.
      impact: All processes on the affected node are lost; the job dies and must be resubmitted to a healthy node.
      action: Your remediation system should first restart the affected node's operating system (a VM reboot on a virtualized
        GPU, a host-level reboot on bare metal). If the job still fails on this node, contact your cluster administrator or
