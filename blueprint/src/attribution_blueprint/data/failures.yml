      summary: Pyxis aborted in a hook with a non-specific error code; common causes are SPANK ABI mismatch, missing enroot on PATH, or broken post-install state.
      impact: Symptom is per-node when toolkit packages are inconsistent and cluster-wide when Slurm was upgraded without rebuilding Pyxis.
      action: Compare Slurm version against Pyxis build (`spank.h` ABI), confirm `enroot version` resolves on every compute node, and audit `/etc/slurm/plugstack.conf` for stale plugin paths.
