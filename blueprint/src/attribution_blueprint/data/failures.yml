      summary: A connection reported that its destination host was unreachable; inspect the endpoint and job-visible network
        configuration.
      impact: The affected operation may fail or prevent other ranks from progressing; check completion and output separately.
      action: |-
        1. Check the peer address, port and hostname supplied by the job against the intended rendezvous or service endpoint. Verify that the peer job process started and that the application uses the provider-supported network for this allocation.

        2. Correct only an endpoint/interface setting you own; request provider investigation for routing, firewall or host access instead of changing those yourself. Use guidance for the installed framework, runtime and communication-library versions, and change only job/application settings you control.

        3. After a confirmed correction, run one small safe fresh-job test and verify all participating ranks complete the affected step with valid results.

        4. If it fails again, the cause is unclear, or changes need permissions you lack, stop and contact the person or team responsible for your application; ask your cluster administrator or cloud provider for restricted host, network or shared-service investigation. Do not repeatedly run the full job or change host services to suppress the error.
