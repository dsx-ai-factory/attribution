  technical_details: 'The Linux soft-lockup watchdog detects a CPU that remains in kernel execution without allowing other
    tasks to schedule for longer than the configured threshold. With `kernel.softlockup_panic` or the equivalent boot-time
    setting enabled, the watchdog calls `panic("softlockup: hung tasks")`, which emits `Kernel panic - not syncing: softlockup:
    hung tasks`. The accompanying instruction pointer and backtrace capture execution state at detection and are diagnostic
    context rather than an independent panic signal.

