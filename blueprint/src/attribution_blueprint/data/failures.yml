      summary: An NVLINK_NETIR_ERROR was raised on a GB200 GPU, meaning the NVLink path to its NVSwitch reported a network-interface event such as alignment loss or PHY retransmit timeout.
      impact: This is usually the root-cause XID and any cascade XIDs after it are secondary; the affected NVLinks become inactive and any collective spanning them fails.
      action: Requeue on a healthy allocation, attach the full dmesg Xid 149 line including the subcode (149.2/.4/.10/.22/.30/.33/.37/.42), NCCL_DEBUG=INFO output and the timestamp to your ticket.
      support_details: Job ID, failing rank/node, full dmesg Xid 149 payload (intrInfo, errorStatus, debug data, subcode), NCCL log excerpt, scheduler node-state output.
    cloud_operator:
      title: XID 149 NVLINK_NETIR_ERROR - decode subcode then run fabric recovery
      summary: 'NVRM raised an NVLINK_NETIR_ERROR on a GB200/NVLink5 GPU; XID 149 is the root-cause indicator for fabric port-down events and has multiple sub-codes (.2, .4, .10, .22, .30, .33, .37, .42).'
      impact: When seen across multiple nodes in the same NVLink domain it usually traces back to an NVSwitch reset or trunk fault; isolated occurrences usually clear with a single-node FM and GPU reset
        cycle.
      action: 'Decode the subcode from dmesg, cross-check NVSwitch SXids and switch logs for reset events. Drain the node, stop nv-fabricmanager, run `nvidia-smi -r`, restart nv-fabricmanager, validate with `nvidia-smi nvlink -s` and `nvidia-smi nvlink -e`. If the fault recurs after firmware upgrade, refer to official NVIDIA documentation.'
