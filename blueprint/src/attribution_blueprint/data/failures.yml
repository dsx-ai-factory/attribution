- id: nv-err-insufficient-resources-mem-multicast-fabric-c
  title: nv_err_insufficient_resources-mem_multicast_fabric.c
  aliases:
  - NV_ERR_INSUFFICIENT_RESOURCES mem_multicast_fabric.c
  - GB200 NVL72 multicast fabric allocation failure
  - MNNVL multicast resource exhaustion
  category: gpu
  likely_owner: infrastructure
  related_readme_anchor: nv-err-insufficient-resources-mem-multicast-fabric-c
  personas:
    tenant_sre:
      title: GB200 multicast fabric allocation fails on outdated GPU driver
      summary: Your GB200 NVL72 job aborts with NV_ERR_INSUFFICIENT_RESOURCES from mem_multicast_fabric.c when the host runs an older GPU driver that mis-sizes multicast fabric resources.
      impact: NCCL initialization or CUDA multicast allocations fail at job start; collectives never form and the training step never runs.
      action: 'Resubmit on a node pool with the supported GB200 driver level, capture NCCL_DEBUG=INFO and the CUDA error string. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: Job ID, allocation node list, NCCL_DEBUG=INFO output, CUDA error message, requested multicast group size, output of nvidia-smi from inside the container.
    cloud_operator:
      title: mem_multicast_fabric.c returns NV_ERR_INSUFFICIENT_RESOURCES due to stale GPU driver on GB200 NVL72
      summary: NVRM driver fails to allocate MEM_MULTICAST_FABRIC objects on GB200 NVL72 because the installed GPU driver predates the multicast resource sizing fix.
      impact: Per-node fault that breaks every multicast-using workload on that host until the driver is upgraded; Fabric Manager itself stays up.
      action: Drain the node, upgrade the GPU driver to the GB200-validated release, reload nvidia and nv-fabricmanager, then run a small MNNVL nvbandwidth multicast smoke test before un-draining.
      support_details: Output of nvidia-smi --query-gpu=driver_version, dmesg NVRM lines around the failure, /var/log/fabricmanager.log, kernel module versions (modinfo nvidia), and the GB200 platform firmware
        bundle version.
  technical_details: 'Symptom observed on GB200 NVL72 fleets where the GPU driver predates

    the multicast-fabric sizing fix in mem_multicast_fabric.c. NVRM

    returns NV_ERR_INSUFFICIENT_RESOURCES when CUDA or NCCL tries to

    allocate a multicast fabric object, even though the hardware has

    capacity. Resolution is a driver upgrade on the affected nodes.

    '
  summary: GB200 NVL72 jobs hitting NV_ERR_INSUFFICIENT_RESOURCES from mem_multicast_fabric.c need a GPU driver upgrade on the host.
  signals:
  - kind: log
    pattern: NV_ERR_INSUFFICIENT_RESOURCES
    note: NVRM error string in driver / application log
  - kind: log
    pattern: mem_multicast_fabric\.c
