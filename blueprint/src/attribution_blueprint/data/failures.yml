    pattern: 'NVRM: Xid \(.*\): 48'
    note: DBE / uncorrectable ECC
  - kind: log
    pattern: ECC.*(SBE|DBE)
    note: nvidia driver log
  - kind: log
    pattern: \bNV_PGSP_FALCON_IRQSTAT_FATAL_ERROR\b
    note: Requires XID-94 and NV_ERR_RESET_REQUIRED on the same node for poisoned gsp.
