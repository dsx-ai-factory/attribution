  summary: Lustre forcibly disconnected the client from a storage target; file operations can hang or fail across the affected
    node.
  signals:
  - kind: log
    pattern: LustreError.*evicted
    note: kernel log
  - kind: log
    pattern: client.*evicted
    note: filesystem layer
  - kind: log
    pattern: lustre.*timeout
    note: client RPC timeout
  related:
  - rdma-fabric-flap
  - dataloader-exception
  references:
