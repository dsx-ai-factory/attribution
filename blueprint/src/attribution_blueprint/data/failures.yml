    tenant_sre:
      title: RDMA queue pair went fatal
      summary: NCCL surfaces a QP fatal error meaning a peer-to-peer RDMA connection cannot generate completions and is dead.
      impact: The collective using that QP fails; in NCCL the affected ranks abort and the job typically terminates.
      action: 'Preserve NCCL logs, note which ranks/nodes saw the event. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
