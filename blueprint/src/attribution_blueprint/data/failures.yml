- id: ncclinternalerror
  title: ncclInternalError
  aliases:
  - ncclInternalError
  - NCCL internal error
  - NCCL_ERROR_INTERNAL
  category: distributed_comm
  likely_owner: ambiguous
  personas:
    tenant_sre:
      title: ncclInternalError
      summary: NCCL reported an internal error; preserve the diagnostics needed by the application/library owner.
      impact: The affected operation may fail or prevent other ranks from progressing; check completion and output separately.
      action: |-
        1. Preserve the first failure before teardown. If you can edit the job and diagnostic logging is permitted, collect `NCCL_DEBUG=INFO` during one small safe reproduction; logs may contain environment details and need redaction. Send the trace to the application/library owner for a supported fix instead of guessing network settings. Do not reuse a failed communicator outside the framework's recovery procedure.

        2. Use guidance for the installed framework, runtime and communication-library versions, and change only job/application settings you control. After a confirmed correction, run one small safe fresh-job test and verify all participating ranks complete the affected step with valid results.

        3. If it fails again, the cause is unclear, or changes need permissions you lack, stop and contact the person or team responsible for your application; ask your cluster administrator or cloud provider for restricted host, network or shared-service investigation. Do not repeatedly run the full job or change host services to suppress the error.
      support_details: Provide the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs) when available, job/time,
        framework/CUDA/NCCL or MPI/PMIx versions as applicable, full permitted NCCL trace, failing operation, ranks/nodes and supported
        package combination, and the correction/test result. Share only logs you can access; remove credentials and private input
        data. Ask the provider to collect restricted diagnostics. When asking for help, send the evidence available to you and say
        what is missing; do not delay the request because a diagnostic report or restricted logs are unavailable.
  technical_details: An internal NCCL result needs library-level investigation. An earlier warning can help, but a warning
    identifying the cause is not guaranteed.
  summary: NCCL reported an internal error; preserve the diagnostics needed by the application/library owner.
  signals:
  - kind: log
    pattern: ncclInternalError
    note: NCCL result code in rank logs or framework wrapper
  - kind: log
    pattern: NCCL WARN .*has no transport for
    note: common underlying cause - missing transport between ranks
  - kind: log
    pattern: NCCL INFO.*Init COMPLETE
    note: presence/absence helps localize the failure to bootstrap vs steady-state
  related:
  - ncclsystemerror
  - ncclremoteerror
  - pytorch-nccl-watchdog
  references:
  - title: NCCL return codes and data types
    url: https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/api/types.html
  - title: NCCL environment variables
    url: https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/env.html
  - title: NCCL communicator lifecycle and error recovery
    url: https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/usage/communicators.html
  severity: medium
  verification: draft
  last_reviewed: 2026-04-25
