  personas:
    tenant_sre:
      title: Remote peer rejected the verbs request as invalid
      summary: The peer responded with an invalid-request NAK - the operation was not legal for its QP, the receive buffer was too small for the send, or required QP attributes were missing on the responder. The sender's WC reflects the peer's fault.
      impact: The sending rank fails; the collective aborts. Fix the peer, not the sender.
      action: 'Capture NCCL/MPI logs and identify both the failing rank and the peer. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: NCCL/MPI logs, rank/node mapping, peer rank/node, the IBV_WC_REM_INV_REQ_ERR line, message size, and the failing collective.
    cloud_operator:
      title: IBV_WC_REM_INV_REQ_ERR - responder NAK invalid request
      summary: 'Responder QP signaled invalid-request: opcode unsupported, receive buffer smaller than inbound send, or QP attributes missing for the operation. Fault is on the peer; sender is the messenger.'
      impact: Per-QP-pair. Many peers reporting the same against one node points to that node's responder configuration.
      action: On the peer node, dump qp_state and posted-receive depth via mlx5dv, verify QP transport supports the operation, and correlate with mlx5_core dmesg. Compare ibv_devinfo and firmware between the two ends.
