- id: terminate-called
  title: terminate called
  aliases:
  - terminate called
  - std::terminate
  - terminate called without an active exception
  category: application
  likely_owner: ambiguous
  related_readme_anchor: terminate-called
  personas:
    tenant_sre:
      title: Process aborted via std::terminate - look upstream
      summary: A C++ runtime called std::terminate(), aborting the process. This is the tail of the chain - the actual cause is whatever exception or error was thrown just before.
      impact: The rank exits, which usually drags the rest of the distributed job down.
      action: Search the log for the lines immediately before "terminate called" - CUDA errors, NCCL errors, uncaught exceptions, or SIGABRT/SIGSEGV. Re-run with NCCL_DEBUG=INFO if a CUDA/NCCL error is suspected.
      support_details: The 50-100 log lines preceding "terminate called", framework version, NCCL version, job ID, rank-to-node mapping.
    cloud_operator:
      title: std::terminate - downstream of an unhandled error
      summary: The C++ runtime aborted because an exception was unhandled or an explicit terminate was triggered. This message is never the root cause.
      impact: One rank dies; collective deadlocks the rest of the job. Recovery cost depends on the upstream cause.
      action: Treat as a marker. Pull dmesg for XIDs and OOM-killer activity, check coredump if produced, and look for the preceding ncclError* / cudaError* / verbs error in the rank log.
      support_details: Coredump if available, dmesg, preceding rank log, env dump, framework/NCCL/CUDA versions.
  technical_details: |
    "terminate called" is emitted by the C++ runtime (libstdc++/libc++) when std::terminate() runs - typically because an exception escaped a noexcept boundary, no handler matched a thrown exception, or the runtime explicitly invoked it after a fatal condition. The string itself carries no diagnostic value; the diagnostic value is in the lines above it.
  summary: The C++ runtime aborted the process via std::terminate; the real cause is the error or exception logged immediately before it.
  signals:
  - kind: log
    pattern: 'terminate called'
    note: libstdc++/libc++ abort marker
  - kind: log
    pattern: 'terminate called (?:after throwing an instance of|without an active exception)'
    note: more specific variants
  - kind: log
    pattern: 'Aborted \(core dumped\)'
