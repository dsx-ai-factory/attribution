    pattern: 'ibv_open_device failed'
    note: libibverbs / NCCL / UCX
  - kind: log
    pattern: 'Failed to open .*uverbs[0-9]+'
    note: rdma-core user-space
  - kind: log
    pattern: 'No (RDMA|IB) devices? found'
    note: NCCL transport probe
