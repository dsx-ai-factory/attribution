  category: distributed_comm
  likely_owner: ambiguous
  related_readme_anchor: ibv-wc-resp-timeout-err
  personas:
    tenant_sre:
      title: Responder failed to reply within the timeout window
      summary: The peer did not respond to the request within the configured timeout. In NCCL/MPI this typically pairs with a slow or hung peer, a fabric path that is dropping responses, or an undersized timeout for the path.
      impact: The sending rank fails; the collective aborts. The peer or the fabric path is the place to look.
      action: 'Capture NCCL/MPI logs, identify both ranks. Contact your cluster administrator or cloud provider. Include the NVIDIA Attribution diagnosis (verdict, symptom chain, and source logs).'
      support_details: NCCL/MPI logs, rank/node mapping, peer rank/node, the IBV_WC_RESP_TIMEOUT_ERR line, the QP timeout/retry attributes if available, and any peer-side slowness signals.
    cloud_operator:
      title: IBV_WC_RESP_TIMEOUT_ERR - responder did not reply in time
      summary: 'Requester timed waiting for a response. Distinguish from RETRY_EXC: timeout indicates the responder was reachable but slow; retry-exhausted means no response at all.'
      impact: Per-QP at the sender; root cause is on the peer or in the path.
      action: Check peer-node health (process, GPU, kernel softlockup), pull ibstat and mlx5_core dmesg from both ends, inspect UFM for path congestion or BER spikes, and verify QP timeout/retry settings (qp_attr.timeout, retry_cnt) suit the cluster diameter.
      support_details: Both endpoints' HCA model, firmware, peer GUID, full WC dump, ibstat counters, mlx5_core kernel logs, UFM congestion/BER events, QP timeout settings.
  technical_details: |
    IBV_WC_RESP_TIMEOUT_ERR (status 20) is generated when the responder fails to respond to a request within the configured timeout. Unlike RETRY_EXC_ERR, this status indicates the responder side was reachable but slow to ACK the operation.
  summary: The peer did not respond in time; investigate peer responsiveness, fabric path congestion, and QP timeout settings.
  signals:
    - kind: log
      pattern: 'IBV_WC_RESP_TIMEOUT_ERR'
      note: NCCL WARN / verbs library
    - kind: log
      pattern: 'wc\.status\s*=?\s*20\b'
      note: numeric WC status 20
    - kind: log
