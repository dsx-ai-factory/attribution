  technical_details: 'SIGBUS (signal 7 on most Linux/x86) is delivered when a process performs a misaligned memory access on an enforcing architecture, accesses a memory-mapped file beyond its end, or experiences
    a hardware bus fault — for example a PCIe AER on device-mapped memory. It is distinct from SIGSEGV, which signals invalid virtual addresses.

    '
