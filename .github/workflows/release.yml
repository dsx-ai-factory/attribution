name: Release

# Fires only when a merge to main touches a `__version__` literal, so an ordinary
# merge never shows a tag run. The script still gates on the literal moving: a
# touch that leaves the version unchanged prints NOOP rows and creates nothing.
on:
  push:
    branches:
      - main
    paths:
      - service/attribution-lib/src/attribution_lib/__init__.py
      - service/service-app/app/__init__.py
      - blueprint/src/attribution_blueprint/__init__.py

# Serialise tag runs so two quick merges never race on the latest-tag lookup.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

env:
  # Same interpreter release-checks.yml uses, so release.py runs on what the service ships.
  UV_PYTHON: "3.14.6"

jobs:
  tag:
    name: tag-on-merge
    if: github.ref == 'refs/heads/main'
    runs-on: linux-arm64-cpu16
    # GITHUB_TOKEN with contents:write creates the tags; its pushes do not
    # trigger workflows (nothing listens on tags anyway).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Full history + tags: latest-tag lookup, distance, and `git show <before>:` need them.
          # Credentials stay persisted so `git push` of the tag works.
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Configure git identity for annotated tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Tag released components
        env:
          BEFORE: ${{ github.event.before }}
        run: uv run .ci/release.py tag --before "$BEFORE"
