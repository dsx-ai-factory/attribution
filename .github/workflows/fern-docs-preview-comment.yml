# Workflow 2 of 2 for Fern doc previews.
#
# Triggered by workflow_run after "Preview Fern Docs: Build" completes.
# Builds a preview with FERN_TOKEN and posts a stable :herb: comment on the PR.
#
# Trust model: this job runs the Fern CLI with FERN_TOKEN in its environment,
# against docs/ content written by the PR author. Fern pages can read files
# outside docs/ (for example a Code src path with ../), so an author who controls
# those pages can read the runner's environment, including the token, and print
# it on a public preview page. This job therefore runs only for pull requests
# from branches in this repository, whose authors can already read repository
# secrets. Pull requests from forks are not previewed.
#
# The artifact is still treated as untrusted. The Fern CLI runs against fern/
# from the default branch (a trusted checkout); only the PR's docs/ content is
# copied in from the artifact, with symlinks removed. The PR number is validated
# as numeric and must belong to the commit and repository of the triggering run,
# and the preview URL host is checked before use. Consequence: a PR that edits
# fern/ (docs.yml, components, theme) is not previewed with those edits until it
# is merged.
#
# Required configuration:
# - Organization secret: FERN_TOKEN (from `fern token` for the nvidia Fern org)

name: "Preview Fern Docs: Comment"

on:
  workflow_run:
    workflows: ["Preview Fern Docs: Build"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same-repository branches only; see the trust model above. head_repository
    # is set by GitHub and cannot be changed by the pull request author.
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    steps:
      - name: Download fern sources and metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fern-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and read PR metadata
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          PR_NUMBER=$(cat preview-metadata/pr_number)
          # [[ =~ ]] matches the whole string; grep -E is per line and would let
          # "12<newline>foo=bar" through into $GITHUB_OUTPUT.
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid pr_number in artifact"
            exit 1
          fi
          # The artifact is untrusted, and a fork can change the build workflow
          # to name any PR number. Only accept a PR whose head is the commit and
          # repository that produced this run. For a pull_request run,
          # workflow_run.head_sha is the PR's head commit, not GitHub's synthetic
          # merge commit, so it matches the API's head.sha.
          PR_HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '[.head.sha, (.head.repo.full_name // "")] | @tsv')
          if [ "$PR_HEAD" != "$(printf '%s\t%s' "$RUN_HEAD_SHA" "$RUN_HEAD_REPO")" ]; then
            echo "::error::pr_number ${PR_NUMBER} in the artifact does not match the commit and repository of this run"
            exit 1
          fi
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      # No ref: a workflow_run checkout defaults to the default branch, which is
      # the trusted tree we want.
      - name: Checkout trusted tree from the default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          path: trusted

      - name: Overlay the PR's docs content on the trusted tree
        run: |
          set -euo pipefail
          rm -rf trusted/docs
          cp -r docs trusted/docs
          # A symlink in PR content could make the CLI read and upload runner files.
          find trusted/docs -type l -delete

      # Run the checker from the trusted tree on the PR's docs before any step
      # that has FERN_TOKEN. It is a deny-list, so it backs up the same-repository
      # condition above and does not replace it.
      - name: Check the PR's docs paths stay inside docs
        run: >-
          python3 trusted/tools/check-docs-paths
          --exclude 'trusted/docs/attribution-tour/*'
          --exclude 'trusted/docs/github-pages.md'
          --allow '../docs/index.yml'
          trusted/docs trusted/fern

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install Fern CLI
        # Intentionally unpinned: Fern ships often with no LTS channel and the
        # NVIDIA global theme tracks the latest CLI, so a pin goes stale and
        # breaks more than it protects. Do not pin.
        run: npm install -g fern-api@latest

      - name: Generate preview URL
        id: generate-docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
        working-directory: ./trusted/fern
        run: |
          set -o pipefail
          fern generate --docs --preview --id "pr-${PR_NUMBER}" 2>&1 | tee /tmp/fern-output.log
          # Fern prints "Published docs to URL", sometimes followed by " (URL)".
          URL=$(sed -n 's/.*Published docs to \(https:[^[:space:]]*\).*/\1/p' /tmp/fern-output.log | tail -1)
          if [ -z "$URL" ]; then
            echo "::error::Failed to generate preview URL. See fern output above."
            exit 1
          fi
          if ! printf '%s' "$URL" | grep -qE '^https://[a-zA-Z0-9._-]+\.buildwithfern\.com([/:?#]|$)'; then
            echo "::error::Unexpected preview URL host (expected buildwithfern.com): ${URL}"
            exit 1
          fi
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build page links for changed files
        id: page-links
        env:
          PREVIEW_URL: ${{ steps.generate-docs.outputs.preview_url }}
        run: |
          CHANGED_FILES=""
          if [ -f preview-metadata/changed_md_files ]; then
            CHANGED_FILES=$(cat preview-metadata/changed_md_files)
          fi

          if [ -z "$CHANGED_FILES" ] || [ -z "$PREVIEW_URL" ]; then
            echo "page_links=" >> "$GITHUB_OUTPUT"; exit 0
          fi

          BASE_URL="${PREVIEW_URL%/}"
          FILES_PARAM=$(echo "$CHANGED_FILES" | tr '\n' ',' | sed 's/,$//' \
            | python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read().strip(), safe=',/'))")
          RESPONSE=$(curl -sf "${PREVIEW_URL}/api/fern-docs/get-slug-for-file?files=${FILES_PARAM}" 2>/dev/null) || {
            echo "page_links=" >> "$GITHUB_OUTPUT"; exit 0
          }

          PAGE_LINKS=$(echo "$RESPONSE" | jq -r --arg url "$BASE_URL" \
            '.mappings[] | select(.slug != null) | "- [\(.slug)](\($url)/\(.slug))"')

          if [ -n "$PAGE_LINKS" ]; then
            { echo "page_links<<EOF"; echo "$PAGE_LINKS"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "page_links=" >> "$GITHUB_OUTPUT"
          fi

      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
          PREVIEW_URL: ${{ steps.generate-docs.outputs.preview_url }}
          PAGE_LINKS: ${{ steps.page-links.outputs.page_links }}
        run: |
          BODY=":herb: **Preview your docs:** <${PREVIEW_URL}>"
          if [ -n "${PAGE_LINKS}" ]; then
            BODY="${BODY}

          Here are the markdown pages you've updated:
          ${PAGE_LINKS}"
          fi

          MARKER="<!-- preview-docs -->"
          BODY="${BODY}

          ${MARKER}"

          # Match only this bot's own comment, so a contributor who posts the
          # marker cannot block the preview comment. Paginate so an older
          # comment is still found on a PR with many comments.
          COMMENT_ID=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${MARKER}\"))) | .id" \
            | tr -d '\r' | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              -X PATCH -f body="$BODY"
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$BODY"
          fi
