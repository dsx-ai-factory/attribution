name: Release checks

on:
  pull_request:
    types:
      - opened
      # Retargeting a pull request's base branch fires only "edited".
      - edited
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same interpreter tests.yml uses, so release.py runs on what the service ships.
  UV_PYTHON: "3.14.6"

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Latest tags and distance need the full history and the tags.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Test CI tooling
        run: bash .ci/run-tests.sh ci-tests
      - name: Release status
        # release.py compares at the merge-base of the base branch and HEAD, so a
        # branch behind its base is not blamed for the base's bumps.
        run: uv run .ci/release.py status --base "origin/$BASE_REF"
      - name: Release check
        run: uv run .ci/release.py check --base "origin/$BASE_REF" ${{ github.base_ref == github.event.repository.default_branch && '--light' || '' }}
      - name: Cherry-pick check
        if: startsWith(github.base_ref, 'release/')
        env:
          # HEAD is the PR's test merge commit, which the check would reject as a merge.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAIN_REF: origin/${{ github.event.repository.default_branch }}
        run: uv run .ci/cherry_pick_check.py --base "origin/$BASE_REF" --head "$HEAD_SHA" --main "$MAIN_REF"
