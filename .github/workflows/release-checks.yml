name: Release checks

on:
  push:
    # Same reasoning as tests.yml: "pull_request" events are not permitted on
    # the self-hosted runners, so every branch (including copy-pr-bot
    # "pull-request/<N>" mirrors) gets its advisory check from the push event.
    # main is skipped: release.yml re-runs the checks and tags after the merge.
    branches-ignore:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same interpreter tests.yml uses, so release.py runs on what the service ships.
  UV_PYTHON: "3.14.6"

jobs:
  check:
    runs-on: linux-arm64-cpu16
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Latest tags and distance need the full history and the tags.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Test CI tooling
        run: bash .ci/run-tests.sh ci-tests
      - name: Release status
        # release.py compares at the merge-base of origin/main and HEAD, so a
        # branch behind main is not blamed for main's bumps.
        run: uv run .ci/release.py status --base origin/main
      - name: Release check
        run: uv run .ci/release.py check --base origin/main
