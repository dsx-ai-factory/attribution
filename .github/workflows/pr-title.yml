name: PR Title

# Squash merges use the PR title as the commit subject on main, so the title is
# the only thing linted; individual branch commits are not.
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    name: conventional-commits
    runs-on: ubuntu-latest
    steps:
      # Third-party action, pinned by SHA; checks only the title, not branch commits.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
