name: Tests

on:
  push:
    # "pull_request" events are not permitted on NVIDIA self-hosted runners,
    # so CI runs from push events instead. "**" covers main, every feature
    # branch (including flat names like "patch-1" that a slash-bearing
    # pattern would miss), and copy-pr-bot "pull-request/<N>" mirrors.
    #
    # Pull requests from forks push to the fork, not here, so they get no
    # CI from this workflow.
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # One interpreter for every Python component. service-app declares
  # requires-python ">=3.14.6,<3.15" and is the binding constraint;
  # attribution-lib and blueprint allow >=3.11. Pinned to the exact patch
  # because a bare "3.14" resolves to 3.14.3 on linux-aarch64.
  UV_PYTHON: "3.14.6"

jobs:
  secret-scan:
    name: secret-scan
    runs-on: linux-arm64-cpu16
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: |
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            --workdir /repo \
            ghcr.io/trufflesecurity/trufflehog@sha256:ff4c95e9df7d645daf2140e3ca1039031c63106268d5fbb25feb43ceca1bcc33 \
            git file:///repo \
            --no-json \
            --no-verification \
            --fail \
            --exclude-detectors=Lob \
            --exclude-paths=/repo/.trufflehog-exclude-paths \
            --branch HEAD \
            --max-depth 100 \
            --no-update \
            --github-actions

  python-tests:
    name: ${{ matrix.suite }}
    needs: secret-scan
    if: ${{ always() }}
    runs-on: linux-arm64-cpu16
    strategy:
      fail-fast: false
      matrix:
        suite:
          - attribution-lib
          - service-app
          - service-app-client-drift
          - blueprint
    env:
      COVERAGE: "true"
    steps:
      - name: Require successful secret scan
        if: ${{ needs.secret-scan.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Run ${{ matrix.suite }} with coverage
        run: bash .ci/run-tests.sh "${{ matrix.suite }}"

  frontend-tests:
    name: frontend
    needs: secret-scan
    if: ${{ always() }}
    runs-on: linux-arm64-cpu16
    env:
      COVERAGE: "true"
    steps:
      - name: Require successful secret scan
        if: ${{ needs.secret-scan.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate
      - name: Run frontend tests with coverage
        run: bash .ci/run-tests.sh frontend

  end-to-end:
    name: end-to-end
    needs: secret-scan
    if: ${{ always() }}
    runs-on: linux-arm64-cpu16
    steps:
      - name: Require successful secret scan
        if: ${{ needs.secret-scan.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Run end-to-end tests
        run: bash .ci/run-tests.sh end-to-end
