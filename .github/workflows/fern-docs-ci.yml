# Validates Fern docs configuration on pull requests.
#
# Runs on every pull request (no trigger-level paths filter) so that making
# "Fern Check" a required status check never leaves PRs that do not touch docs
# stuck pending. The "Detect docs changes" step skips the expensive steps and
# the job still passes when no docs-related files changed.
#
# docs/attribution-tour/ is a separate Slidev project with its own Pages
# workflow, and docs/github-pages.md documents it. Neither is published through
# Fern, so the filename and MDX checks below exclude them.

name: Fern Docs CI

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fern-check:
    name: Fern Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Depth 2 so HEAD^1 (the base side of the PR merge commit) is available.
          fetch-depth: 2
          persist-credentials: false

      - name: Detect docs changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # --no-renames lists both sides of a rename. Non-PR events always validate.
          if [ "$EVENT_NAME" = "pull_request" ] && \
             ! git diff --name-only --no-renames HEAD^1 HEAD \
               | grep -qE '^(docs/|fern/|tools/check-docs-(mdx|paths)$|\.github/workflows/fern-docs-ci\.yml$)'; then
            echo "docs=false" >> "$GITHUB_OUTPUT"
            echo "No docs-related changes; skipping Fern validation."
          else
            echo "docs=true" >> "$GITHUB_OUTPUT"
          fi

      # Warn only for now. Renaming published pages changes their URLs, so the
      # existing uppercase names are cleaned up separately before this hardens.
      - name: Warn on non-lowercase or underscore markdown filenames
        if: steps.changes.outputs.docs == 'true'
        run: |
          find docs -name '*.md' -not -path 'docs/attribution-tour/*' -not -name 'github-pages.md' | while read -r f; do
            base=$(basename "$f")
            if echo "$base" | grep -qE '[A-Z]|_'; then
              suggested=$(echo "$base" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
              echo "::warning file=$f::Filename '$base' should be lowercase with hyphens (e.g. '$suggested')"
            fi
          done

      - name: Setup Node.js
        if: steps.changes.outputs.docs == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install Fern CLI
        if: steps.changes.outputs.docs == 'true'
        # Intentionally unpinned: Fern ships often with no LTS channel and the
        # NVIDIA global theme tracks the latest CLI, so a pin goes stale and
        # breaks more than it protects. Do not pin.
        run: npm install -g fern-api@latest

      - name: Check MDX safety
        if: steps.changes.outputs.docs == 'true'
        run: >-
          python3 tools/check-docs-mdx
          --exclude 'docs/attribution-tour/*'
          --exclude 'docs/github-pages.md'
          docs fern

      # Fern reads any file a page or its configuration names, including paths
      # that leave docs/. The publish job runs with FERN_TOKEN, so reject such
      # paths before they merge. fern/docs.yml points at ../docs/index.yml by
      # design, and that is the only path allowed to leave its directory.
      - name: Check docs paths stay inside docs
        if: steps.changes.outputs.docs == 'true'
        run: >-
          python3 tools/check-docs-paths
          --exclude 'docs/attribution-tour/*'
          --exclude 'docs/github-pages.md'
          --allow '../docs/index.yml'
          docs fern

      - name: Fern check
        if: steps.changes.outputs.docs == 'true'
        run: fern check

      - name: Check MDX validity
        if: steps.changes.outputs.docs == 'true'
        run: fern docs md check

      - name: Check broken links
        if: steps.changes.outputs.docs == 'true'
        run: fern docs broken-links
