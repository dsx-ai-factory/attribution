name: Bug report
description: Report a reproducible problem in NVIDIA Attribution.
title: "[Bug]: "
labels:
  - bug
body:
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: I read the security policy and this report is not a security vulnerability.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest set of steps that reproduces the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the NVIDIA Attribution version, deployment method, and relevant platform details.
    validations:
      required: true
